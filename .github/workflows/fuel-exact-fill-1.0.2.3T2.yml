name: Publish exact fuel fill box

on:
  push:
    branches:
      - fuel-exact-fill-1.0.2.3T2

permissions:
  contents: write

env:
  BASE_SHA: 2a0877913546e37cae8bac7b6f12c4a2b0c86e4d
  MAIN_SHA: 11705c56cac4433cf4adeef06b9a3a4cc4230e8c
  TAG: v1.0.2.3T2
  ZIP_NAME: FS25_Ursus_1654_1954_Pack.zip
  WORKFLOW_FILE: .github/workflows/fuel-exact-fill-1.0.2.3T2.yml

jobs:
  validate-build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact test source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard base and approved scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/weight2500-ai-agent-1.0.2.3T1 | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN_SHA"
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          import xml.etree.ElementTree as ET

          base = "2a0877913546e37cae8bac7b6f12c4a2b0c86e4d"
          expected_files = sorted([
              ".github/workflows/fuel-exact-fill-1.0.2.3T2.yml",
              "VERSION",
              "Ursus1934.i3d",
              "Ursus1934.xml",
              "modDesc.xml",
          ])
          changed = sorted(subprocess.check_output(
              ["git", "diff", "--name-only", f"{base}..HEAD"], text=True
          ).splitlines())
          if changed != expected_files:
              raise SystemExit(f"Nieoczekiwany zakres zmian: {changed}")

          expected_blobs = {
              "Ursus1934.i3d": "5e32a71388966cf68674f5cb0e4115a40bb2ec3e",
              "Ursus1934.xml": "594ebeba736b3a096d7301aefee9f2501e8eb981",
              "modDesc.xml": "3ed9bdddab68f6c8f733b351226a6bdf411063a3",
              "VERSION": "5e93da57b474674650d8aa95749a65efe466b731",
          }
          for name, expected in expected_blobs.items():
              got = subprocess.check_output(["git", "hash-object", name], text=True).strip()
              if got != expected:
                  raise SystemExit(f"Nieoczekiwana treść {name}: {got}")

          base_i3d = subprocess.check_output(
              ["git", "show", f"{base}:Ursus1934.i3d"], text=True
          )
          old_i3d = '''        <Shape shapeId="170" name="frontWeightWideShortCollisionBoxRight" translation="0.2 0.883008 1.78072" compoundChild="true" nodeId="7008" materialIds="42" castsShadows="false" receiveShadows="false" nonRenderable="true" collisionFilterGroup="0x10004" collisionFilterMask="0xfe3ffb83" />'''
          new_i3d = old_i3d + '''
        <Shape shapeId="170" name="exactFillRootNodeFuel" translation="0 1.1 0" scale="1.2 1.5 2" kinematic="true" compound="true" nodeId="7009" materialIds="42" castsShadows="false" receiveShadows="false" nonRenderable="true" collisionFilterGroup="0x40000000" collisionFilterMask="0x20000000" />'''
          expected_i3d = base_i3d.replace(old_i3d, new_i3d)
          if expected_i3d == base_i3d:
              raise SystemExit("Nie znaleziono zatwierdzonego miejsca dla boxa")
          if Path("Ursus1934.i3d").read_text(encoding="utf-8") != expected_i3d:
              raise SystemExit("Ursus1934.i3d zmieniono poza zatwierdzonym boxem")

          base_xml = subprocess.check_output(
              ["git", "show", f"{base}:Ursus1934.xml"], text=True
          )
          old_xml = '''            <dashboard valueType="fillLevel" displayType="ANIMATION" groups="MOTOR_ACTIVE" animName="fuelDisplay" />
          </fillUnit>'''
          new_xml = '''            <dashboard valueType="fillLevel" displayType="ANIMATION" groups="MOTOR_ACTIVE" animName="fuelDisplay" />
            <exactFillRootNode node="0>11|7" />
          </fillUnit>'''
          expected_xml = base_xml.replace(old_xml, new_xml)
          if expected_xml == base_xml:
              raise SystemExit("Nie znaleziono paliwowego fillUnit")
          if Path("Ursus1934.xml").read_text(encoding="utf-8") != expected_xml:
              raise SystemExit("Ursus1934.xml zmieniono poza przypisaniem exactFillRootNode")

          i3d_root = ET.parse("Ursus1934.i3d").getroot()
          nodes = i3d_root.findall(".//Shape[@name='exactFillRootNodeFuel']")
          if len(nodes) != 1:
              raise SystemExit(f"Nieprawidłowa liczba boxów paliwa: {len(nodes)}")
          node = nodes[0]
          expected_attrs = {
              "shapeId": "170",
              "translation": "0 1.1 0",
              "scale": "1.2 1.5 2",
              "kinematic": "true",
              "compound": "true",
              "nodeId": "7009",
              "nonRenderable": "true",
              "collisionFilterGroup": "0x40000000",
              "collisionFilterMask": "0x20000000",
          }
          for key, value in expected_attrs.items():
              if node.get(key) != value:
                  raise SystemExit(f"Nieprawidłowe {key}: {node.get(key)}")

          xml_root = ET.parse("Ursus1934.xml").getroot()
          fuel = xml_root.find("./fillUnit/fillUnitConfigurations/fillUnitConfiguration/fillUnits/fillUnit")
          exact = None if fuel is None else fuel.find("exactFillRootNode")
          if fuel is None or fuel.get("fillTypes") != "diesel" or exact is None or exact.get("node") != "0>11|7":
              raise SystemExit("Nieprawidłowe przypisanie boxa do paliwowego fillUnit(1)")

          weight_root = ET.parse("Weight2500kg.xml").getroot()
          agents = weight_root.findall("./ai/agentAttachment")
          if len(agents) != 1 or agents[0].attrib != {"useSize": "true"}:
              raise SystemExit("Utracono zatwierdzony obrys AI obciążnika 2500 kg")
          PY

      - name: Validate and build package
        run: |
          set -euo pipefail
          python3 tools/validate_current.py
          ./build.sh

      - name: Verify test ZIP
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          import zipfile
          from pathlib import Path

          path = Path("dist/FS25_Ursus_1654_1954_Pack.zip")
          with zipfile.ZipFile(path) as zf:
              names = zf.namelist()
              if len(names) != 67 or len(names) != len(set(names)):
                  raise SystemExit(f"Nieprawidłowa zawartość ZIP: {len(names)}")
              mod = ET.fromstring(zf.read("modDesc.xml"))
              if mod.findtext("version") != "1.0.2.3T2":
                  raise SystemExit("Nieprawidłowa wersja w ZIP")
              tractor = ET.fromstring(zf.read("Ursus1934.xml"))
              fuel = tractor.find("./fillUnit/fillUnitConfigurations/fillUnitConfiguration/fillUnits/fillUnit")
              exact = None if fuel is None else fuel.find("exactFillRootNode")
              if exact is None or exact.get("node") != "0>11|7":
                  raise SystemExit("ZIP nie zawiera przypisania exactFillRootNode")
              i3d = ET.fromstring(zf.read("Ursus1934.i3d"))
              nodes = i3d.findall(".//Shape[@name='exactFillRootNodeFuel']")
              if len(nodes) != 1 or nodes[0].get("collisionFilterGroup") != "0x40000000" or nodes[0].get("collisionFilterMask") != "0x20000000":
                  raise SystemExit("ZIP nie zawiera poprawnego boxa FILLABLE")
              weight = ET.fromstring(zf.read("Weight2500kg.xml"))
              agents = weight.findall("./ai/agentAttachment")
              if len(agents) != 1 or agents[0].attrib != {"useSize": "true"}:
                  raise SystemExit("ZIP utracił obrys AI obciążnika")
          PY
          (cd dist && sha256sum "$ZIP_NAME" > "$ZIP_NAME.sha256")

      - name: Publish descriptive pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Tag lub release $TAG już istnieje"
            exit 1
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          ## Dokładny obszar tankowania

          - dodano osobny niewidoczny box FILLABLE w centralnej części ciągnika,
          - box przypisano wyłącznie do paliwowego fillUnit(1),
          - zachowano dotychczasowy mechanizm tankowania i pojemność 300 l,
          - zachowano zatwierdzony obrys AI obciążnika 2500 kg,
          - zaczepy, WOM, kolizje osprzętu i geometria wizualna pozostały bez zmian.

          W teście należy sprawdzić tankowanie przy dystrybutorze oraz brak ostrzeżenia Missing exactFillRootNode for fuel fill unit (1).
          EOF
          gh release create "$TAG" "dist/$ZIP_NAME" "dist/$ZIP_NAME.sha256" --target "$GITHUB_SHA" --title "Dokładny obszar tankowania" --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease

      - name: Remove one-time workflow
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm "$WORKFLOW_FILE"
          git commit -m "Usuń jednorazowy workflow obszaru tankowania"
          git push origin "HEAD:fuel-exact-fill-1.0.2.3T2"
