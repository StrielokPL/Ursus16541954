name: Prepare 1.0.1.1 cleanup test 8

on:
  push:
    branches: [cleanup-1.0.1.1]
    paths: [.github/workflows/cleanup-1.0.1.1-test8.yml]

permissions:
  contents: write

jobs:
  fillable-root-fallback:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup-1.0.1.1
          fetch-depth: 0

      - name: Enable fill trigger fallback without duplicate mapping
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          i3d_path=Path('Ursus1934.i3d')
          tree=ET.parse(i3d_path)
          root=tree.getroot()
          component=next((n for n in root.iter() if n.get('nodeId')=='242'),None)
          child=next((n for n in root.iter() if n.get('nodeId')=='879'),None)
          if component is None or component.get('name')!='Ursus1934M8e':
              raise SystemExit('Main component nodeId=242 not found')
          if component.get('collisionFilterGroup')!='0x10004':
              raise SystemExit(f'Unexpected TEST 7 component group: {component.get("collisionFilterGroup")}')
          if child is None or child.get('collisionFilterGroup')!='0x10004':
              raise SystemExit('Child collision group not restored by TEST 7')
          component.set('collisionFilterGroup','0x40010004')

          ET.indent(tree,space='  ')
          tree.write(i3d_path,encoding='utf-8',xml_declaration=True)

          vehicle=ET.parse('Ursus1934.xml')
          if vehicle.findall('.//exactFillRootNode'):
              raise SystemExit('TEST 8 requires no exactFillRootNode')
          print('FILLABLE component fallback enabled without exact root mapping')
          PY

      - name: Validate and build
        run: |
          python3 tools/validate_current.py
          ./build.sh
          test -f dist/FS25_Ursus_1654_1954_Pack.zip

      - name: Commit cleanup test 8
        run: |
          rm .github/workflows/cleanup-1.0.1.1-test8.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Ursus1934.i3d .github/workflows/cleanup-1.0.1.1-test8.yml
          git commit -m 'Enable fill trigger fallback without duplicate mapping test 8'
          git push origin HEAD:cleanup-1.0.1.1

      - name: Publish cleanup pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          sha256sum dist/FS25_Ursus_1654_1954_Pack.zip > dist/FS25_Ursus_1654_1954_Pack.zip.sha256
          cat > /tmp/notes.md <<'EOF'
          ## 1.0.1.1 CLEANUP TEST 8

          Tankowanie przez natywny fallback FillUnit bez podwójnego mapowania node'a.

          Zmiany:
          - główny component otrzymał bit 30 FILLABLE: 0x10004 -> 0x40010004,
          - exactFillRootNode nadal celowo nie występuje,
          - trigger może wykryć istniejący node-object pojazdu i wybrać diesel przez fallback,
          - brak ponownego mapowania Ursus1934M8e, więc nie powinien wystąpić błąd node-object mapping,
          - geometria i collisionFilterMask pozostają bez zmian.

          Do sprawdzenia:
          - monit R i tankowanie przy 50% paliwa,
          - brak błędu Node Ursus1934M8e already has a node-object mapping,
          - kolizje.
          - warning Missing exactFillRootNode jest oczekiwany i świadomie pozostawiony.
          EOF
          gh release create v1.0.1.1-test8 --target "$SHA" --title '1.0.1.1 CLEANUP TEST 8' --prerelease --notes-file /tmp/notes.md dist/FS25_Ursus_1654_1954_Pack.zip dist/FS25_Ursus_1654_1954_Pack.zip.sha256
