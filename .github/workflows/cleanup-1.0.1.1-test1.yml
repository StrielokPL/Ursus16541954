name: Prepare 1.0.1.1 cleanup test 1

on:
  push:
    branches:
      - cleanup-1.0.1.1
    paths:
      - .github/workflows/cleanup-1.0.1.1-test1.yml

permissions:
  contents: write

jobs:
  patch-build-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: cleanup-1.0.1.1
          fetch-depth: 0

      - name: Apply cleanup test 1
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          def exact_replace(text, old, new, expected=1, label='replacement'):
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{label}: expected {expected} occurrence(s), found {count}')
              return text.replace(old, new, expected)

          vehicle_path = Path('Ursus1934.xml')
          text = vehicle_path.read_bytes().decode('utf-8')

          sound_ref = '        <sounds filename="configurations/Ursus1934_sounds.xml"/>'
          if text.count(sound_ref) != 2:
              raise SystemExit(f'Expected 2 base sound references, found {text.count(sound_ref)}')
          first = text.find(sound_ref)
          second = text.find(sound_ref, first + len(sound_ref))
          text = text[:second] + text[second + len(sound_ref):]

          text = exact_replace(
              text,
              '            <topArm baseNode="0&gt;5|0|2" filename="$data/shared/assets/upperLinks/walterscheid03.i3d" zScale="-1" color="SHARED_BLACK1"/>',
              '            <topArm baseNode="0&gt;5|0|2" filename="$data/shared/assets/upperLinks/walterscheidHO_90_600.xml" zScale="-1" materialTemplateName="SHARED_BLACK1"/>',
              label='rear topArm migration')
          text = exact_replace(
              text,
              '            <topArm baseNode="0&gt;10|7|1|0|2" filename="$data/shared/assets/upperLinks/walterscheid03.i3d" zScale="1" color="FENDT_GREY1"/>',
              '            <topArm baseNode="0&gt;10|7|1|0|2" filename="$data/shared/assets/upperLinks/walterscheidHO_90_600.xml" zScale="1" materialTemplateName="FENDT_GREY1"/>',
              label='front topArm migration')

          text = exact_replace(
              text,
              '            <bottomArm rotationNode="0&gt;5|0|1" translationNode="0&gt;5|0|1|0" referenceNode="0&gt;5|0|1|0|0" zScale="-1" startRotation="-17 0 0"/>',
              '            <bottomArm rotationNode="0&gt;5|0|1" translationNode="0&gt;5|0|1|0" referenceNode="0&gt;5|0|1|0|0" zScale="-1" startRotation="-17 0 0" categoryRange="1 4"/>',
              label='rear bottomArm categoryRange')
          text = exact_replace(
              text,
              '            <bottomArm rotationNode="0&gt;10|7|1|0|1" translationNode="0&gt;10|7|1|0|1|0" referenceNode="0&gt;10|7|1|0|1|0|0" zScale="1" startRotation="-14.904 0 0"/>',
              '            <bottomArm rotationNode="0&gt;10|7|1|0|1" translationNode="0&gt;10|7|1|0|1|0" referenceNode="0&gt;10|7|1|0|1|0|0" zScale="1" startRotation="-14.904 0 0" categoryRange="1 4"/>',
              label='front bottomArm categoryRange')

          blocks = [
              ('cylindered hydraulic sound', r'\n        <sounds>\r?\n            <hydraulic template="defaultHydraulicSound"/>\r?\n        </sounds>(?=\r?\n    </cylindered>)'),
              ('drivable water splash sound', r'\n        <sounds>\r?\n            <waterSplash template="WATER_SPLASH_01"/>\r?\n        </sounds>(?=\r?\n        <steeringWheel)'),
              ('local lights sounds', r'\n        <sounds>\r?\n            <switchLight template="SWITCH_01"/>\r?\n            <turnLight template="SWITCH_TURNLIGHT"/>\r?\n        </sounds>(?=\r?\n        <dashboards>)'),
              ('attacher joint sounds', r'\n        <sounds>\r?\n            <attach template="ATTACH_01"/>\r?\n            <hydraulic template="defaultHydraulicSound"/>\r?\n        </sounds>(?=\r?\n    </attacherJoints>)'),
              ('legacy local honk', r'\n    <honk>\r?\n        <sound template="HONK_FENDT511C"/>\r?\n    </honk>'),
          ]
          for label, pattern in blocks:
              text, n = re.subn(pattern, '', text, count=1)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 block, found {n}')

          vehicle_path.write_bytes(text.encode('utf-8'))

          sounds_path = Path('configurations/Ursus1934_sounds.xml')
          sounds = sounds_path.read_bytes().decode('utf-8')
          sounds, n = re.subn(r'^[ \t]*<toggleLights\s+template="SWITCH_01"\s*/>\s*\r?\n', '', sounds, count=1, flags=re.MULTILINE)
          if n != 1:
              raise SystemExit(f'Expected one invalid SWITCH_01 toggleLights entry, found {n}')
          sounds_path.write_bytes(sounds.encode('utf-8'))

          moddesc_path = Path('modDesc.xml')
          moddesc = moddesc_path.read_text(encoding='utf-8')
          moddesc = exact_replace(moddesc, '<version>1.0.1.0</version>', '<version>1.0.1.1</version>', label='modDesc version')
          moddesc_path.write_text(moddesc, encoding='utf-8')
          Path('VERSION').write_text('1.0.1.1-test1\n', encoding='utf-8')

          for path in [vehicle_path, sounds_path, moddesc_path]:
              ET.parse(path)

          print('Cleanup test 1 applied successfully')
          PY

      - name: Validate cleanup tree
        run: |
          python3 tools/validate_current.py
          ./build.sh
          test -f dist/FS25_Ursus_1654_1954_Pack.zip

      - name: Commit cleanup test
        shell: bash
        run: |
          rm .github/workflows/cleanup-1.0.1.1-test1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Ursus1934.xml configurations/Ursus1934_sounds.xml modDesc.xml VERSION .github/workflows/cleanup-1.0.1.1-test1.yml
          git commit -m 'Cleanup FS25 compatibility warnings test 1'
          git push origin HEAD:cleanup-1.0.1.1

      - name: Publish cleanup pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          sha256sum dist/FS25_Ursus_1654_1954_Pack.zip > dist/FS25_Ursus_1654_1954_Pack.zip.sha256
          if gh release view v1.0.1.1-test1 >/dev/null 2>&1; then
            gh release delete v1.0.1.1-test1 --yes --cleanup-tag
          fi
          cat > /tmp/notes.md <<'EOF'
          ## 1.0.1.1 CLEANUP TEST 1

          Pierwszy etap czyszczenia logu FS25 na bazie 1.0.1.0.

          Zmiany:
          - usunięto zdublowane i stare definicje dźwięków z `Ursus1934.xml`; głównym źródłem pozostaje `configurations/Ursus1934_sounds.xml`,
          - usunięto potwierdzony jako nieistniejący w FS25 `SWITCH_01` z `toggleLights`,
          - top-linki przeniesiono z `walterscheid03.i3d` na `walterscheidHO_90_600.xml`,
          - `color` top-linków zmieniono na `materialTemplateName`,
          - oba bottomArm dostały jawne `categoryRange="1 4"`,
          - wersja testowa w `modDesc.xml`: `1.0.1.1`.

          Cel testu: sprawdzić przede wszystkim log. Przewody hydrauliczne, `exactFillRootNode` i ostrzeżenia emitterów nie są jeszcze poprawiane w tym buildzie.
          EOF
          gh release create v1.0.1.1-test1 \
            --target "$SHA" \
            --title '1.0.1.1 CLEANUP TEST 1' \
            --prerelease \
            --notes-file /tmp/notes.md \
            dist/FS25_Ursus_1654_1954_Pack.zip \
            dist/FS25_Ursus_1654_1954_Pack.zip.sha256
