name: Publish lights and dashboards cleanup

on:
  push:
    branches:
      - lights-dashboards-1.0.2.4T1

permissions:
  contents: write

env:
  BASE_SHA: 3256289751c2e1667aa5d7c62d35ccdbd1aca6b6
  MAIN_SHA: 11705c56cac4433cf4adeef06b9a3a4cc4230e8c
  TAG: v1.0.2.4T1
  ZIP_NAME: FS25_Ursus_1654_1954_Pack.zip
  WORKFLOW_FILE: .github/workflows/lights-dashboards-1.0.2.4T1.yml

jobs:
  validate-build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact test source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard base and approved scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "a6f9c3e07c027490ea0563302ea2f92c5e85b95f"
          test "$(git ls-remote origin refs/heads/fuel-exact-fill-1.0.2.3T2 | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN_SHA"
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          import xml.etree.ElementTree as ET

          base = "3256289751c2e1667aa5d7c62d35ccdbd1aca6b6"
          expected_files = sorted([
              ".github/workflows/lights-dashboards-1.0.2.4T1.yml",
              "VERSION",
              "Ursus1934.xml",
              "modDesc.xml",
          ])
          changed = sorted(subprocess.check_output(
              ["git", "diff", "--name-only", f"{base}..HEAD"], text=True
          ).splitlines())
          if changed != expected_files:
              raise SystemExit(f"Nieoczekiwany zakres zmian: {changed}")

          expected_blobs = {
              "Ursus1934.i3d": "5e32a71388966cf68674f5cb0e4115a40bb2ec3e",
              "Ursus1934.xml": "f6e61336ae4cb1da80116b9a49222d703bf5f382",
              "modDesc.xml": "680b4b0b798242281d5410698aaf730b34101e55",
              "VERSION": "a2d9c733d1e78dc1c6ff8157e2fbbb772839ff98",
          }
          for name, expected in expected_blobs.items():
              got = subprocess.check_output(["git", "hash-object", name], text=True).strip()
              if got != expected:
                  raise SystemExit(f"Nieoczekiwana treść {name}: {got}")

          actual_xml = Path("Ursus1934.xml").read_text(encoding="utf-8")
          expected_xml = subprocess.check_output(
              ["git", "show", f"{base}:Ursus1934.xml"], text=True
          )
          removed_lines = [
              '      <defaultLight shaderNode="0&gt;10|2|0|0|3|0" lightTypes="0" />\n',
              '      <dashboard displayType="EMITTER" valueType="lightState" node="0&gt;10|2|0|0|3|1" intensity="0.8" lightTypes="0" groups="MOTOR_ACTIVE" />\n',
              '      <dashboard displayType="EMITTER" valueType="lightState" node="0&gt;10|2|0|0|3|2|3|0" intensity="0.8" lightTypes="0" groups="MOTOR_ACTIVE" />\n',
              '      <dashboard displayType="EMITTER" valueType="lightState" node="0&gt;10|2|0|0|3|2|2|0|0" intensity="0.8" lightTypes="0" groups="MOTOR_ACTIVE" />\n',
              '      <dashboard displayType="EMITTER" valueType="lightState" node="0&gt;10|2|0|0|3|2|1|0|0" intensity="0.8" lightTypes="0" groups="MOTOR_ACTIVE" />\n',
              '      <dashboard displayType="EMITTER" valueType="lightState" node="0&gt;10|2|0|0|30|0|0" intensity="0.8" lightTypes="0" groups="MOTOR_ACTIVE" />\n',
          ]
          for line in removed_lines:
              if expected_xml.count(line) != 1:
                  raise SystemExit(f"Nie znaleziono dokładnie jednego zatwierdzonego wpisu: {line.strip()}")
              expected_xml = expected_xml.replace(line, "")
          if actual_xml != expected_xml:
              raise SystemExit("Ursus1934.xml zmieniono poza sześcioma zatwierdzonymi wpisami")

          root = ET.fromstring(actual_xml)
          default_lights = root.findall("./lights/defaultLights/defaultLight")
          light_dashboards = root.findall("./lights/dashboards/dashboard")
          if len(default_lights) != 16:
              raise SystemExit(f"Nieprawidłowa liczba defaultLight: {len(default_lights)}")
          if len(light_dashboards) != 10:
              raise SystemExit(f"Nieprawidłowa liczba dashboardów świateł: {len(light_dashboards)}")

          removed_nodes = {
              "0>10|2|0|0|3|1",
              "0>10|2|0|0|3|2|3|0",
              "0>10|2|0|0|3|2|2|0|0",
              "0>10|2|0|0|3|2|1|0|0",
              "0>10|2|0|0|30|0|0",
          }
          if any(node.get("shaderNode") == "0>10|2|0|0|3|0" for node in default_lights):
              raise SystemExit("Pozostał odrzucany defaultLight kokpitu")
          if any(node.get("node") in removed_nodes for node in light_dashboards):
              raise SystemExit("Pozostał odrzucany dashboard EMITTER")

          base_i3d = subprocess.check_output(["git", "show", f"{base}:Ursus1934.i3d"])
          if Path("Ursus1934.i3d").read_bytes() != base_i3d:
              raise SystemExit("Model I3D lub materiały zostały zmienione")
          base_shader = subprocess.check_output(["git", "show", f"{base}:shaders/vehicleShader.xml"])
          if Path("shaders/vehicleShader.xml").read_bytes() != base_shader:
              raise SystemExit("Shader świateł został zmieniony")
          base_emissive = subprocess.check_output(["git", "show", f"{base}:textures/decals_emissive.dds"])
          if Path("textures/decals_emissive.dds").read_bytes() != base_emissive:
              raise SystemExit("Tekstura emisyjna została zmieniona")

          if Path("VERSION").read_text(encoding="utf-8") != "1.0.2.4T1\n":
              raise SystemExit("Nieprawidłowy plik VERSION")
          if ET.parse("modDesc.xml").getroot().findtext("version") != "1.0.2.4T1":
              raise SystemExit("Nieprawidłowa wersja w modDesc.xml")

          fuel = root.find("./fillUnit/fillUnitConfigurations/fillUnitConfiguration/fillUnits/fillUnit")
          exact = None if fuel is None else fuel.find("exactFillRootNode")
          if exact is None or exact.get("node") != "0>11|7":
              raise SystemExit("Utracono zatwierdzony exactFillRootNode paliwa")
          weight_root = ET.parse("Weight2500kg.xml").getroot()
          agents = weight_root.findall("./ai/agentAttachment")
          if len(agents) != 1 or agents[0].attrib != {"useSize": "true"}:
              raise SystemExit("Utracono zatwierdzony obrys AI obciążnika 2500 kg")
          PY

      - name: Validate and build package
        run: |
          set -euo pipefail
          python3 tools/validate_current.py
          ./build.sh

      - name: Verify test ZIP
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          import zipfile
          from pathlib import Path

          path = Path("dist/FS25_Ursus_1654_1954_Pack.zip")
          with zipfile.ZipFile(path) as zf:
              names = zf.namelist()
              if len(names) != 67 or len(names) != len(set(names)):
                  raise SystemExit(f"Nieprawidłowa zawartość ZIP: {len(names)}")
              mod = ET.fromstring(zf.read("modDesc.xml"))
              if mod.findtext("version") != "1.0.2.4T1":
                  raise SystemExit("Nieprawidłowa wersja w ZIP")

              tractor = ET.fromstring(zf.read("Ursus1934.xml"))
              default_lights = tractor.findall("./lights/defaultLights/defaultLight")
              light_dashboards = tractor.findall("./lights/dashboards/dashboard")
              if len(default_lights) != 16 or len(light_dashboards) != 10:
                  raise SystemExit("ZIP zawiera nieprawidłową konfigurację świateł lub zegarów")
              if any(node.get("shaderNode") == "0>10|2|0|0|3|0" for node in default_lights):
                  raise SystemExit("ZIP nadal zawiera odrzucany defaultLight")
              removed_nodes = {
                  "0>10|2|0|0|3|1",
                  "0>10|2|0|0|3|2|3|0",
                  "0>10|2|0|0|3|2|2|0|0",
                  "0>10|2|0|0|3|2|1|0|0",
                  "0>10|2|0|0|30|0|0",
              }
              if any(node.get("node") in removed_nodes for node in light_dashboards):
                  raise SystemExit("ZIP nadal zawiera odrzucany dashboard EMITTER")

              if zf.read("Ursus1934.i3d") != Path("Ursus1934.i3d").read_bytes():
                  raise SystemExit("ZIP zmienił model I3D")
              if zf.read("shaders/vehicleShader.xml") != Path("shaders/vehicleShader.xml").read_bytes():
                  raise SystemExit("ZIP zmienił shader świateł")
              if zf.read("textures/decals_emissive.dds") != Path("textures/decals_emissive.dds").read_bytes():
                  raise SystemExit("ZIP zmienił teksturę emisyjną")

              fuel = tractor.find("./fillUnit/fillUnitConfigurations/fillUnitConfiguration/fillUnits/fillUnit")
              exact = None if fuel is None else fuel.find("exactFillRootNode")
              if exact is None or exact.get("node") != "0>11|7":
                  raise SystemExit("ZIP utracił exactFillRootNode paliwa")
              weight = ET.fromstring(zf.read("Weight2500kg.xml"))
              agents = weight.findall("./ai/agentAttachment")
              if len(agents) != 1 or agents[0].attrib != {"useSize": "true"}:
                  raise SystemExit("ZIP utracił obrys AI obciążnika")
          PY
          (cd dist && sha256sum "$ZIP_NAME" > "$ZIP_NAME.sha256")

      - name: Publish descriptive pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Tag lub release $TAG już istnieje"
            exit 1
          fi
          {
            echo "## Czyszczenie konfiguracji świateł i zegarów"
            echo
            echo "- usunięto jeden odrzucany wpis defaultLight wskazujący zwykłą warstwę kokpitu,"
            echo "- usunięto pięć odrzucanych wpisów EMITTER zegarów,"
            echo "- geometria świateł, materiały, shader i tekstura emisyjna pozostały bez zmian,"
            echo "- jasność, kolor oraz działanie właściwych lamp nie zostały zmienione,"
            echo "- zachowano dokładny obszar tankowania i obrys AI obciążnika 2500 kg."
            echo
            echo "W teście należy sprawdzić wszystkie tryby świateł i wygląd zegarów, a następnie przesłać nowy log. Oczekiwany wynik: brak sześciu warningów dotyczących defaultLight(16) oraz dashboard(10-14)."
          } > "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" "dist/$ZIP_NAME" "dist/$ZIP_NAME.sha256" --target "$GITHUB_SHA" --title "Czyszczenie konfiguracji świateł i zegarów" --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease

      - name: Remove one-time workflow
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm "$WORKFLOW_FILE"
          git commit -m "Usuń jednorazowy workflow świateł i zegarów"
          git push origin "HEAD:lights-dashboards-1.0.2.4T1"
