name: Build and publish 1.0.5.0T2

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/release-1.0.5.0T2.yml'

permissions:
  contents: write

jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply runtime color fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          # Version files
          Path('VERSION').write_text('1.0.5.0T2\n', encoding='utf-8')

          p = Path('modDesc.xml')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<version>1.0.5.0T1</version>', '<version>1.0.5.0T2</version>')
          if '<sourceFile filename="UrsusColorFix.lua"/>' not in s:
              s = s.replace('<sourceFile filename="UrsusTransmissionFix.lua"/>', '<sourceFile filename="UrsusTransmissionFix.lua"/>\n        <sourceFile filename="UrsusColorFix.lua"/>')
          p.write_text(s, encoding='utf-8')

          # Keep transmission behavior identical; only update build-identifying log/comment.
          p = Path('UrsusTransmissionFix.lua')
          s = p.read_text(encoding='utf-8')
          s = s.replace('1.0.5.0T1', '1.0.5.0T2')
          p.write_text(s, encoding='utf-8')

          # Native store color choices stay in XML, but native material-slot application
          # is removed because these legacy I3Ds do not expose runtime material slots.
          p = Path('Ursus1934.xml')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<!-- 1.0.5.0T1: isolated color configuration test -->', '<!-- 1.0.5.0T2: runtime shader color application test -->')
          s = s.replace('    <material materialSlotName="ursusBodyPaint" shaderParameter="colorMat0" materialTemplateUseColorOnly="true"/>\n', '')
          s = s.replace('    <material materialSlotName="ursusRimPaint" shaderParameter="colorMat0" materialTemplateUseColorOnly="true"/>\n', '')
          body_anchor = '    <baseColorConfiguration name="Żółty test" color="0.72 0.42 0.02" price="0"/>\n'
          rim_anchor = '    <rimColorConfiguration name="Żółty test" color="0.72 0.42 0.02" price="0"/>\n'
          if 'baseColorConfiguration name="Wściekły róż test"' not in s:
              s = s.replace(body_anchor, body_anchor + '    <baseColorConfiguration name="Wściekły róż test" color="1 0 1" price="0"/>\n')
          if 'rimColorConfiguration name="Wściekły róż test"' not in s:
              s = s.replace(rim_anchor, rim_anchor + '    <rimColorConfiguration name="Wściekły róż test" color="1 0 1" price="0"/>\n')
          p.write_text(s, encoding='utf-8')

          # Remove ineffective T1 experimental attributes from I3D material definitions.
          for fn in ('Ursus1934.i3d', 'wheels/rims.i3d'):
              p = Path(fn)
              s = p.read_text(encoding='utf-8')
              s = s.replace(' materialSlotName="ursusBodyPaint"', '')
              s = s.replace(' materialSlotName="ursusRimPaint"', '')
              p.write_text(s, encoding='utf-8')

          # Basic XML well-formedness now, before packaging.
          for fn in ('modDesc.xml','Ursus1934.xml','Ursus1934.i3d','wheels/rims.i3d'):
              ET.parse(fn)
          PY

          cat > UrsusColorFix.lua <<'LUA'
          -- Ursus 1654-1954 FS25 body/rim color runtime bridge
          -- 1.0.5.0T2: legacy I3Ds do not expose usable material slot names at runtime,
          -- so the native shop configuration selects the color while this tiny bridge
          -- applies colorMat0 only to explicitly whitelisted body/rim shapes.

          UrsusColorFix = UrsusColorFix or {}

          if not UrsusColorFix.installed then
              UrsusColorFix.installed = true

              local modDirectory = g_currentModDirectory
              local APPLY_RETRY_MS = 250

              -- RGB values mirror Ursus1934.xml configuration order.
              -- The fourth colorMat0 component is intentionally preserved per surface:
              -- 16 for the main body material and 6 for rim metallic paint.
              local BODY_COLORS = {
                  [1] = {0.40, 0.03, 0.00}, -- factory red
                  [2] = {0.02, 0.02, 0.02}, -- black
                  [3] = {0.82, 0.82, 0.82}, -- white
                  [4] = {0.03, 0.12, 0.45}, -- blue test
                  [5] = {0.06, 0.30, 0.07}, -- green test
                  [6] = {0.72, 0.42, 0.02}, -- yellow test
                  [7] = {1.00, 0.00, 1.00}, -- hot magenta diagnostic
              }

              local RIM_COLORS = {
                  [1] = {0.30, 0.30, 0.30}, -- factory gray
                  [2] = {0.02, 0.02, 0.02}, -- black
                  [3] = {0.82, 0.82, 0.82}, -- white
                  [4] = {0.40, 0.03, 0.00}, -- red
                  [5] = {0.72, 0.42, 0.02}, -- yellow test
                  [6] = {1.00, 0.00, 1.00}, -- hot magenta diagnostic
              }

              -- Main body material 21 is used only by these two shapes.
              local BODY_SHAPES = {
                  Object118 = true,
                  kadlubmetal = true,
              }

              -- rims.i3d materials 4/6/10: standard, Robert and dual-rim surfaces.
              -- Wheel weights are Object112/Cylinder327 and deliberately excluded.
              local RIM_SHAPES = {
                  przod = true,
                  Tube023 = true,
                  Tube019 = true,
                  Tube034 = true,
              }

              local function isUrsus(vehicle)
                  if vehicle == nil or vehicle.configFileName == nil then
                      return false
                  end

                  local configFileName = vehicle.configFileName
                  if modDirectory ~= nil
                      and string.sub(configFileName, 1, string.len(modDirectory)) ~= modDirectory then
                      return false
                  end

                  return string.sub(configFileName, -13) == "Ursus1934.xml"
              end

              local function getConfigurationIndex(vehicle, key)
                  if vehicle.configurations == nil then
                      return 1
                  end

                  local value = vehicle.configurations[key]
                  if type(value) == "table" then
                      value = value.id or value.index or value.configId
                  end

                  return tonumber(value) or 1
              end

              local function setColor(node, color, materialType)
                  setShaderParameter(
                      node,
                      "colorMat0",
                      color[1], color[2], color[3], materialType,
                      false
                  )
              end

              local function scanNode(node, bodyColor, rimColor, visited)
                  if node == nil or node == 0 or visited[node] then
                      return 0, 0
                  end
                  visited[node] = true

                  local bodyCount = 0
                  local rimCount = 0
                  local nodeName = getName(node)

                  if bodyColor ~= nil and BODY_SHAPES[nodeName] then
                      setColor(node, bodyColor, 16)
                      bodyCount = bodyCount + 1
                  end

                  if rimColor ~= nil and RIM_SHAPES[nodeName] then
                      setColor(node, rimColor, 6)
                      rimCount = rimCount + 1
                  end

                  local numChildren = getNumOfChildren(node)
                  for i = 0, numChildren - 1 do
                      local childBody, childRim = scanNode(
                          getChildAt(node, i), bodyColor, rimColor, visited
                      )
                      bodyCount = bodyCount + childBody
                      rimCount = rimCount + childRim
                  end

                  return bodyCount, rimCount
              end

              local function applyColors(vehicle, bodyColorId, rimColorId)
                  local bodyColor = BODY_COLORS[bodyColorId] or BODY_COLORS[1]
                  local rimColor = RIM_COLORS[rimColorId] or RIM_COLORS[1]
                  local visited = {}
                  local bodyCount = 0
                  local rimCount = 0

                  if vehicle.components ~= nil then
                      for _, component in ipairs(vehicle.components) do
                          if component.node ~= nil then
                              local b, r = scanNode(component.node, bodyColor, rimColor, visited)
                              bodyCount = bodyCount + b
                              rimCount = rimCount + r
                          end
                      end
                  elseif vehicle.rootNode ~= nil then
                      bodyCount, rimCount = scanNode(
                          vehicle.rootNode, bodyColor, rimColor, visited
                      )
                  end

                  return bodyCount, rimCount
              end

              function UrsusColorFix.update(vehicle, dt)
                  if not isUrsus(vehicle) then
                      return
                  end

                  if vehicle.ursusColorNextApplyTime ~= nil
                      and g_time < vehicle.ursusColorNextApplyTime then
                      return
                  end

                  local bodyColorId = getConfigurationIndex(vehicle, "baseColor")
                  local rimColorId = getConfigurationIndex(vehicle, "rimColor")
                  local bodyNeedsApply = vehicle.ursusLastBodyColorId ~= bodyColorId
                  local rimNeedsApply = vehicle.ursusLastRimColorId ~= rimColorId

                  if not bodyNeedsApply and not rimNeedsApply then
                      return
                  end

                  vehicle.ursusColorNextApplyTime = g_time + APPLY_RETRY_MS
                  local bodyCount, rimCount = applyColors(vehicle, bodyColorId, rimColorId)

                  if bodyCount > 0 then
                      vehicle.ursusLastBodyColorId = bodyColorId
                  end
                  if rimCount > 0 then
                      vehicle.ursusLastRimColorId = rimColorId
                  end

                  -- Log successful/failed target counts once per retry/config change.
                  Logging.info("%s", string.format(
                      "[UrsusColorFix] 1.0.5.0T2 bodyColor=%d bodyShapes=%d rimColor=%d rimShapes=%d",
                      bodyColorId, bodyCount, rimColorId, rimCount
                  ))
              end

              Vehicle.update = Utils.appendedFunction(Vehicle.update, UrsusColorFix.update)
              Logging.info("[UrsusColorFix] 1.0.5.0T2 runtime body/rim color bridge enabled")
          end
          LUA

      - name: Validate source tree
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for p in Path('.').rglob('*.xml'):
              ET.parse(p)
          for p in Path('.').rglob('*.i3d'):
              ET.parse(p)
          assert Path('VERSION').read_text().strip() == '1.0.5.0T2'
          assert '<version>1.0.5.0T2</version>' in Path('modDesc.xml').read_text()
          ux = Path('Ursus1934.xml').read_text()
          assert 'Wściekły róż test' in ux
          assert 'materialSlotName="ursusBodyPaint"' not in ux
          assert 'materialSlotName="ursusRimPaint"' not in ux
          assert Path('UrsusColorFix.lua').exists()
          print('Validation OK')
          PY

      - name: Build test ZIP
        shell: bash
        run: |
          rm -rf dist
          mkdir -p dist/stage
          rsync -a ./ dist/stage/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'dist'
          cd dist/stage
          zip -qr ../FS25_Ursus_1654_1954_Pack.zip .
          cd ../..
          test -s dist/FS25_Ursus_1654_1954_Pack.zip
          sha256sum dist/FS25_Ursus_1654_1954_Pack.zip

      - name: Commit 1.0.5.0T2
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION modDesc.xml Ursus1934.xml Ursus1934.i3d wheels/rims.i3d UrsusTransmissionFix.lua UrsusColorFix.lua
          git commit -m '1.0.5.0T2 runtime body and rim color fix'
          git push
          echo "TARGET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create v1.0.5.0T2 \
            dist/FS25_Ursus_1654_1954_Pack.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title '1.0.5.0T2 — runtime color application fix' \
            --prerelease \
            --notes 'Fixes T1 body/rim colors not applying. The store still uses independent native baseColor and rimColor selections, while a small runtime bridge applies colorMat0 to explicitly whitelisted body and rim shapes. Removes the missing material-slot warnings from T1. Adds a maximum-visibility hot magenta diagnostic color to both body and rim palettes. Wheel weights, lights, hydraulics and decals remain excluded. Transmission, ADS behavior and physics are unchanged from 1.0.4.1/1.0.5.0T1.'

      - name: Remove one-shot workflow
        shell: bash
        run: |
          git pull --rebase
          git rm .github/workflows/release-1.0.5.0T2.yml
          git commit -m 'Remove one-shot 1.0.5.0T2 release workflow'
          git push
