name: Diagnose remaining cleanup assets

on:
  push:
    branches:
      - cleanup-1.0.1.1
    paths:
      - .github/workflows/diagnose-cleanup-assets.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup-1.0.1.1
      - name: Inspect I3D materials and target nodes
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = ET.parse('Ursus1934.i3d').getroot()
          files = {e.get('fileId'): e.get('filename') for e in root.findall('./Files/File')}
          materials = {e.get('materialId'): e for e in root.findall('./Materials/Material')}
          print('=== MISSING-TEXTURE MATERIALS ===')
          for mid, m in materials.items():
              refs=[]
              for c in m:
                  fid=c.get('fileId')
                  if fid in files and any(s in files[fid] for s in ('cableBoundleHoses','frontConnector_normal')):
                      refs.append((c.tag, fid, files[fid]))
              if refs:
                  print('material', mid, m.get('name'), refs)

          scene = root.find('./Scene')
          targets = [
              '0>10|2|0|0|3|0',
              '0>10|2|0|0|3|1',
              '0>10|2|0|0|3|2|3|0',
              '0>10|2|0|0|3|2|2|0|0',
              '0>10|2|0|0|3|2|1|0|0',
              '0>10|2|0|0|30|0|0',
          ]
          def child_elements(el):
              return [c for c in el if c.tag in ('TransformGroup','Shape','Camera','Light')]
          def resolve(path):
              assert path.startswith('0>')
              cur = child_elements(scene)[0]
              suffix=path[2:]
              if suffix:
                  for idx in map(int,suffix.split('|')):
                      cur=child_elements(cur)[idx]
              return cur
          print('=== TARGET LIGHT NODES ===')
          for p in targets:
              try:
                  e=resolve(p)
                  print(p, 'tag=',e.tag,'name=',e.get('name'),'nodeId=',e.get('nodeId'),'materialIds=',e.get('materialIds'),'shapeId=',e.get('shapeId'))
                  if e.get('materialIds'):
                      for mid in e.get('materialIds').split():
                          m=materials.get(mid)
                          if m is not None:
                              print('   material',mid,m.get('name'),'shaderVariation=',m.get('customShaderVariation'), 'params=', [(x.get('name'),x.get('value')) for x in m.findall('CustomParameter') if x.get('name') in ('lightControl','lightIds0')])
              except Exception as ex:
                  print(p,'RESOLVE_ERROR',repr(ex))

          print('=== SHAPES USING SUSPECT MATERIALS ===')
          suspect=set()
          for mid,m in materials.items():
              for c in m:
                  fid=c.get('fileId')
                  if fid in files and any(s in files[fid] for s in ('cableBoundleHoses','frontConnector_normal')):
                      suspect.add(mid)
          def walk(el, path=''):
              kids=child_elements(el)
              for i,c in enumerate(kids):
                  cp=(path+'|'+str(i)) if path else str(i)
                  mids=set((c.get('materialIds') or '').split())
                  if mids & suspect:
                      print('0>'+cp,c.tag,c.get('name'),'materials=',c.get('materialIds'),'shapeId=',c.get('shapeId'))
                  walk(c,cp)
          walk(scene)

          print('=== POSSIBLE FUEL/TANK NODES ===')
          for e in root.iter():
              name=(e.get('name') or '')
              if any(k in name.lower() for k in ('fuel','tank','bak','zbior','diesel')):
                  print(e.tag,'name=',name,'nodeId=',e.get('nodeId'),'translation=',e.get('translation'))
          PY
      - name: Remove diagnostic workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/diagnose-cleanup-assets.yml
          git commit -m 'Remove cleanup asset diagnostic workflow'
          git push origin HEAD:cleanup-1.0.1.1
