name: Prepare 1.0.1.1 cleanup test 11

on:
  push:
    branches: [cleanup-1.0.1.1]
    paths: [.github/workflows/cleanup-1.0.1.1-test11.yml]

permissions:
  contents: write

jobs:
  conditional-front-systems:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup-1.0.1.1
          fetch-depth: 0

      - name: Make front collision PTO and hoses configuration-bound
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          vehicle_path = Path('Ursus1934.xml')
          tree = ET.parse(vehicle_path)
          root = tree.getroot()
          attacher_joints = root.find('attacherJoints')
          configs = attacher_joints.find('attacherJointConfigurations')
          if configs is None or len(configs.findall('attacherJointConfiguration')) != 8:
              raise SystemExit('TEST 10 front configurations not found')

          for config in configs.findall('attacherJointConfiguration'):
              is_front = config.get('name') == 'FrontHydraulic'
              config.set('powerTakeOffConfigId', '2' if is_front else '1')
              config.set('connectionHoseConfigId', '2' if is_front else '1')

          pto = root.find('powerTakeOffs')
          outputs = pto.findall('output')
          if len(outputs) != 2:
              raise SystemExit(f'Expected two TEST 10 PTO outputs, found {len(outputs)}')
          rear_output = next((o for o in outputs if o.get('attacherJointIndices') == '1 2 3'), None)
          front_output = next((o for o in outputs if o.get('attacherJointIndices') == '4'), None)
          if rear_output is None or front_output is None:
              raise SystemExit('Expected rear/front TEST 10 PTO routing')
          pto.remove(front_output)
          pto_configs = ET.SubElement(pto, 'powerTakeOffConfigurations')
          ET.SubElement(pto_configs, 'powerTakeOffConfiguration')
          pto_front_config = ET.SubElement(pto_configs, 'powerTakeOffConfiguration')
          pto_front_config.append(front_output)

          hoses = root.find('connectionHoses')
          front_targets = [
              target for target in hoses.findall('target')
              if target.get('attacherJointIndices') == '4'
          ]
          if len(front_targets) != 4:
              raise SystemExit(f'Expected four front hose targets, found {len(front_targets)}')
          for target in front_targets:
              hoses.remove(target)
          hose_configs = ET.SubElement(hoses, 'connectionHoseConfigurations')
          ET.SubElement(hose_configs, 'connectionHoseConfiguration')
          hose_front_config = ET.SubElement(hose_configs, 'connectionHoseConfiguration')
          for target in front_targets:
              hose_front_config.append(target)

          ET.indent(tree, space='  ')
          tree.write(vehicle_path, encoding='utf-8', xml_declaration=True)

          i3d_path = Path('Ursus1934.i3d')
          i3d_tree = ET.parse(i3d_path)
          i3d_root = i3d_tree.getroot()
          collisions = [
              n for n in i3d_root.iter()
              if n.get('name') in ('frontHydraulicCollision1', 'frontHydraulicCollision2')
          ]
          if len(collisions) != 2:
              raise SystemExit('Expected two TEST 10 TUZ collision shapes')
          for collision in collisions:
              if collision.get('compoundChild') != 'false':
                  raise SystemExit('Expected TEST 10 collision to default inactive')
              collision.attrib.pop('collisionFilterGroup', None)
              collision.attrib.pop('collisionFilterMask', None)

          component = next((n for n in i3d_root.iter() if n.get('nodeId') == '242'), None)
          if component is None or component.get('collisionFilterGroup') != '0x40010004':
              raise SystemExit('TEST 8 FILLABLE component state was not preserved')

          ET.indent(i3d_tree, space='  ')
          i3d_tree.write(i3d_path, encoding='utf-8', xml_declaration=True)

          check = ET.parse(vehicle_path).getroot()
          cfgs = check.find('attacherJoints/attacherJointConfigurations')
          values = [(c.get('name'), c.get('powerTakeOffConfigId'), c.get('connectionHoseConfigId')) for c in cfgs]
          if sum(1 for _, p, h in values if p == '2' and h == '2') != 1:
              raise SystemExit(f'Expected only FrontHydraulic to select front systems: {values}')
          if check.find('powerTakeOffs/powerTakeOffConfigurations/powerTakeOffConfiguration[2]/output') is None:
              raise SystemExit('Conditional front PTO output missing')
          if len(check.findall('connectionHoses/connectionHoseConfigurations/connectionHoseConfiguration[2]/target')) != 4:
              raise SystemExit('Conditional front hose targets missing')
          print('Front collision is non-rigid by default; PTO and hoses use config IDs 1/2')
          PY

      - name: Validate and build
        run: |
          python3 tools/validate_current.py
          ./build.sh
          test -f dist/FS25_Ursus_1654_1954_Pack.zip

      - name: Commit cleanup test 11
        run: |
          rm .github/workflows/cleanup-1.0.1.1-test11.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Ursus1934.xml Ursus1934.i3d .github/workflows/cleanup-1.0.1.1-test11.yml
          git commit -m 'Bind front collision PTO and hoses to TUZ configuration test 11'
          git push origin HEAD:cleanup-1.0.1.1

      - name: Publish cleanup pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          sha256sum dist/FS25_Ursus_1654_1954_Pack.zip > dist/FS25_Ursus_1654_1954_Pack.zip.sha256
          cat > /tmp/notes.md <<'EOF'
          ## 1.0.1.1 CLEANUP TEST 11

          Warunkowa fizyka i osprzęt przedniego TUZ-a.

          Zmiany:
          - kolizje TUZ-a nie są już samodzielnymi rigid body podczas ładowania I3D,
          - FrontHydraulic dołącza je do głównej bryły ciągnika przez compoundChildActive,
          - pozostałe siedem konfiguracji pozostawia je poza fizyką,
          - przedni WOM używa natywnego powerTakeOffConfiguration nr 2,
          - przednie węże używają natywnego connectionHoseConfiguration nr 2,
          - tylko FrontHydraulic wybiera konfiguracje nr 2; inne opcje wybierają puste nr 1,
          - zachowano routing jointów TEST 10 i działające tankowanie.

          Do sprawdzenia:
          - brak kolizji TUZ-a we wszystkich siedmiu pozostałych opcjach,
          - obecność kolizji z FrontHydraulic,
          - brak warningów Failed to call setIsCompoundChild,
          - brak warningu attacherJointIndex 4 dla powerTakeOff bez TUZ-a,
          - przedni WOM/węże z kompatybilnym narzędziem,
          - tankowanie.
          EOF
          gh release create v1.0.1.1-test11 --target "$SHA" --title '1.0.1.1 CLEANUP TEST 11' --prerelease --notes-file /tmp/notes.md dist/FS25_Ursus_1654_1954_Pack.zip dist/FS25_Ursus_1654_1954_Pack.zip.sha256
