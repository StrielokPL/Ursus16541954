name: Finalize and publish 1.0.4.0T4

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-1.0.4.0T4.yml

permissions:
  contents: write

jobs:
  publish-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add T4 changelog
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('CHANGELOG.md')
          s = p.read_text(encoding='utf-8')
          if '## 1.0.4.0T4' not in s:
              entry = '''\n## 1.0.4.0T4\nTestowe zwiększenie marginesu ochronnego ADS load guard.\n\nZmiany względem 1.0.4.0T3:\n- próg ochronnej redukcji przy obciążeniu >80% podniesiono z 60% do 65% maksymalnych obrotów (~1320 → ~1430 rpm dla 2200 rpm),\n- próg blokady upshiftu pod wysokim obciążeniem podniesiono z 75% do 83% maksymalnych obrotów (~1650 → ~1825 rpm),\n- zmiana zostawia bezpieczny zapas obrotów po przejściu L→H (1.25 → 1.00) zamiast lądowania dokładnie na granicy luggingu ADS,\n- próg obciążenia, czasy cooldown/histerezy, redukcja o jeden wirtualny stopień i bridge awarii ADS pozostają bez zmian.\n\n'''
              marker = '## Dalszy rozwój'
              if marker not in s:
                  raise SystemExit('Changelog marker not found')
              p.write_text(s.replace(marker, entry + marker, 1), encoding='utf-8')
          PY

      - name: Validate source tree
        run: python3 tools/validate_current.py

      - name: Build test ZIP
        run: ./build.sh

      - name: Commit T4 changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "Document 1.0.4.0T4 ADS load guard tuning"
          git push origin HEAD:main
          echo "TARGET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.4.0T4 \
            dist/FS25_Ursus_1654_1954_Pack.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "1.0.4.0T4 — ADS load-guard safety margin" \
            --prerelease \
            --notes $'Test tuning based on 1.0.4.0T3.\n\nChanges:\n- protective high-load downshift threshold raised from 60% to 65% max RPM (~1320 -> ~1430 rpm at 2200 max),\n- high-load upshift guard raised from 75% to 83% max RPM (~1650 -> ~1825 rpm),\n- this leaves a small RPM reserve across the 1.25 -> 1.00 L/H powershift instead of landing directly on the ADS lugging boundary,\n- load threshold (>80%), cooldowns, one-step reduction logic and ADS failure bridge are unchanged.'

      - name: Remove one-shot workflow
        run: |
          git pull --rebase origin main
          rm .github/workflows/publish-1.0.4.0T4.yml
          git add .github/workflows/publish-1.0.4.0T4.yml
          git commit -m "Remove 1.0.4.0T4 publish workflow"
          git push origin HEAD:main
