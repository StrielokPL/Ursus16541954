name: Prepare 1.0.1.1 cleanup test 17

on:
  push:
    branches: [cleanup-1.0.1.1]
    paths: [.github/workflows/cleanup-1.0.1.1-test17.yml]

permissions:
  contents: write

jobs:
  correct-front-equipment-collision-volumes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup-1.0.1.1
          fetch-depth: 0

      - name: Move weight collisions forward and replace TUZ collision
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          i3d_path = Path('Ursus1934.i3d')
          text = i3d_path.read_text(encoding='utf-8')

          replacements = {
              'name="frontWeightFrameCollisionA" translation="0 0.949 1.72869"':
                  'name="frontWeightFrameCollisionA" translation="0 0.949 2.05069"',
              'name="frontWeightLayer1CollisionA" translation="0 0.883 1.903817"':
                  'name="frontWeightLayer1CollisionA" translation="0 0.883 2.225817"',
              'name="frontWeightLayer2CollisionA" translation="0 0.873516 2.265457"':
                  'name="frontWeightLayer2CollisionA" translation="0 0.873516 2.587457"',
              'name="frontWeightFrameCollisionB" translation="0 0.949 1.72869"':
                  'name="frontWeightFrameCollisionB" translation="0 0.949 2.05069"',
              'name="frontWeightLayer1CollisionB" translation="0 0.883 1.907097"':
                  'name="frontWeightLayer1CollisionB" translation="0 0.883 2.229097"',
              'name="frontWeightLayer2CollisionB" translation="0 0.872855 2.267317"':
                  'name="frontWeightLayer2CollisionB" translation="0 0.872855 2.589317"',
              'name="colli05" translation="0 0.933008 1.30872"':
                  'name="colli05" translation="0 0.933008 1.63072"',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one current TEST 16 value: {old}')
              text = text.replace(old, new, 1)

          old_tuz_1 = (
              '            <Shape shapeId="156" name="frontHydraulicCollision1" '
              'translation="-7.80565e-08 0.858 1.75047" '
              'rotation="-90 -5.00896e-06 -5.00896e-06" nodeId="7002" '
              'castsShadows="false" receiveShadows="false" compoundChild="true" '
              'density="0.001" nonRenderable="true" '
              'collisionFilterGroup="0x10004" collisionFilterMask="0xfe3ffb83" />'
          )
          new_tuz = (
              '            <Shape shapeId="170" name="frontHydraulicCollisionBox" '
              'translation="0 0.8 1.73872" nodeId="7002" '
              'castsShadows="false" receiveShadows="false" compoundChild="true" '
              'density="0.001" nonRenderable="true" '
              'collisionFilterGroup="0x10004" collisionFilterMask="0xfe3ffb83" />'
          )
          obsolete_tuz = [
              (
                  '            <Shape shapeId="157" name="frontHydraulicCollision2" '
                  'translation="0 1.00577 1.51864" rotation="-90 0 0" nodeId="7003" '
                  'castsShadows="false" receiveShadows="false" compoundChild="true" '
                  'density="0.001" nonRenderable="true" '
                  'collisionFilterGroup="0x10004" collisionFilterMask="0xfe3ffb83" />\n'
              ),
              (
                  '            <Shape shapeId="154" name="frontHydraulicArmCollision" '
                  'translation="-1.90735e-08 0.715 1.776" rotation="21.9317 -0 0" '
                  'nodeId="7010" castsShadows="false" receiveShadows="false" '
                  'compoundChild="true" density="0.001" nonRenderable="true" '
                  'collisionFilterGroup="0x10004" collisionFilterMask="0xfe3ffb83" />\n'
              ),
          ]
          if text.count(old_tuz_1) != 1:
              raise SystemExit('Current TEST 16 TUZ collision 1 was not found')
          text = text.replace(old_tuz_1, new_tuz, 1)
          for obsolete in obsolete_tuz:
              if text.count(obsolete) != 1:
                  raise SystemExit('An obsolete TEST 16 TUZ collision was not found')
              text = text.replace(obsolete, '', 1)

          if 'name="frontHydraulicCollision1"' in text:
              raise SystemExit('Old TUZ collision 1 name remains')
          if 'name="frontHydraulicCollision2"' in text:
              raise SystemExit('Old TUZ collision 2 remains')
          if 'name="frontHydraulicArmCollision"' in text:
              raise SystemExit('Old TUZ arm collision remains')

          i3d_path.write_text(text, encoding='utf-8')

          xml_path = Path('Ursus1934.xml')
          vehicle_text = xml_path.read_text(encoding='utf-8')
          obsolete_paths = [
              '0&gt;10|7|1|16',
              '0&gt;10|7|1|17',
          ]
          for path in obsolete_paths:
              pattern = re.compile(
                  rf'^\s*<objectChange node="{re.escape(path)}" '
                  rf'compoundChildActive="(?:true|false)" />\n',
                  re.M,
              )
              vehicle_text, count = pattern.subn('', vehicle_text)
              if count != 8:
                  raise SystemExit(
                      f'Expected eight obsolete configuration entries for {path}, found {count}'
                  )
          xml_path.write_text(vehicle_text, encoding='utf-8')

          i3d_root = ET.parse(i3d_path).getroot()
          nodes = {
              node.get('nodeId'): node
              for node in i3d_root.iter()
              if node.get('nodeId') is not None
          }

          expected_weight_z = {
              '7004': '2.05069',
              '7005': '2.225817',
              '7006': '2.587457',
              '7007': '2.05069',
              '7008': '2.229097',
              '7009': '2.589317',
          }
          for node_id, expected_z in expected_weight_z.items():
              node = nodes.get(node_id)
              if node is None:
                  raise SystemExit(f'Missing weight collision node {node_id}')
              translation = node.get('translation', '').split()
              if len(translation) != 3 or translation[2] != expected_z:
                  raise SystemExit(f'Wrong forward position for node {node_id}')
              if node.get('compoundChild') != 'true':
                  raise SystemExit(f'Weight collision node {node_id} is not compound')
              if node.get('nonRenderable') != 'true':
                  raise SystemExit(f'Weight collision node {node_id} is renderable')

          colli05 = nodes.get('880')
          if (
              colli05 is None
              or colli05.get('name') != 'colli05'
              or colli05.get('translation') != '0 0.933008 1.63072'
          ):
              raise SystemExit('Base weight collision colli05 was not moved correctly')

          tuz_box = nodes.get('7002')
          if (
              tuz_box is None
              or tuz_box.get('name') != 'frontHydraulicCollisionBox'
              or tuz_box.get('shapeId') != '170'
              or tuz_box.get('translation') != '0 0.8 1.73872'
              or tuz_box.get('compoundChild') != 'true'
              or tuz_box.get('nonRenderable') != 'true'
              or tuz_box.get('collisionFilterGroup') != '0x10004'
              or tuz_box.get('collisionFilterMask') != '0xfe3ffb83'
          ):
              raise SystemExit('Dedicated TUZ collision box is invalid')
          if '7003' in nodes or '7010' in nodes:
              raise SystemExit('Obsolete TEST 16 TUZ collision nodes remain')

          p_cube = nodes.get('879')
          if (
              p_cube is None
              or p_cube.get('translation') != '0 1.13534 0.661'
              or p_cube.get('scale') != '1 1 0.93'
          ):
              raise SystemExit('Approved TEST 15 pCube2 state was not preserved')

          root_component = nodes.get('242')
          if (
              root_component is None
              or root_component.get('collisionFilterGroup') != '0x40010004'
          ):
              raise SystemExit('Approved TEST 8 FILLABLE root state was not preserved')

          vehicle = ET.parse(xml_path).getroot()
          configs = vehicle.findall(
              'attacherJoints/attacherJointConfigurations/attacherJointConfiguration'
          )
          if len(configs) != 8:
              raise SystemExit(f'Expected eight front configurations, found {len(configs)}')

          expected_names = [
              '$l10n_configuration_valueNo',
              'FrameWeight',
              '1200kg',
              '2000kg',
              'FrameWeight',
              '600kg',
              '1500kg',
              'FrontHydraulic',
          ]
          weight_paths = [
              '0>10|7|0|3',
              '0>10|7|0|4',
              '0>10|7|0|5',
              '0>10|7|8|3',
              '0>10|7|8|4',
              '0>10|7|8|5',
          ]
          weight_matrix = [
              [False, False, False, False, False, False],
              [True,  False, False, False, False, False],
              [True,  True,  False, False, False, False],
              [True,  True,  True,  False, False, False],
              [False, False, False, True,  False, False],
              [False, False, False, True,  True,  False],
              [False, False, False, True,  True,  True],
              [False, False, False, False, False, False],
          ]
          for index, config in enumerate(configs):
              if config.get('name') != expected_names[index]:
                  raise SystemExit(f'Unexpected front configuration at index {index + 1}')
              changes = config.findall('objectChange')

              tuz_changes = [
                  change for change in changes
                  if change.get('node') == '0>10|7|1|15'
                  and change.get('compoundChildActive') is not None
              ]
              expected_tuz = 'true' if index == 7 else 'false'
              if len(tuz_changes) != 1 or tuz_changes[0].get('compoundChildActive') != expected_tuz:
                  raise SystemExit(f'Wrong TUZ box state in {config.get("name")}')

              for obsolete_path in ('0>10|7|1|16', '0>10|7|1|17'):
                  if any(change.get('node') == obsolete_path for change in changes):
                      raise SystemExit(f'Obsolete path {obsolete_path} remains')

              for path, active in zip(weight_paths, weight_matrix[index]):
                  matching = [
                      change for change in changes
                      if change.get('node') == path
                      and change.get('compoundChildActive') is not None
                  ]
                  expected = 'true' if active else 'false'
                  if len(matching) != 1 or matching[0].get('compoundChildActive') != expected:
                      raise SystemExit(f'Wrong {path} state in {config.get("name")}')

              colli_changes = [
                  change for change in changes
                  if change.get('node') == '0>11|1'
                  and change.get('compoundChildActive') is not None
              ]
              expected_colli = 'true' if 1 <= index <= 6 else 'false'
              if len(colli_changes) != 1 or colli_changes[0].get('compoundChildActive') != expected_colli:
                  raise SystemExit(f'Wrong colli05 state in {config.get("name")}')

          print('Front collision volumes repositioned and TUZ uses one proven box mesh')
          PY

      - name: Validate and build
        run: |
          python3 tools/validate_current.py
          ./build.sh
          test -f dist/FS25_Ursus_1654_1954_Pack.zip

      - name: Commit cleanup test 17
        run: |
          rm .github/workflows/cleanup-1.0.1.1-test17.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Ursus1934.i3d Ursus1934.xml .github/workflows/cleanup-1.0.1.1-test17.yml
          git commit -m 'Correct front equipment collision volumes test 17'
          git push origin HEAD:cleanup-1.0.1.1

      - name: Publish cleanup pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          sha256sum dist/FS25_Ursus_1654_1954_Pack.zip > dist/FS25_Ursus_1654_1954_Pack.zip.sha256
          cat > /tmp/notes.md <<'EOF'
          ## 1.0.1.1 CLEANUP TEST 17

          Korekta położenia kolizji przedniego wyposażenia i uproszczenie kolizji TUZ-a.

          Zmiany:
          - bazowy box obciążników colli05 przesunięty o 0,322 m do przodu,
          - sześć konfigurowanych brył obciążników przesuniętych o 0,322 m do przodu,
          - trzy nieskuteczne siatki kolizji FrontHydraulic zastąpione jednym sprawdzonym boxem,
          - box TUZ-a jest aktywny wyłącznie z konfiguracją FrontHydraulic,
          - zatwierdzona główna kolizja pCube2 z TEST 15 pozostaje bez zmian,
          - tankowanie, jointy, WOM, przewody i geometria wizualna pozostają bez zmian.

          Do sprawdzenia:
          - F5: przednia krawędź boxa każdej opcji względem modelu,
          - F5 i fizyczna kolizja FrontHydraulic,
          - brak bryły dodatku w wariancie bez przedniego wyposażenia,
          - tankowanie oraz log.
          EOF
          gh release create v1.0.1.1-test17 --target "$SHA" --title '1.0.1.1 CLEANUP TEST 17' --prerelease --notes-file /tmp/notes.md dist/FS25_Ursus_1654_1954_Pack.zip dist/FS25_Ursus_1654_1954_Pack.zip.sha256
