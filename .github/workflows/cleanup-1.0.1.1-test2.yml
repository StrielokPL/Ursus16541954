name: Prepare 1.0.1.1 cleanup test 2

on:
  push:
    branches:
      - cleanup-1.0.1.1
    paths:
      - .github/workflows/cleanup-1.0.1.1-test2.yml

permissions:
  contents: write

jobs:
  patch-build-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: cleanup-1.0.1.1
          fetch-depth: 0

      - name: Apply cleanup test 2
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          vehicle_path = Path('Ursus1934.xml')
          text = vehicle_path.read_text(encoding='utf-8')

          # All six legacy local hoses fail to resolve in FS25 1.21.1.0,
          # so they never become usable hose nodes. Remove only those six blocks.
          pattern = r'\n        <localHose>\r?\n.*?\r?\n        </localHose>'
          text, count = re.subn(pattern, '', text, count=6, flags=re.DOTALL)
          if count != 6:
              raise SystemExit(f'Expected 6 localHose blocks, removed {count}')
          if '<localHose>' in text:
              raise SystemExit('Unexpected localHose block remains after cleanup')
          vehicle_path.write_text(text, encoding='utf-8')

          sounds_path = Path('configurations/Ursus1934_sounds.xml')
          sounds = sounds_path.read_text(encoding='utf-8')

          # These four templates are explicitly reported as missing by the fresh FS25 log.
          for label, pattern in [
              ('lights block', r'\s*<lights>\s*<sounds>\s*<turnLight\s+template="SWITCH_TURNLIGHT_JD"\s*/>\s*</sounds>\s*</lights>'),
              ('attacherJoints block', r'\s*<attacherJoints>\s*<sounds>\s*<attach\s+template="ATTACH_01"\s*/>\s*<hydraulic\s+template="defaultHydraulicSound"\s*/>\s*</sounds>\s*</attacherJoints>'),
              ('drivable block', r'\s*<drivable>\s*<sounds>\s*<waterSplash\s+template="WATER_SPLASH_01"\s*/>\s*</sounds>\s*</drivable>'),
          ]:
              sounds, n = re.subn(pattern, '\n', sounds, count=1, flags=re.DOTALL)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 block, removed {n}')

          for obsolete in ['SWITCH_TURNLIGHT_JD', 'ATTACH_01', 'defaultHydraulicSound', 'WATER_SPLASH_01']:
              if obsolete in sounds:
                  raise SystemExit(f'Obsolete sound template remains: {obsolete}')

          sounds_path.write_text(sounds, encoding='utf-8')

          for path in [vehicle_path, sounds_path, Path('modDesc.xml')]:
              ET.parse(path)

          print('Cleanup test 2 applied successfully')
          PY

      - name: Validate cleanup tree
        run: |
          python3 tools/validate_current.py
          ./build.sh
          test -f dist/FS25_Ursus_1654_1954_Pack.zip

      - name: Commit cleanup test 2
        shell: bash
        run: |
          rm .github/workflows/cleanup-1.0.1.1-test2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Ursus1934.xml configurations/Ursus1934_sounds.xml .github/workflows/cleanup-1.0.1.1-test2.yml
          git commit -m 'Remove unresolved legacy sounds and local hoses'
          git push origin HEAD:cleanup-1.0.1.1

      - name: Publish cleanup pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          sha256sum dist/FS25_Ursus_1654_1954_Pack.zip > dist/FS25_Ursus_1654_1954_Pack.zip.sha256
          if gh release view v1.0.1.1-test2 >/dev/null 2>&1; then
            gh release delete v1.0.1.1-test2 --yes --cleanup-tag
          fi
          cat > /tmp/notes.md <<'EOF'
          ## 1.0.1.1 CLEANUP TEST 2

          Drugi etap czyszczenia logu FS25 na bazie CLEANUP TEST 1.

          Dodatkowe zmiany:
          - usunięto cztery nieistniejące template'y dźwięków: `WATER_SPLASH_01`, `SWITCH_TURNLIGHT_JD`, `defaultHydraulicSound`, `ATTACH_01`,
          - zachowano działające własne dźwięki silnika oraz `hornDefault`,
          - usunięto 6 starych `localHose`, których FS25 nie potrafił zbudować z długości 0.20/0.30 m i średnicy 0.01 m.

          Nie ruszano jeszcze `exactFillRootNode`, dashboard emitterów ani ostrzeżenia non-binary I3D.
          EOF
          gh release create v1.0.1.1-test2 \
            --target "$SHA" \
            --title '1.0.1.1 CLEANUP TEST 2' \
            --prerelease \
            --notes-file /tmp/notes.md \
            dist/FS25_Ursus_1654_1954_Pack.zip \
            dist/FS25_Ursus_1654_1954_Pack.zip.sha256
