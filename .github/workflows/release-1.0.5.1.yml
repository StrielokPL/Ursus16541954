name: Publish 1.0.5.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-1.0.5.1.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Finalize stable 1.0.5.1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          OLD = '1.0.5.0T5'
          VERSION = '1.0.5.1'

          current = Path('VERSION').read_text(encoding='utf-8').strip()
          if current != OLD:
              raise SystemExit(f'Expected {OLD}, got {current}')
          Path('VERSION').write_text(VERSION + '\n', encoding='utf-8')

          p = Path('modDesc.xml')
          s = p.read_text(encoding='utf-8')
          old = f'<version>{OLD}</version>'
          new = f'<version>{VERSION}</version>'
          if old not in s:
              raise SystemExit('modDesc version anchor not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          for filename in ('UrsusTransmissionFix.lua', 'UrsusColorFix.lua'):
              p = Path(filename)
              s = p.read_text(encoding='utf-8')
              if OLD not in s:
                  raise SystemExit(f'{filename}: old version marker not found')
              p.write_text(s.replace(OLD, VERSION), encoding='utf-8')

          p = Path('CHANGELOG.md')
          s = p.read_text(encoding='utf-8')
          addition = '''\n## 1.0.5.1\nStabilne wydanie systemu kolorowania testowanego w serii 1.0.5.0T1–T5.\n\nZmiany względem 1.0.4.1:\n- nadwozie i felgi otrzymały niezależne konfiguracje kolorów,\n- `baseColor` i `rimColor` korzystają z pełnej natywnej palety GIANTS (`useDefaultColors=true`) oraz pickera koloru niestandardowego RGB,\n- `UrsusColorFix.lua` przenosi rzeczywisty kolor wybranej konfiguracji na zatwierdzoną whitelistę legacy meshów nadwozia i felg,\n- sygnatura konfiguracji uwzględnia RGB, dzięki czemu wykrywana jest również zmiana koloru niestandardowego przy tym samym indeksie konfiguracji,\n- obciążniki kół, lampy, szyby, hydraulika, złącza i kalkomanie pozostają poza kolorowaniem,\n- naprawiono pakowanie `UrsusColorFix.lua`; walidator sprawdza teraz wszystkie `extraSourceFiles` wymagane przez `modDesc.xml`,\n- dodano klapę dachową `SzyberDach/szyber` do elementów malowanych kolorem nadwozia, bez zmiany jej animacji, ramy, uszczelek ani mechanizmu,\n- skrzynia, ADS, silniki, fizyka, koła, kolizje i pozostałe wcześniej zatwierdzone funkcje nie zostały zmienione.\n\nTest runtime T5 potwierdził poprawne kolorowanie klapy dachowej. Log `20260829-110303` nie zawiera nowych błędów Lua ani błędów związanych z Ursusem. Pozostaje wyłącznie zaakceptowany warning `Ursus1934.i3d contains non-binary indexed triangle sets` związany z geometrią `FS25MirrorExact`.\n\n'''
          marker = '## 1.0.5.0T5'
          if '## 1.0.5.1' not in s:
              if marker not in s:
                  raise SystemExit('CHANGELOG T5 marker not found')
              s = s.replace(marker, addition + marker, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('PROJECT_STATE.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('# Project state — 1.0.4.1', '# Project state — 1.0.5.1', 1)
          s = s.replace('Current stable baseline is **1.0.4.1**.', 'Current stable baseline is **1.0.5.1**.', 1)
          s = s.replace('Current version: **1.0.4.1**.', 'Current version: **1.0.5.1**.', 1)
          stable_note = '''\n\n## Color configuration — stable 1.0.5.1\n- Nadwozie i felgi mają niezależne konfiguracje kolorów z pełną paletą GIANTS i własnym RGB.\n- Runtime bridge `UrsusColorFix.lua` obsługuje legacy materiały I3D bez ingerencji w fizykę pojazdu.\n- Klapa dachowa `SzyberDach/szyber` jest objęta kolorem nadwozia; rama, uszczelki i mechanizm pozostają bez zmian.\n- `UrsusColorFix.lua` jest obowiązkowo walidowany jako `extraSourceFile` i pakowany do ZIP.\n- T5 został potwierdzony wizualnie i logowo; brak nowych błędów związanych z Ursusem.\n'''
          if '## Color configuration — stable 1.0.5.1' not in s:
              s += stable_note
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate source tree
        run: python3 tools/validate_current.py

      - name: Build stable ZIP
        run: ./build.sh

      - name: Verify stable ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile
          z = zipfile.ZipFile('dist/FS25_Ursus_1654_1954_Pack.zip')
          names = set(z.namelist())
          assert 'UrsusColorFix.lua' in names
          assert 'UrsusTransmissionFix.lua' in names
          assert 'modDesc.xml' in names
          color = z.read('UrsusColorFix.lua').decode('utf-8')
          trans = z.read('UrsusTransmissionFix.lua').decode('utf-8')
          moddesc = z.read('modDesc.xml').decode('utf-8')
          assert 'szyber = true' in color
          assert '1.0.5.1' in color
          assert '1.0.5.1' in trans
          assert '<version>1.0.5.1</version>' in moddesc
          print('Stable ZIP verification: OK')
          PY

      - name: Commit stable 1.0.5.1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION modDesc.xml UrsusTransmissionFix.lua UrsusColorFix.lua CHANGELOG.md PROJECT_STATE.md
          git commit -m 'Release 1.0.5.1 stable color configuration'
          git push origin HEAD:main

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET_SHA=$(git rev-parse HEAD)
          cat > /tmp/release-notes.md <<'EOF'
          Stable release promoted from the tested 1.0.5.0T1–T5 color series.

          Highlights:
          - independent body and rim color configurations,
          - full native GIANTS palette plus custom RGB picker,
          - runtime legacy-material color bridge through UrsusColorFix.lua,
          - custom RGB changes are detected even when the configuration index does not change,
          - wheel weights, lights, glass, hydraulics, connectors and decals remain excluded from body/rim recoloring,
          - UrsusColorFix.lua packaging and extraSourceFiles validation fixed,
          - animated roof hatch SzyberDach/szyber now follows body color,
          - no changes to transmission, ADS integration, engines, physics, wheels or collisions.

          T5 was confirmed visually in game. Runtime log 20260829-110303 contains no new Lua errors or Ursus-related errors.

          Known accepted issue: Ursus1934.i3d may report a non-binary indexed triangle sets warning from the inline FS25MirrorExact geometry; no gameplay or visual regression is known.
          EOF
          gh release create v1.0.5.1 dist/FS25_Ursus_1654_1954_Pack.zip \
            --target "$TARGET_SHA" \
            --title '1.0.5.1 — Stable color configuration' \
            --notes-file /tmp/release-notes.md

      - name: Remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          git rm .github/workflows/release-1.0.5.1.yml
          git commit -m 'Remove one-shot 1.0.5.1 release workflow'
          git push origin HEAD:main
