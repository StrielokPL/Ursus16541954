name: Publish 1.0.6.0T9

on:
  push:
    paths:
      - '.github/workflows/release-1.0.6.0T9.yml'

permissions:
  contents: write

jobs:
  prerelease:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply front ballast physics fix
        run: python3 tools/apply_1_0_6_0T9.py

      - name: Ensure wheel files are unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- wheels

      - name: Validate source tree
        run: python3 tools/validate_current.py

      - name: Build test ZIP
        run: ./build.sh

      - name: Verify T9 ballast ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile

          with zipfile.ZipFile('dist/FS25_Ursus_1654_1954_Pack.zip') as z:
              moddesc = z.read('modDesc.xml').decode('utf-8')
              xml = z.read('Ursus1934.xml').decode('utf-8')
              lua = z.read('UrsusTransmissionFix.lua').decode('utf-8')

          assert '<version>1.0.6.0T9</version>' in moddesc
          assert '<action name="URSUS_WIDMO_TOGGLE_4WD" category="VEHICLE" axisType="HALF"/>' in moddesc
          assert 'KEY_lctrl KEY_4' in moddesc

          for name in ('600kg', '1200kg', '1500kg', '2000kg'):
              start = xml.index(f'<attacherJointConfiguration name="{name}"')
              end = xml.index('</attacherJointConfiguration>', start)
              seg = xml[start:end]
              assert 'massActive=' not in seg, name
              assert 'centerOfMassActive=' not in seg, name

          start = xml.index('<motorConfiguration name="1934 Widmo"')
          end = xml.index('</motorConfiguration>', start)
          widmo = xml[start:end]
          assert 'hp="290"' in widmo
          assert 'torqueScale="1.100"' in widmo
          assert 'centerOfMassActive="0 1.10 -1.80"' in widmo
          assert 'name="8/4"' in widmo
          assert '<groups ' not in widmo

          assert 'local URSUS_BODY_MASS_KG = 3700' in lua
          assert '["600kg"]  = {massKg=600,  y=0.65, z=2.45}' in lua
          assert '["1200kg"] = {massKg=1200, y=0.65, z=2.45}' in lua
          assert '["1500kg"] = {massKg=1500, y=0.70, z=2.65}' in lua
          assert '["2000kg"] = {massKg=2000, y=0.70, z=2.65}' in lua
          assert 'setMass(node, targetMassKg / 1000)' in lua
          assert 'component.defaultMass = targetMassKg / 1000' in lua
          assert 'setCenterOfMass(node, comX, comY, comZ)' in lua
          assert 'applyFrontBallastPhysics(self, xmlFile)' in lua

          # T8 drivetrain feature must survive unchanged functionally.
          assert 'removeAllDifferentials(spec.motorizedNode)' in lua
          assert 'InputAction.URSUS_WIDMO_TOGGLE_4WD' in lua
          assert 'manual RWD/4x4 toggle enabled' in lua
          assert 'maxLongStiffness = (self.maxLongStiffness or 30.0) * 1.20' in lua

          print('ZIP T9 front ballast physics check: OK')
          PY

      - name: Commit 1.0.6.0T9
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION modDesc.xml Ursus1934.xml UrsusTransmissionFix.lua UrsusColorFix.lua CHANGELOG.md PROJECT_STATE.md
          git commit -m 'Release 1.0.6.0T9 front ballast physics fix'
          git push origin HEAD:main

      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET_SHA=$(git rev-parse HEAD)
          cat > /tmp/release-notes.md <<'EOF'
          Front ballast physics fix following T8.

          Changes:
          - 600/1200/1500/2000 kg front ballast now adds its nominal mass to the main tractor body component,
          - the resulting centre of mass is calculated as a weighted combination of tractor body mass and the front ballast position instead of using fixed COM overrides,
          - Widmo ballast calculation starts from Widmo's own COM; normal variants start from the standard tractor COM,
          - FrameWeight-only and FrontHydraulic remain without an added nominal ballast mass,
          - all wheel files and wheel-weight configurations are intentionally unchanged,
          - Widmo T8 manual RWD/4x4 toggle, 290 hp, direct 8F/4R and rear tire tuning remain unchanged.
          EOF
          gh release create v1.0.6.0T9 dist/FS25_Ursus_1654_1954_Pack.zip \
            --target "$TARGET_SHA" \
            --title '1.0.6.0T9 — Front ballast physics fix' \
            --prerelease \
            --notes-file /tmp/release-notes.md

      - name: Remove one-shot release helpers
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          git rm .github/workflows/release-1.0.6.0T9.yml tools/apply_1_0_6_0T9.py
          git commit -m 'Remove one-shot 1.0.6.0T9 release helpers'
          git push origin HEAD:main
