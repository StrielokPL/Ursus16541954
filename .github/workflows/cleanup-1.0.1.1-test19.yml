name: Prepare 1.0.1.1 cleanup test 19

on:
  push:
    branches: [cleanup-1.0.1.1]
    paths: [.github/workflows/cleanup-1.0.1.1-test19.yml]

permissions:
  contents: write

jobs:
  finalize-front-collision-box-offsets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup-1.0.1.1
          fetch-depth: 0

      - name: Apply final offsets and widen 2000 kg and TUZ boxes
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          i3d_path = Path('Ursus1934.i3d')
          text = i3d_path.read_text(encoding='utf-8')

          for node_id in ('7004', '7005', '7006'):
              if f'nodeId="{node_id}"' in text:
                  raise SystemExit(f'Node ID {node_id} is already occupied')
          for name in (
              'frontWeight2000CollisionBoxLeft',
              'frontWeight2000CollisionBoxRight',
              'frontHydraulicCollisionBoxLeft',
              'frontHydraulicCollisionBoxRight',
          ):
              if f'name="{name}"' in text:
                  raise SystemExit(f'TEST 19 collision {name} already exists')

          old_light = (
              'name="colli05" translation="0 0.933008 1.73072"'
          )
          new_light = (
              'name="colli05" translation="0 0.933008 1.78072"'
          )
          if text.count(old_light) != 1:
              raise SystemExit('Current TEST 18 light box position was not found')
          text = text.replace(old_light, new_light, 1)

          old_heavy_line = (
              '        <Shape shapeId="170" name="frontWeightHeavyCollisionBox" '
              'translation="0 0.933008 1.93072" compoundChild="true" '
              'nodeId="7003" materialIds="42" castsShadows="false" '
              'receiveShadows="false" nonRenderable="true" '
              'collisionFilterGroup="0x10004" '
              'collisionFilterMask="0xfe3ffb83" />'
          )
          new_weight_block = (
              '        <Shape shapeId="170" name="frontWeightHeavyCollisionBox" '
              'translation="0 0.933008 2.03072" compoundChild="true" '
              'nodeId="7003" materialIds="42" castsShadows="false" '
              'receiveShadows="false" nonRenderable="true" '
              'collisionFilterGroup="0x10004" '
              'collisionFilterMask="0xfe3ffb83" />\n'
              '        <Shape shapeId="170" name="frontWeight2000CollisionBoxLeft" '
              'translation="-0.1 0.933008 2.03072" compoundChild="true" '
              'nodeId="7004" materialIds="42" castsShadows="false" '
              'receiveShadows="false" nonRenderable="true" '
              'collisionFilterGroup="0x10004" '
              'collisionFilterMask="0xfe3ffb83" />\n'
              '        <Shape shapeId="170" name="frontWeight2000CollisionBoxRight" '
              'translation="0.1 0.933008 2.03072" compoundChild="true" '
              'nodeId="7005" materialIds="42" castsShadows="false" '
              'receiveShadows="false" nonRenderable="true" '
              'collisionFilterGroup="0x10004" '
              'collisionFilterMask="0xfe3ffb83" />'
          )
          if text.count(old_heavy_line) != 1:
              raise SystemExit('Current TEST 18 heavy box line was not found')
          text = text.replace(old_heavy_line, new_weight_block, 1)

          old_tuz_line = (
              '            <Shape shapeId="170" '
              'name="frontHydraulicCollisionBox" '
              'translation="0 0.8 2.03872" nodeId="7002" '
              'castsShadows="false" receiveShadows="false" '
              'compoundChild="true" density="0.001" nonRenderable="true" '
              'collisionFilterGroup="0x10004" '
              'collisionFilterMask="0xfe3ffb83" />'
          )
          new_tuz_block = (
              '            <Shape shapeId="170" '
              'name="frontHydraulicCollisionBoxLeft" '
              'translation="-0.1 0.8 2.13872" nodeId="7002" '
              'castsShadows="false" receiveShadows="false" '
              'compoundChild="true" density="0.001" nonRenderable="true" '
              'collisionFilterGroup="0x10004" '
              'collisionFilterMask="0xfe3ffb83" />\n'
              '            <Shape shapeId="170" '
              'name="frontHydraulicCollisionBoxRight" '
              'translation="0.1 0.8 2.13872" nodeId="7006" '
              'castsShadows="false" receiveShadows="false" '
              'compoundChild="true" density="0.001" nonRenderable="true" '
              'collisionFilterGroup="0x10004" '
              'collisionFilterMask="0xfe3ffb83" />'
          )
          if text.count(old_tuz_line) != 1:
              raise SystemExit('Current TEST 18 TUZ box line was not found')
          text = text.replace(old_tuz_line, new_tuz_block, 1)
          i3d_path.write_text(text, encoding='utf-8')

          xml_path = Path('Ursus1934.xml')
          vehicle_text = xml_path.read_text(encoding='utf-8')
          container_pattern = re.compile(
              r'(<attacherJointConfigurations\b[^>]*>)(.*?)(</attacherJointConfigurations>)',
              re.S,
          )
          container_match = container_pattern.search(vehicle_text)
          if container_match is None:
              raise SystemExit('Front attacherJointConfigurations block not found')

          config_pattern = re.compile(
              r'(<attacherJointConfiguration\b([^>]*)>)(.*?)(</attacherJointConfiguration>)',
              re.S,
          )
          inner = container_match.group(2)
          matches = list(config_pattern.finditer(inner))
          expected_names = [
              '$l10n_configuration_valueNo',
              'FrameWeight',
              '1200kg',
              '2000kg',
              'FrameWeight',
              '600kg',
              '1500kg',
              'FrontHydraulic',
          ]
          old_heavy_states = [False, False, False, True, False, False, True, False]
          new_heavy_states = [False, False, False, False, False, False, True, False]
          weight_2000_states = [False, False, False, True, False, False, False, False]
          tuz_states = [False, False, False, False, False, False, False, True]
          if len(matches) != 8:
              raise SystemExit(f'Expected eight front configurations, found {len(matches)}')
          for path in ('0&gt;11|3', '0&gt;11|4', '0&gt;10|7|1|16'):
              if f'node="{path}"' in inner:
                  raise SystemExit(f'New TEST 19 path already exists: {path}')

          output = []
          cursor = 0
          for index, match in enumerate(matches):
              attrs = match.group(2)
              name_match = re.search(r'\bname="([^"]+)"', attrs)
              name = name_match.group(1) if name_match else None
              if name != expected_names[index]:
                  raise SystemExit(f'Unexpected configuration {index + 1}: {name!r}')

              body = match.group(3)
              old_heavy_state = 'true' if old_heavy_states[index] else 'false'
              new_heavy_state = 'true' if new_heavy_states[index] else 'false'
              weight_2000_state = 'true' if weight_2000_states[index] else 'false'
              tuz_state = 'true' if tuz_states[index] else 'false'

              old_heavy_marker = (
                  '<objectChange node="0&gt;11|2" '
                  f'compoundChildActive="{old_heavy_state}" />'
              )
              new_weight_markers = (
                  '<objectChange node="0&gt;11|2" '
                  f'compoundChildActive="{new_heavy_state}" />\n'
                  '        <objectChange node="0&gt;11|3" '
                  f'compoundChildActive="{weight_2000_state}" />\n'
                  '        <objectChange node="0&gt;11|4" '
                  f'compoundChildActive="{weight_2000_state}" />'
              )
              if body.count(old_heavy_marker) != 1:
                  raise SystemExit(f'Expected one current heavy marker in {name}')
              body = body.replace(old_heavy_marker, new_weight_markers, 1)

              old_tuz_marker = (
                  '<objectChange node="0&gt;10|7|1|15" '
                  f'compoundChildActive="{tuz_state}" />'
              )
              new_tuz_markers = (
                  old_tuz_marker + '\n'
                  '        <objectChange node="0&gt;10|7|1|16" '
                  f'compoundChildActive="{tuz_state}" />'
              )
              if body.count(old_tuz_marker) != 1:
                  raise SystemExit(f'Expected one current TUZ marker in {name}')
              body = body.replace(old_tuz_marker, new_tuz_markers, 1)

              output.append(inner[cursor:match.start()])
              output.append(match.group(1) + body + match.group(4))
              cursor = match.end()
          output.append(inner[cursor:])

          vehicle_text = (
              vehicle_text[:container_match.start()]
              + container_match.group(1)
              + ''.join(output)
              + container_match.group(3)
              + vehicle_text[container_match.end():]
          )
          xml_path.write_text(vehicle_text, encoding='utf-8')

          i3d_root = ET.parse(i3d_path).getroot()
          nodes = {
              node.get('nodeId'): node
              for node in i3d_root.iter()
              if node.get('nodeId') is not None
          }

          expected_boxes = {
              '880': ('colli05', '170', '0 0.933008 1.78072'),
              '7003': (
                  'frontWeightHeavyCollisionBox',
                  '170',
                  '0 0.933008 2.03072',
              ),
              '7004': (
                  'frontWeight2000CollisionBoxLeft',
                  '170',
                  '-0.1 0.933008 2.03072',
              ),
              '7005': (
                  'frontWeight2000CollisionBoxRight',
                  '170',
                  '0.1 0.933008 2.03072',
              ),
              '7002': (
                  'frontHydraulicCollisionBoxLeft',
                  '170',
                  '-0.1 0.8 2.13872',
              ),
              '7006': (
                  'frontHydraulicCollisionBoxRight',
                  '170',
                  '0.1 0.8 2.13872',
              ),
          }
          for node_id, (name, shape_id, translation) in expected_boxes.items():
              node = nodes.get(node_id)
              if (
                  node is None
                  or node.get('name') != name
                  or node.get('shapeId') != shape_id
                  or node.get('translation') != translation
                  or node.get('compoundChild') != 'true'
                  or node.get('nonRenderable') != 'true'
                  or node.get('collisionFilterGroup') != '0x10004'
                  or node.get('collisionFilterMask') != '0xfe3ffb83'
              ):
                  raise SystemExit(f'Invalid TEST 19 collision box node {node_id}')

          p_cube = nodes.get('879')
          if (
              p_cube is None
              or p_cube.get('translation') != '0 1.13534 0.661'
              or p_cube.get('scale') != '1 1 0.93'
          ):
              raise SystemExit('Approved TEST 15 pCube2 state was not preserved')

          root_component = nodes.get('242')
          if (
              root_component is None
              or root_component.get('collisionFilterGroup') != '0x40010004'
          ):
              raise SystemExit('Approved TEST 8 FILLABLE root state was not preserved')

          vehicle = ET.parse(xml_path).getroot()
          configs = vehicle.findall(
              'attacherJoints/attacherJointConfigurations/attacherJointConfiguration'
          )
          if len(configs) != 8:
              raise SystemExit(f'Expected eight parsed front configurations, found {len(configs)}')

          light_states = [False, True, True, False, True, True, False, False]
          for index, config in enumerate(configs):
              if config.get('name') != expected_names[index]:
                  raise SystemExit(f'Unexpected parsed configuration at index {index + 1}')
              changes = config.findall('objectChange')
              expected_paths = (
                  ('0>11|1', light_states[index]),
                  ('0>11|2', new_heavy_states[index]),
                  ('0>11|3', weight_2000_states[index]),
                  ('0>11|4', weight_2000_states[index]),
                  ('0>10|7|1|15', tuz_states[index]),
                  ('0>10|7|1|16', tuz_states[index]),
              )
              for path, expected_active in expected_paths:
                  matching = [
                      change for change in changes
                      if change.get('node') == path
                      and change.get('compoundChildActive') is not None
                  ]
                  expected = 'true' if expected_active else 'false'
                  if len(matching) != 1 or matching[0].get('compoundChildActive') != expected:
                      raise SystemExit(f'Wrong {path} state in {config.get("name")}')

          print('Final requested offsets and exact 20 cm widening applied')
          PY

      - name: Validate and build
        run: |
          python3 tools/validate_current.py
          ./build.sh
          test -f dist/FS25_Ursus_1654_1954_Pack.zip

      - name: Commit cleanup test 19
        run: |
          rm .github/workflows/cleanup-1.0.1.1-test19.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Ursus1934.i3d Ursus1934.xml .github/workflows/cleanup-1.0.1.1-test19.yml
          git commit -m 'Finalize front collision offsets and widths test 19'
          git push origin HEAD:cleanup-1.0.1.1

      - name: Publish cleanup pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          sha256sum dist/FS25_Ursus_1654_1954_Pack.zip > dist/FS25_Ursus_1654_1954_Pack.zip.sha256
          cat > /tmp/notes.md <<'EOF'
          ## 1.0.1.1 CLEANUP TEST 19

          Końcowe korekty offsetów i szerokości boxów przedniego wyposażenia.

          Zmiany:
          - FrameWeight, 600 kg i 1200 kg: łączny offset +0,472 m,
          - 1500 kg: łączny offset +0,722 m i zwykła szerokość,
          - 2000 kg: łączny offset +0,722 m oraz poszerzenie o 0,20 m,
          - FrontHydraulic: łączny offset +0,722 m oraz poszerzenie o 0,20 m,
          - poszerzenie wykonano dwiema nakładającymi się bryłami przesuniętymi o -0,10 m i +0,10 m,
          - wariant bez przedniego wyposażenia nie aktywuje żadnego dodatkowego boxa,
          - zatwierdzona główna kolizja pCube2 pozostaje bez zmian,
          - tankowanie, jointy, WOM, przewody i geometria wizualna pozostają bez zmian.

          Do sprawdzenia:
          - F5: pozycja FrameWeight, 600 kg i 1200 kg,
          - F5: pozycja 1500 kg,
          - F5: pozycja i szerokość 2000 kg oraz FrontHydraulic,
          - brak boxa w opcji bez wyposażenia,
          - tankowanie oraz log.
          EOF
          gh release create v1.0.1.1-test19 --target "$SHA" --title '1.0.1.1 CLEANUP TEST 19' --prerelease --notes-file /tmp/notes.md dist/FS25_Ursus_1654_1954_Pack.zip dist/FS25_Ursus_1654_1954_Pack.zip.sha256
