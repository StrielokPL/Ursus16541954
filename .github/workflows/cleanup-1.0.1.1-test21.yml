name: Prepare 1.0.1.1 cleanup test 21

on:
  push:
    branches: [cleanup-1.0.1.1]
    paths: [.github/workflows/cleanup-1.0.1.1-test21.yml]

permissions:
  contents: write

jobs:
  split-front-collision-dimensions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup-1.0.1.1
          fetch-depth: 0

      - name: Apply corrected width length and height groups
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          i3d_path = Path('Ursus1934.i3d')
          text = i3d_path.read_text(encoding='utf-8')

          for node_id in ('7005', '7007', '7008'):
              if f'nodeId="{node_id}"' in text:
                  raise SystemExit(f'Node ID {node_id} is already occupied')
          for name in (
              'frontWeightWideShortCollisionBoxLeft',
              'frontWeightWideShortCollisionBoxRight',
              'frontWeightWideLongCollisionBoxLeft',
              'frontWeightWideLongCollisionBoxRight',
              'frontWeightNarrowLongCollisionBox',
          ):
              if f'name="{name}"' in text:
                  raise SystemExit(f'TEST 21 collision {name} already exists')

          old_weight_block = (
              '        <Shape shapeId="170" name="colli05" '
              'translation="0 0.933008 1.78072" compoundChild="true" '
              'nodeId="880" materialIds="42" castsShadows="true" '
              'receiveShadows="true" nonRenderable="true" '
              'collisionFilterGroup="0x10004" '
              'collisionFilterMask="0xfe3ffb83" />\n'
              '        <Shape shapeId="170" name="frontWeightGroup2CollisionBoxLeft" '
              'translation="-0.1 0.933008 2.03072" compoundChild="true" '
              'nodeId="7003" materialIds="42" castsShadows="false" '
              'receiveShadows="false" nonRenderable="true" '
              'collisionFilterGroup="0x10004" '
              'collisionFilterMask="0xfe3ffb83" />\n'
              '        <Shape shapeId="170" name="frontWeightGroup2CollisionBoxRight" '
              'translation="0.1 0.933008 2.03072" compoundChild="true" '
              'nodeId="7004" materialIds="42" castsShadows="false" '
              'receiveShadows="false" nonRenderable="true" '
              'collisionFilterGroup="0x10004" '
              'collisionFilterMask="0xfe3ffb83" />'
          )
          new_weight_block = (
              '        <Shape shapeId="170" name="colli05" '
              'translation="0 0.883008 1.78072" compoundChild="true" '
              'nodeId="880" materialIds="42" castsShadows="true" '
              'receiveShadows="true" nonRenderable="true" '
              'collisionFilterGroup="0x10004" '
              'collisionFilterMask="0xfe3ffb83" />\n'
              '        <Shape shapeId="170" name="frontWeightWideLongCollisionBoxLeft" '
              'translation="-0.4 0.883008 2.03072" compoundChild="true" '
              'nodeId="7003" materialIds="42" castsShadows="false" '
              'receiveShadows="false" nonRenderable="true" '
              'collisionFilterGroup="0x10004" '
              'collisionFilterMask="0xfe3ffb83" />\n'
              '        <Shape shapeId="170" name="frontWeightWideLongCollisionBoxRight" '
              'translation="0.4 0.883008 2.03072" compoundChild="true" '
              'nodeId="7004" materialIds="42" castsShadows="false" '
              'receiveShadows="false" nonRenderable="true" '
              'collisionFilterGroup="0x10004" '
              'collisionFilterMask="0xfe3ffb83" />\n'
              '        <Shape shapeId="170" name="frontWeightWideShortCollisionBoxLeft" '
              'translation="-0.4 0.883008 1.78072" compoundChild="true" '
              'nodeId="7005" materialIds="42" castsShadows="false" '
              'receiveShadows="false" nonRenderable="true" '
              'collisionFilterGroup="0x10004" '
              'collisionFilterMask="0xfe3ffb83" />\n'
              '        <Shape shapeId="170" name="frontWeightWideShortCollisionBoxRight" '
              'translation="0.4 0.883008 1.78072" compoundChild="true" '
              'nodeId="7007" materialIds="42" castsShadows="false" '
              'receiveShadows="false" nonRenderable="true" '
              'collisionFilterGroup="0x10004" '
              'collisionFilterMask="0xfe3ffb83" />\n'
              '        <Shape shapeId="170" name="frontWeightNarrowLongCollisionBox" '
              'translation="0 0.883008 2.03072" compoundChild="true" '
              'nodeId="7008" materialIds="42" castsShadows="false" '
              'receiveShadows="false" nonRenderable="true" '
              'collisionFilterGroup="0x10004" '
              'collisionFilterMask="0xfe3ffb83" />'
          )
          if text.count(old_weight_block) != 1:
              raise SystemExit('Exact TEST 20 front weight block was not found')
          text = text.replace(old_weight_block, new_weight_block, 1)

          old_tuz_left = (
              'name="frontHydraulicCollisionBoxLeft" '
              'translation="-0.1 0.8 2.13872"'
          )
          new_tuz_left = (
              'name="frontHydraulicCollisionBoxLeft" '
              'translation="-0.4 0.8 2.13872"'
          )
          old_tuz_right = (
              'name="frontHydraulicCollisionBoxRight" '
              'translation="0.1 0.8 2.13872"'
          )
          new_tuz_right = (
              'name="frontHydraulicCollisionBoxRight" '
              'translation="0.4 0.8 2.13872"'
          )
          if text.count(old_tuz_left) != 1 or text.count(old_tuz_right) != 1:
              raise SystemExit('Exact TEST 20 TUZ box positions were not found')
          text = text.replace(old_tuz_left, new_tuz_left, 1)
          text = text.replace(old_tuz_right, new_tuz_right, 1)
          i3d_path.write_text(text, encoding='utf-8')

          xml_path = Path('Ursus1934.xml')
          vehicle_text = xml_path.read_text(encoding='utf-8')
          container_pattern = re.compile(
              r'(<attacherJointConfigurations\b[^>]*>)(.*?)(</attacherJointConfigurations>)',
              re.S,
          )
          container_match = container_pattern.search(vehicle_text)
          if container_match is None:
              raise SystemExit('Front attacherJointConfigurations block not found')

          config_pattern = re.compile(
              r'(<attacherJointConfiguration\b([^>]*)>)(.*?)(</attacherJointConfiguration>)',
              re.S,
          )
          inner = container_match.group(2)
          matches = list(config_pattern.finditer(inner))
          expected_names = [
              '$l10n_configuration_valueNo',
              'FrameWeight',
              '1200kg',
              '2000kg',
              'FrameWeight',
              '600kg',
              '1500kg',
              'FrontHydraulic',
          ]
          old_path1 = [False, True, True, False, False, True, False, False]
          old_path23 = [False, False, False, True, True, False, True, False]
          narrow_short = [False, False, False, False, True, True, False, False]
          wide_long = [False, False, False, True, False, False, False, False]
          wide_short = [False, True, True, False, False, False, False, False]
          narrow_long = [False, False, False, False, False, False, True, False]
          tuz_states = [False, False, False, False, False, False, False, True]

          if len(matches) != 8:
              raise SystemExit(f'Expected eight front configurations, found {len(matches)}')
          for path in ('0&gt;11|4', '0&gt;11|5', '0&gt;11|6'):
              if f'node="{path}"' in inner:
                  raise SystemExit(f'New TEST 21 path already exists: {path}')

          def state_marker(path, active):
              return (
                  f'<objectChange node="{path}" '
                  f'compoundChildActive="{"true" if active else "false"}" />'
              )

          output = []
          cursor = 0
          for index, match in enumerate(matches):
              attrs = match.group(2)
              name_match = re.search(r'\bname="([^"]+)"', attrs)
              name = name_match.group(1) if name_match else None
              if name != expected_names[index]:
                  raise SystemExit(f'Unexpected configuration {index + 1}: {name!r}')

              body = match.group(3)
              old1 = state_marker('0&gt;11|1', old_path1[index])
              new1 = state_marker('0&gt;11|1', narrow_short[index])
              if body.count(old1) != 1:
                  raise SystemExit(f'Expected one current path 1 marker in configuration {index + 1}')
              body = body.replace(old1, new1, 1)

              old2 = state_marker('0&gt;11|2', old_path23[index])
              new2 = state_marker('0&gt;11|2', wide_long[index])
              if body.count(old2) != 1:
                  raise SystemExit(f'Expected one current path 2 marker in configuration {index + 1}')
              body = body.replace(old2, new2, 1)

              old3 = state_marker('0&gt;11|3', old_path23[index])
              new_group_markers = (
                  state_marker('0&gt;11|3', wide_long[index]) + '\n'
                  '        ' + state_marker('0&gt;11|4', wide_short[index]) + '\n'
                  '        ' + state_marker('0&gt;11|5', wide_short[index]) + '\n'
                  '        ' + state_marker('0&gt;11|6', narrow_long[index])
              )
              if body.count(old3) != 1:
                  raise SystemExit(f'Expected one current path 3 marker in configuration {index + 1}')
              body = body.replace(old3, new_group_markers, 1)

              output.append(inner[cursor:match.start()])
              output.append(match.group(1) + body + match.group(4))
              cursor = match.end()
          output.append(inner[cursor:])

          vehicle_text = (
              vehicle_text[:container_match.start()]
              + container_match.group(1)
              + ''.join(output)
              + container_match.group(3)
              + vehicle_text[container_match.end():]
          )
          xml_path.write_text(vehicle_text, encoding='utf-8')

          i3d_root = ET.parse(i3d_path).getroot()
          nodes = {
              node.get('nodeId'): node
              for node in i3d_root.iter()
              if node.get('nodeId') is not None
          }
          expected_boxes = {
              '880': ('colli05', '170', '0 0.883008 1.78072'),
              '7003': (
                  'frontWeightWideLongCollisionBoxLeft',
                  '170',
                  '-0.4 0.883008 2.03072',
              ),
              '7004': (
                  'frontWeightWideLongCollisionBoxRight',
                  '170',
                  '0.4 0.883008 2.03072',
              ),
              '7005': (
                  'frontWeightWideShortCollisionBoxLeft',
                  '170',
                  '-0.4 0.883008 1.78072',
              ),
              '7007': (
                  'frontWeightWideShortCollisionBoxRight',
                  '170',
                  '0.4 0.883008 1.78072',
              ),
              '7008': (
                  'frontWeightNarrowLongCollisionBox',
                  '170',
                  '0 0.883008 2.03072',
              ),
              '7002': (
                  'frontHydraulicCollisionBoxLeft',
                  '170',
                  '-0.4 0.8 2.13872',
              ),
              '7006': (
                  'frontHydraulicCollisionBoxRight',
                  '170',
                  '0.4 0.8 2.13872',
              ),
          }
          for node_id, (name, shape_id, translation) in expected_boxes.items():
              node = nodes.get(node_id)
              if (
                  node is None
                  or node.get('name') != name
                  or node.get('shapeId') != shape_id
                  or node.get('translation') != translation
                  or node.get('compoundChild') != 'true'
                  or node.get('nonRenderable') != 'true'
                  or node.get('collisionFilterGroup') != '0x10004'
                  or node.get('collisionFilterMask') != '0xfe3ffb83'
              ):
                  raise SystemExit(f'Invalid TEST 21 collision box node {node_id}')

          p_cube = nodes.get('879')
          if (
              p_cube is None
              or p_cube.get('translation') != '0 1.13534 0.661'
              or p_cube.get('scale') != '1 1 0.93'
          ):
              raise SystemExit('Approved TEST 15 pCube2 state was not preserved')

          root_component = nodes.get('242')
          if (
              root_component is None
              or root_component.get('collisionFilterGroup') != '0x40010004'
          ):
              raise SystemExit('Approved TEST 8 FILLABLE root state was not preserved')

          vehicle = ET.parse(xml_path).getroot()
          configs = vehicle.findall(
              'attacherJoints/attacherJointConfigurations/attacherJointConfiguration'
          )
          if len(configs) != 8:
              raise SystemExit(f'Expected eight parsed front configurations, found {len(configs)}')

          for index, config in enumerate(configs):
              if config.get('name') != expected_names[index]:
                  raise SystemExit(f'Unexpected parsed configuration at index {index + 1}')
              changes = config.findall('objectChange')
              expected_paths = (
                  ('0>11|1', narrow_short[index]),
                  ('0>11|2', wide_long[index]),
                  ('0>11|3', wide_long[index]),
                  ('0>11|4', wide_short[index]),
                  ('0>11|5', wide_short[index]),
                  ('0>11|6', narrow_long[index]),
                  ('0>10|7|1|15', tuz_states[index]),
                  ('0>10|7|1|16', tuz_states[index]),
              )
              for path, expected_active in expected_paths:
                  matching = [
                      change for change in changes
                      if change.get('node') == path
                      and change.get('compoundChildActive') is not None
                  ]
                  expected = 'true' if expected_active else 'false'
                  if len(matching) != 1 or matching[0].get('compoundChildActive') != expected:
                      raise SystemExit(f'Wrong {path} state in configuration {index + 1}')

          print('TEST 21 width, length, height and configuration groups validated')
          PY

      - name: Validate and build
        run: |
          python3 tools/validate_current.py
          ./build.sh
          test -f dist/FS25_Ursus_1654_1954_Pack.zip

      - name: Commit cleanup test 21
        run: |
          rm .github/workflows/cleanup-1.0.1.1-test21.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Ursus1934.i3d Ursus1934.xml .github/workflows/cleanup-1.0.1.1-test21.yml
          git commit -m 'Correct front collision groups test 21'
          git push origin HEAD:cleanup-1.0.1.1

      - name: Publish cleanup pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          sha256sum dist/FS25_Ursus_1654_1954_Pack.zip > dist/FS25_Ursus_1654_1954_Pack.zip.sha256
          cat > /tmp/notes.md <<'EOF'
          ## 1.0.1.1 CLEANUP TEST 21

          Poprawione przypisanie szerokości i długości kolizji przedniego wyposażenia.

          Grupy:
          - pierwszy FrameWeight i 1200 kg: krótka szeroka kolizja,
          - 2000 kg: długa szeroka kolizja,
          - drugi FrameWeight i 600 kg: krótka wąska kolizja,
          - 1500 kg: długa wąska kolizja,
          - FrontHydraulic: osobna długa szeroka kolizja,
          - brak wyposażenia: wszystkie dodatkowe boxy wyłączone.

          Wymiary i pozycje:
          - 2000 kg, 1500 kg i FrontHydraulic zachowują identyczny wysięg,
          - szerokie boxy obciążników i TUZ-a mają środki w X -0,40/+0,40 m,
          - szerokie kopie są oddalone o 0,80 m i powinny nakładać się w około 1/4,
          - wszystkie boxy obciążników opuszczono o 0,05 m,
          - wysokość TUZ-a pozostaje bez zmian,
          - zatwierdzona główna kolizja pCube2 pozostaje bez zmian.

          Do sprawdzenia:
          - F5: pierwszy FrameWeight, 1200 kg i 2000 kg — jednakowa szerokość,
          - F5: drugi FrameWeight, 600 kg i 1500 kg — jednakowa węższa szerokość,
          - F5: jednakowy wysięg 2000 kg, 1500 kg i TUZ-a,
          - F5: rozstaw szerokich kopii i obniżenie boxów o 5 cm,
          - wariant bez wyposażenia, fizyczne kolizje, tankowanie oraz log.
          EOF
          gh release create v1.0.1.1-test21 --target "$SHA" --title '1.0.1.1 CLEANUP TEST 21' --prerelease --notes-file /tmp/notes.md dist/FS25_Ursus_1654_1954_Pack.zip dist/FS25_Ursus_1654_1954_Pack.zip.sha256
