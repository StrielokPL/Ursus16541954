name: Publish 1.0.6.0T2

on:
  push:
    paths:
      - '.github/workflows/release-1.0.6.0T2.yml'

permissions:
  contents: write

jobs:
  prerelease:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Widmo T2 tuning
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          OLD = '1.0.6.0T1'
          VERSION = '1.0.6.0T2'

          current = Path('VERSION').read_text(encoding='utf-8').strip()
          if current != OLD:
              raise SystemExit(f'Expected {OLD}, got {current}')
          Path('VERSION').write_text(VERSION + '\n', encoding='utf-8')

          p = Path('modDesc.xml')
          s = p.read_text(encoding='utf-8')
          old = f'<version>{OLD}</version>'
          new = f'<version>{VERSION}</version>'
          if old not in s:
              raise SystemExit('modDesc version anchor not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          for filename in ('UrsusTransmissionFix.lua', 'UrsusColorFix.lua'):
              p = Path(filename)
              s = p.read_text(encoding='utf-8')
              if OLD not in s:
                  raise SystemExit(f'{filename}: old version marker not found')
              p.write_text(s.replace(OLD, VERSION), encoding='utf-8')

          p = Path('Ursus1934.xml')
          s = p.read_text(encoding='utf-8')
          start = s.index('<motorConfiguration name="1934 Widmo"')
          end = s.index('</motorConfiguration>', start)
          segment = s[start:end]

          segment = segment.replace('name="1934 Widmo" hp="190" price="20000"', 'name="1934 Widmo" hp="225" price="20000"', 1)
          old_motor = '''<motor torqueScale="0.722" minRpm="850" maxRpm="2200" maxForwardSpeed="40" maxBackwardSpeed="15" brakeForce="6" lowBrakeForceScale="0.22" lowBrakeForceSpeedLimit="1" dampingRateScale="0.85">
          <torque rpm="850" torque="0.78" />
          <torque rpm="1150" torque="0.91" />
          <torque rpm="1480" torque="1" />
          <torque rpm="1700" torque="0.99" />
          <torque rpm="1900" torque="0.95" />
          <torque rpm="2050" torque="0.91" />
          <torque rpm="2200" torque="0.851783401" />
        </motor>'''
          new_motor = '''<motor torqueScale="0.850" minRpm="850" maxRpm="2200" maxForwardSpeed="40" maxBackwardSpeed="15" brakeForce="6" lowBrakeForceScale="0.22" lowBrakeForceSpeedLimit="1" dampingRateScale="0.85">
          <torque rpm="850" torque="0.75" />
          <torque rpm="1150" torque="0.9" />
          <torque rpm="1500" torque="1" />
          <torque rpm="1700" torque="0.99" />
          <torque rpm="1900" torque="0.95" />
          <torque rpm="2050" torque="0.91" />
          <torque rpm="2200" torque="0.856793892" />
        </motor>'''
          if old_motor not in segment:
              raise SystemExit('Widmo T1 motor block not found')
          segment = segment.replace(old_motor, new_motor, 1)
          if 'centerOfMassActive="0 1.05 -1.25"' not in segment:
              raise SystemExit('Widmo T1 center of mass not found')
          segment = segment.replace('centerOfMassActive="0 1.05 -1.25"', 'centerOfMassActive="0 1.05 -1.65"', 1)
          s = s[:start] + segment + s[end:]
          p.write_text(s, encoding='utf-8')

          p = Path('CHANGELOG.md')
          s = p.read_text(encoding='utf-8')
          addition = '''\n## 1.0.6.0T2\nDrugi test fizycznej skłonności Widma do podnoszenia przedniej osi.\n\nZmiany względem 1.0.6.0T1:\n- `1934 Widmo` otrzymuje pełną charakterystykę silnika `1934 Chip`: 225 KM, `torqueScale=0.850` i tę samą krzywą momentu,\n- środek masy Widma cofnięto o kolejne 40 cm: z `0 1.05 -1.25` do `0 1.05 -1.65`,\n- wysokość środka masy pozostaje bez zmian względem T1,\n- nadal brak `addTorque`, `addForce` i innych skryptowych impulsów; T2 nadal testuje wyłącznie naturalną fizykę gry,\n- pozostałe warianty silnika i fizyka stabilnego 1.0.5.1 pozostają bez zmian.\n\n'''
          marker = '## 1.0.6.0T1'
          if '## 1.0.6.0T2' not in s:
              if marker not in s:
                  raise SystemExit('CHANGELOG T1 marker not found')
              s = s.replace(marker, addition + marker, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('PROJECT_STATE.md')
          s = p.read_text(encoding='utf-8')
          note = '''\n\n### Widmo wheelie physics test — 1.0.6.0T2\n- T1 nie podnosił przodu nawet z dużą masą z tyłu.\n- Widmo korzysta teraz z pełnej charakterystyki `1934 Chip` (225 KM, torqueScale 0.850).\n- Wyłącznie Widmo: `centerOfMassActive="0 1.05 -1.65"`.\n- T2 nadal nie używa skryptowego momentu ani siły.\n'''
          if '### Widmo wheelie physics test — 1.0.6.0T2' not in s:
              s += note
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate source tree
        run: python3 tools/validate_current.py

      - name: Build test ZIP
        run: ./build.sh

      - name: Verify Widmo T2 changes in ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile
          z = zipfile.ZipFile('dist/FS25_Ursus_1654_1954_Pack.zip')
          xml = z.read('Ursus1934.xml').decode('utf-8')
          moddesc = z.read('modDesc.xml').decode('utf-8')
          assert '<version>1.0.6.0T2</version>' in moddesc
          start = xml.index('<motorConfiguration name="1934 Widmo"')
          end = xml.index('</motorConfiguration>', start)
          seg = xml[start:end]
          assert 'hp="225"' in seg
          assert 'torqueScale="0.850"' in seg
          assert '<torque rpm="1500" torque="1" />' in seg
          assert 'centerOfMassActive="0 1.05 -1.65"' in seg
          assert 'centerOfMassActive="0 1.05 -1.25"' not in seg
          print('ZIP Widmo T2 check: OK')
          PY

      - name: Commit 1.0.6.0T2
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION modDesc.xml Ursus1934.xml UrsusTransmissionFix.lua UrsusColorFix.lua CHANGELOG.md PROJECT_STATE.md
          git commit -m 'Release 1.0.6.0T2 Widmo power and balance test'
          git push origin HEAD:main

      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET_SHA=$(git rev-parse HEAD)
          cat > /tmp/release-notes.md <<'EOF'
          Second Widmo wheelie-physics experiment based on T1.

          Changes:
          - Widmo now uses the full 1934 Chip engine characteristics: 225 hp and torqueScale 0.850,
          - Widmo center of mass moves from 0 1.05 -1.25 to 0 1.05 -1.65,
          - no scripted torque/force assist yet,
          - all other engine variants remain unchanged.

          Test goal: repeat the same heavy rear-load test and check whether the stronger engine plus additional rearward balance can naturally unload or lift the front axle.
          EOF
          gh release create v1.0.6.0T2 dist/FS25_Ursus_1654_1954_Pack.zip \
            --target "$TARGET_SHA" \
            --title '1.0.6.0T2 — Widmo power and balance test' \
            --prerelease \
            --notes-file /tmp/release-notes.md

      - name: Remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          git rm .github/workflows/release-1.0.6.0T2.yml
          git commit -m 'Remove one-shot 1.0.6.0T2 release workflow'
          git push origin HEAD:main
