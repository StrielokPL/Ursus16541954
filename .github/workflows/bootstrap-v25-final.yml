name: Finalize V25 source tree

on:
  push:
    paths:
      - 'bootstrap2/TRIGGER'

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify V25 archive
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap2/part_000.txt bootstrap2/part_001.txt bootstrap2/part_002.txt bootstrap2/part_003.txt > /tmp/v25.b64
          base64 --decode /tmp/v25.b64 > /tmp/v25.tgz
          echo '0d4acc84de12d5e8c5e5e644e49ab6517d6132de96cd451b005ec3de32c7821b  /tmp/v25.tgz' | sha256sum --check --strict
          tar -tzf /tmp/v25.tgz > /tmp/v25-files.txt
          echo 'Archive verified. Files:'
          cat /tmp/v25-files.txt

      - name: Extract V25 source tree
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/v25.tgz -C .
          test -s Ursus1934.i3d
          test -s Ursus1934.xml
          test -s UrsusTransmissionFix.lua
          test -s shaders/vehicleShader.xml
          test -s modDesc.xml
          grep -q 'V25 COLLISION SAFE' VERSION
          grep -q 'collisionFilterGroup="0x10004"' Ursus1934.i3d
          grep -q 'collisionFilterMask="0xfe3ffb83"' Ursus1934.i3d
          grep -q 'collisionTrigger useSize="true"' Ursus1934.xml
          grep -q 'V24B sequential 8x4 L/H splitter enabled' UrsusTransmissionFix.lua

      - name: Commit verified V25 source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit'
            exit 0
          fi
          git commit -m 'Restore complete verified V25 COLLISION SAFE source tree'
          git push
