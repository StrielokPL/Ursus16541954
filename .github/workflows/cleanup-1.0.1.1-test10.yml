name: Prepare 1.0.1.1 cleanup test 10

on:
  push:
    branches: [cleanup-1.0.1.1]
    paths: [.github/workflows/cleanup-1.0.1.1-test10.yml]

permissions:
  contents: write

jobs:
  front-hydraulic-routing:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup-1.0.1.1
          fetch-depth: 0

      - name: Fix front joint routing and conditional collision
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          vehicle_path = Path('Ursus1934.xml')
          tree = ET.parse(vehicle_path)
          root = tree.getroot()
          attacher_joints = root.find('attacherJoints')
          if attacher_joints is None:
              raise SystemExit('attacherJoints not found')

          configs = attacher_joints.find('attacherJointConfigurations')
          if configs is None:
              raise SystemExit('TEST 9 attacherJointConfigurations not found')
          front_config = next((c for c in configs if c.get('name') == 'FrontHydraulic'), None)
          if front_config is None:
              raise SystemExit('FrontHydraulic configuration not found')
          configured_joint = front_config.find('attacherJoint')
          if configured_joint is None or configured_joint.get('node') != '0>10|7|1|0|0|0|0':
              raise SystemExit('Configured front hydraulic joint not found')

          obsolete_front_nodes = {
              '0>10|7|0|2|17',
              '0>10|7|8|2|11',
          }
          removed = []
          for joint in list(attacher_joints.findall('attacherJoint')):
              if joint.get('node') in obsolete_front_nodes:
                  removed.append(joint.get('node'))
                  attacher_joints.remove(joint)
          if set(removed) != obsolete_front_nodes:
              raise SystemExit(f'Expected both legacy front weight joints, removed: {removed}')

          base_joints = attacher_joints.findall('attacherJoint')
          expected_base_nodes = [
              '0>5|0|0|0|0',
              '0>5|1|0|0',
              '0>5|1|1',
          ]
          if [j.get('node') for j in base_joints] != expected_base_nodes:
              raise SystemExit('Unexpected remaining base joint order')

          changed_rear = 0
          changed_front = 0
          for element in root.iter():
              indices = element.get('attacherJointIndices')
              if indices == '1 3 4':
                  element.set('attacherJointIndices', '1 2 3')
                  changed_rear += 1
              elif indices == '2 5':
                  element.set('attacherJointIndices', '4')
                  changed_front += 1
          if changed_rear != 12:
              raise SystemExit(f'Expected 12 rear PTO/hose routes, changed {changed_rear}')
          if changed_front != 5:
              raise SystemExit(f'Expected 5 front PTO/hose routes, changed {changed_front}')

          ET.indent(tree, space='  ')
          tree.write(vehicle_path, encoding='utf-8', xml_declaration=True)

          i3d_path = Path('Ursus1934.i3d')
          i3d_tree = ET.parse(i3d_path)
          i3d_root = i3d_tree.getroot()
          collisions = {
              n.get('name'): n for n in i3d_root.iter()
              if n.get('name') in ('frontHydraulicCollision1', 'frontHydraulicCollision2')
          }
          if set(collisions) != {'frontHydraulicCollision1', 'frontHydraulicCollision2'}:
              raise SystemExit('TEST 9 collision shapes not found')
          for collision in collisions.values():
              if collision.get('compoundChild') != 'true':
                  raise SystemExit('Unexpected TEST 9 collision state')
              collision.set('compoundChild', 'false')

          component = next((n for n in i3d_root.iter() if n.get('nodeId') == '242'), None)
          if component is None or component.get('collisionFilterGroup') != '0x40010004':
              raise SystemExit('TEST 8 FILLABLE component state was not preserved')

          ET.indent(i3d_tree, space='  ')
          i3d_tree.write(i3d_path, encoding='utf-8', xml_declaration=True)

          check = ET.parse(vehicle_path).getroot()
          aj = check.find('attacherJoints')
          if len(aj.findall('attacherJoint')) != 3:
              raise SystemExit('Expected exactly three global rear joints')
          cfg = next(c for c in aj.find('attacherJointConfigurations') if c.get('name') == 'FrontHydraulic')
          if len(cfg.findall('attacherJoint')) != 1:
              raise SystemExit('Expected exactly one configured front joint')
          pto = check.find('powerTakeOffs')
          outputs = [n.get('attacherJointIndices') for n in pto.findall('output')]
          if outputs != ['1 2 3', '4']:
              raise SystemExit(f'Unexpected PTO routing: {outputs}')
          print('Joint order fixed: rear 1-3, configured front 4; TUZ collision defaults inactive')
          PY

      - name: Validate and build
        run: |
          python3 tools/validate_current.py
          ./build.sh
          test -f dist/FS25_Ursus_1654_1954_Pack.zip

      - name: Commit cleanup test 10
        run: |
          rm .github/workflows/cleanup-1.0.1.1-test10.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Ursus1934.xml Ursus1934.i3d .github/workflows/cleanup-1.0.1.1-test10.yml
          git commit -m 'Fix front hydraulic routing and conditional collision test 10'
          git push origin HEAD:cleanup-1.0.1.1

      - name: Publish cleanup pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          sha256sum dist/FS25_Ursus_1654_1954_Pack.zip > dist/FS25_Ursus_1654_1954_Pack.zip.sha256
          cat > /tmp/notes.md <<'EOF'
          ## 1.0.1.1 CLEANUP TEST 10

          Poprawka routingu przedniego TUZ-a po TEST 9.

          Zmiany:
          - uporządkowano indeksy jointów: tył 1-3, konfigurowany przedni TUZ 4,
          - WOM i przewody przednie wskazują teraz joint 4 zamiast starych indeksów 2/5,
          - usunięto dwa globalne legacy jointy ukrytych ram obciążników,
          - bez FrontHydraulic nie istnieje żaden przedni punkt pozwalający podpiąć narzędzie,
          - kolizje TUZ-a są domyślnie wyłączone i aktywowane dopiero przez FrontHydraulic,
          - zachowano działające tankowanie z TEST 8.

          Do sprawdzenia:
          - mulczer na FrontHydraulic: pivot, WOM i przewody z przodu,
          - konfiguracja bez TUZ-a: brak możliwości podpięcia z przodu i brak kolizji TUZ-a,
          - FrontHydraulic: obecność kolizji,
          - tankowanie i nowe wpisy w logu.
          EOF
          gh release create v1.0.1.1-test10 --target "$SHA" --title '1.0.1.1 CLEANUP TEST 10' --prerelease --notes-file /tmp/notes.md dist/FS25_Ursus_1654_1954_Pack.zip dist/FS25_Ursus_1654_1954_Pack.zip.sha256
