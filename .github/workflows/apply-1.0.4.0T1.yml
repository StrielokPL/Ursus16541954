name: Apply 1.0.4.0T1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-1.0.4.0T1.yml

permissions:
  contents: write

jobs:
  apply-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply compatibility changes
        env:
          URSUS_LUA_B64:  
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import base64
          import os

          vehicle_path = Path("Ursus1934.xml")
          vehicle = vehicle_path.read_text(encoding="utf-8")

          year_anchor = "    <price>42000</price>\n    <lifetime>600</lifetime>"
          assert vehicle.count(year_anchor) == 1, "storeData year anchor changed"
          vehicle = vehicle.replace(
              year_anchor,
              "    <price>42000</price>\n    <year>2009</year>\n    <lifetime>600</lifetime>",
              1,
          )

          fuel_old = 'fillTypes="diesel" capacity="300"'
          assert vehicle.count(fuel_old) == 1, "diesel capacity anchor changed"
          vehicle = vehicle.replace(fuel_old, 'fillTypes="diesel" capacity="355"', 1)
          vehicle_path.write_text(vehicle, encoding="utf-8")

          mod_desc_path = Path("modDesc.xml")
          mod_desc = mod_desc_path.read_text(encoding="utf-8")
          old_version = "<version>1.0.3.0</version>"
          assert mod_desc.count(old_version) == 1, "modDesc version anchor changed"
          mod_desc = mod_desc.replace(old_version, "<version>1.0.4.0T1</version>", 1)
          mod_desc_path.write_text(mod_desc, encoding="utf-8")

          Path("VERSION").write_text("1.0.4.0T1\n", encoding="utf-8")
          Path("UrsusTransmissionFix.lua").write_bytes(base64.b64decode(os.environ["URSUS_LUA_B64"]))
          PYCODE

      - name: Validate source tree
        run: python3 tools/validate_current.py

      - name: Build test ZIP
        run: ./build.sh

      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/apply-1.0.4.0T1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Ursus1934.xml UrsusTransmissionFix.lua modDesc.xml VERSION .github/workflows/apply-1.0.4.0T1.yml
          git commit -m "Add 1.0.4.0T1 compatibility test"
          git push origin HEAD:main
