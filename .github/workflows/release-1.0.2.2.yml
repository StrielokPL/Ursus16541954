name: Publish 1.0.2.2

on:
  push:
    branches:
      - release-1.0.2.2

permissions:
  contents: write

env:
  BASE_SHA: 11705c56cac4433cf4adeef06b9a3a4cc4230e8c
  TAG: v1.0.2.2
  ZIP_NAME: FS25_Ursus_1654_1954_Pack.zip
  WORKFLOW_FILE: .github/workflows/release-1.0.2.2.yml

jobs:
  validate-build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact main release commit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git diff --name-only "$BASE_SHA"..HEAD)" = "$WORKFLOW_FILE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(cat VERSION)" = "1.0.2.2"
          grep -Fq '<author>M8E, StrielokPL</author>' modDesc.xml
          grep -Fq '<version>1.0.2.2</version>' modDesc.xml
          python3 - <<'PY'
          from pathlib import Path
          xml = Path("Ursus1934.xml").read_text(encoding="utf-8")
          if xml.count('jointType="trailer"') != 1:
              raise SystemExit("Zmieniono liczbę górnych zaczepów trailer")
          if xml.count('jointType="trailerLow"') != 1:
              raise SystemExit("Zmieniono liczbę dolnych zaczepów trailerLow")
          if xml.count('<transNode node="0&gt;5|1|0" minY="0.760" maxY="1.04" />') != 1:
              raise SystemExit("Brak zatwierdzonego zakresu Y 0.760–1.040")
          if '<output attacherJointIndices="1 2 3" outputNode="0&gt;5|2|0" />' not in xml:
              raise SystemExit("Zmieniono indeksy tylnego WOM")
          if '<output attacherJointIndices="4" outputNode="0&gt;5|2|1" />' not in xml:
              raise SystemExit("Zmieniono indeks przedniego WOM")
          PY

      - name: Validate and build 67-file package
        run: |
          set -euo pipefail
          python3 tools/validate_current.py
          ./build.sh

      - name: Verify stable ZIP
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          import zipfile
          from pathlib import Path
          path = Path("dist/FS25_Ursus_1654_1954_Pack.zip")
          with zipfile.ZipFile(path) as zf:
              names = zf.namelist()
              if len(names) != 67 or len(names) != len(set(names)):
                  raise SystemExit(f"Nieprawidłowa zawartość ZIP: {len(names)}")
              mod = ET.fromstring(zf.read("modDesc.xml"))
              if mod.findtext("version") != "1.0.2.2":
                  raise SystemExit("Nieprawidłowa wersja w ZIP")
              vehicle = zf.read("Ursus1934.xml").decode("utf-8")
              expected = '<transNode node="0&gt;5|1|0" minY="0.760" maxY="1.04" />'
              if vehicle.count(expected) != 1:
                  raise SystemExit("ZIP nie zawiera zatwierdzonego zakresu zaczepu")
          PY
          (cd dist && sha256sum "$ZIP_NAME" > "$ZIP_NAME.sha256")

      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Tag lub release $TAG już istnieje"
            exit 1
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          ## Regulacja tylnego zaczepu

          - górny, regulowany zaczep na pin ma zakres wysokości Y 0.760–1.040,
          - dolny, nieruchomy zaczep kulowy pozostał bez zmian,
          - zachowano indeksy tylnego WOM-u 1 2 3 i przedniego WOM-u 4,
          - kolizje, przednie obciążniki, TUZ, tankowanie i tożsamość paczki pozostały bez zmian,
          - walidator i dokumentacja obsługują format wersji A.B.C.D[K][N].

          Paczka zachowuje stałą nazwę FS25_Ursus_1654_1954_Pack.zip.
          EOF
          gh release create "$TAG" "dist/$ZIP_NAME" "dist/$ZIP_NAME.sha256" --target "$BASE_SHA" --title "1.0.2.2 — Regulacja tylnego zaczepu" --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Remove one-time release workflow
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm "$WORKFLOW_FILE"
          git commit -m "Usuń jednorazowy workflow wydania 1.0.2.2"
          git push origin "HEAD:release-1.0.2.2"
