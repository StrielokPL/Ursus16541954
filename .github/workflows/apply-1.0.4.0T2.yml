name: Apply and publish 1.0.4.0T2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-1.0.4.0T2.yml

permissions:
  contents: write

jobs:
  apply-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply ADS load-aware transmission guard
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lua_path = Path('UrsusTransmissionFix.lua')
          lua = lua_path.read_text(encoding='utf-8')

          lua = lua.replace('1.0.4.0T1', '1.0.4.0T2')
          lua = lua.replace(
              '    local originalGetUseAutomaticGroupShifting = VehicleMotor.getUseAutomaticGroupShifting\n',
              '''    local originalGetUseAutomaticGroupShifting = VehicleMotor.getUseAutomaticGroupShifting\n\n    -- ADS uses these thresholds internally to classify engine lugging.\n    -- Keep the transmission guard aligned with ADS instead of inventing\n    -- a second, unrelated load model.\n    local ADS_LUGGING_LOAD_THRESHOLD = 0.80\n    local ADS_LUGGING_RPM_THRESHOLD = 0.60\n    local ADS_UPSHIFT_RPM_GUARD = 0.75\n    local ADS_LOAD_DOWNSHIFT_COOLDOWN = 700\n    local ADS_LOAD_UPSHIFT_HOLD = 1800\n    local ADS_LOAD_LOG_COOLDOWN = 1200\n'''
          )

          anchor = '''    local function getAdsData(motor)\n        local vehicle = motor ~= nil and motor.vehicle or nil\n        local spec = vehicle ~= nil and vehicle.spec_AdvancedDamageSystem or nil\n        if spec == nil or spec.activeEffects == nil then\n            return nil, nil, nil\n        end\n\n        return vehicle, spec, spec.activeEffects\n    end\n'''
          insert = anchor + '''\n    local function getAdsLoadState(motor)\n        local vehicle = motor ~= nil and motor.vehicle or nil\n        local spec = vehicle ~= nil and vehicle.spec_AdvancedDamageSystem or nil\n        if spec == nil or spec.dynamicMotorLoad == nil then\n            return nil, nil, nil, nil, nil\n        end\n\n        local load = tonumber(spec.dynamicMotorLoad)\n        local maxRpm = tonumber(motor.maxRpm)\n        local rpm = nil\n\n        if motor.getLastModulatedMotorRpm ~= nil then\n            rpm = tonumber(motor:getLastModulatedMotorRpm())\n        end\n        rpm = rpm or tonumber(motor.lastMotorRpm)\n\n        if load == nil or rpm == nil or maxRpm == nil or maxRpm <= 0 then\n            return nil, nil, nil, nil, nil\n        end\n\n        local speed = 0\n        if vehicle.getLastSpeed ~= nil then\n            speed = tonumber(vehicle:getLastSpeed()) or 0\n        end\n\n        return spec, math.max(load, 0), rpm, rpm / maxRpm, speed\n    end\n\n    local function splitterGroupLabel(group)\n        if group == 1 then\n            return "L"\n        elseif group == 2 then\n            return "H"\n        end\n        return tostring(group or "?")\n    end\n\n    local function logAdsLoadGuard(motor, action, fromGear, fromGroup, toGear, toGroup, load, rpm)\n        if motor.ursusAdsLoadLogUntil ~= nil and g_time < motor.ursusAdsLoadLogUntil then\n            return\n        end\n\n        motor.ursusAdsLoadLogUntil = g_time + ADS_LOAD_LOG_COOLDOWN\n        Logging.info(string.format(\n            "[UrsusTransmissionFix] ADS load guard: %s %d%s -> %d%s | load=%d%% rpm=%d",\n            action,\n            fromGear or 0,\n            splitterGroupLabel(fromGroup),\n            toGear or 0,\n            splitterGroupLabel(toGroup),\n            math.floor((load or 0) * 100 + 0.5),\n            math.floor((rpm or 0) + 0.5)\n        ))\n    end\n'''
          if anchor not in lua:
              raise SystemExit('ADS data anchor not found')
          lua = lua.replace(anchor, insert, 1)

          hook_anchor = '''        -- Small local cooldown after a splitter change. Powershift groups apply\n        -- instantly in GIANTS, so without this the prediction can be run again\n        -- in the same decision window.\n'''
          hook_insert = '''        local adsSpec, adsLoad, adsRpm, adsRpmRatio, adsSpeed = getAdsLoadState(self)\n        local adsIsLugging = adsLoad ~= nil\n            and adsLoad > ADS_LUGGING_LOAD_THRESHOLD\n            and adsRpmRatio < ADS_LUGGING_RPM_THRESHOLD\n            and adsSpeed > 0.5\n\n        -- ADS itself treats >80% dynamic load below 60% max RPM as lugging.\n        -- If that state occurs, force exactly one step down in the virtual\n        -- 1L -> 1H -> 2L -> 2H sequence, then give the engine time to recover.\n        if adsIsLugging\n            and (self.ursusAdsLoadDownshiftCooldownUntil == nil\n                or g_time >= self.ursusAdsLoadDownshiftCooldownUntil) then\n            local loadGroup = self.activeGearGroupIndex or 1\n            local loadTargetGroup = loadGroup\n            local loadTargetGear = curGear\n\n            if loadGroup == 2 then\n                -- e.g. 4H -> 4L\n                loadTargetGroup = 1\n            elseif curGear > 1 then\n                -- e.g. 4L -> 3H\n                loadTargetGroup = 2\n                loadTargetGear = curGear - 1\n            end\n\n            if loadTargetGroup ~= loadGroup or loadTargetGear ~= curGear then\n                if not trySetAutomaticSplitterGroup(self, loadTargetGroup) then\n                    self.ursusHighLowCooldownUntil = g_time + 100\n                    self.ursusAdsLoadDownshiftCooldownUntil = g_time + 100\n                    self.autoGearChangeTimer = math.max(self.autoGearChangeTime or 0, 100)\n                    return curGear\n                end\n\n                self.ursusHighLowCooldownUntil = g_time + ADS_LOAD_DOWNSHIFT_COOLDOWN\n                self.ursusAdsLoadDownshiftCooldownUntil = g_time + ADS_LOAD_DOWNSHIFT_COOLDOWN\n                self.ursusAdsLoadUpshiftHoldUntil = g_time + ADS_LOAD_UPSHIFT_HOLD\n                self.autoGearChangeTimer = math.max(self.autoGearChangeTime or 0, ADS_LOAD_DOWNSHIFT_COOLDOWN)\n                logAdsLoadGuard(\n                    self, "DOWNSHIFT", curGear, loadGroup,\n                    loadTargetGear, loadTargetGroup, adsLoad, adsRpm\n                )\n                return loadTargetGear\n            end\n        end\n\n''' + hook_anchor
          if hook_anchor not in lua:
              raise SystemExit('prediction cooldown anchor not found')
          lua = lua.replace(hook_anchor, hook_insert, 1)

          upshift_anchor = '''        local group = self.activeGearGroupIndex or 1\n        local nextGear = curGear\n\n        if targetGear > curGear then\n'''
          upshift_insert = '''        local group = self.activeGearGroupIndex or 1\n        local nextGear = curGear\n\n        -- After a load-protection downshift, briefly keep the lower virtual\n        -- ratio so vanilla cannot immediately undo it.\n        if targetGear > curGear\n            and self.ursusAdsLoadUpshiftHoldUntil ~= nil\n            and g_time < self.ursusAdsLoadUpshiftHoldUntil then\n            self.autoGearChangeTimer = math.max(self.autoGearChangeTime or 0, 250)\n            return curGear\n        end\n\n        -- At high ADS dynamic load, do not allow an upshift while the engine\n        -- is already below 75% max RPM. With the 1.25 -> 1.00 L/H splitter\n        -- this prevents a 20% RPM drop from pushing the engine straight into\n        -- ADS's <60% RPM lugging zone.\n        if targetGear > curGear\n            and adsLoad ~= nil\n            and adsLoad > ADS_LUGGING_LOAD_THRESHOLD\n            and adsRpmRatio < ADS_UPSHIFT_RPM_GUARD then\n            local guardTargetGear = curGear\n            local guardTargetGroup = group\n            if group == 1 then\n                guardTargetGroup = 2\n            else\n                guardTargetGroup = 1\n                guardTargetGear = math.min(curGear + 1, targetGear)\n            end\n\n            logAdsLoadGuard(\n                self, "BLOCK UPSHIFT", curGear, group,\n                guardTargetGear, guardTargetGroup, adsLoad, adsRpm\n            )\n            self.autoGearChangeTimer = math.max(self.autoGearChangeTime or 0, 250)\n            return curGear\n        end\n\n        if targetGear > curGear then\n'''
          if upshift_anchor not in lua:
              raise SystemExit('upshift anchor not found')
          lua = lua.replace(upshift_anchor, upshift_insert, 1)

          lua_path.write_text(lua, encoding='utf-8')

          moddesc = Path('modDesc.xml').read_text(encoding='utf-8')
          if '<version>1.0.4.0T1</version>' not in moddesc:
              raise SystemExit('modDesc version anchor not found')
          Path('modDesc.xml').write_text(
              moddesc.replace('<version>1.0.4.0T1</version>', '<version>1.0.4.0T2</version>', 1),
              encoding='utf-8'
          )
          Path('VERSION').write_text('1.0.4.0T2\n', encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          marker = '## Dalszy rozwój\n'
          if marker not in changelog:
              raise SystemExit('changelog marker not found')
          if '## 1.0.4.0T1' not in changelog:
              history = '''## 1.0.4.0T1\nTestowa iteracja kompatybilności z modami realizmu.\n\nZmiany względem 1.0.3.0:\n- dodano rok produkcji `2009` do danych sklepowych pojazdu dla zgodności z Vehicle Years i systemami korzystającymi z `storeData.year`,\n- pojemność zbiornika oleju napędowego zwiększono z `300 l` do historycznie właściwych `355 l`,\n- `UrsusTransmissionFix.lua` otrzymał opcjonalny bridge do Advanced Damage System: automatyczny splitter L/H respektuje `GEAR_SHIFT_FAILURE_CHANCE` oraz opóźnienie uszkodzonego powershiftu; bez ADS zachowanie pozostaje bez zmian.\n\n## 1.0.4.0T2\nTest doboru przełożeń automatu zależnego od obciążenia silnika z ADS.\n\nZmiany względem 1.0.4.0T1:\n- automat przy aktywnym ADS odczytuje ten sam `spec.dynamicMotorLoad`, którego ADS używa do telemetrii i zużycia silnika,\n- przy stanie lugging zgodnym z ADS (`dynamicMotorLoad > 80%`, obroty `< 60% max RPM`, pojazd w ruchu) wymuszany jest jeden krok w dół w sekwencji L/H,\n- przy obciążeniu >80% blokowany jest upshift, jeśli silnik pracuje poniżej 75% maksymalnych obrotów; chroni to przed spadkiem obrotów po zmianie L→H do strefy lugging,\n- po ochronnym downshifcie działa krótka histereza 1,8 s, aby automat nie cofał natychmiast decyzji,\n- log zapisuje tylko faktyczne ingerencje load guarda (`DOWNSHIFT` / `BLOCK UPSHIFT`) wraz z biegiem, obciążeniem i RPM,\n- bez ADS oraz w trybie manualnym zachowanie pozostaje takie jak w T1.\n\n'''
              changelog = changelog.replace(marker, history + marker, 1)
          elif '## 1.0.4.0T2' not in changelog:
              history = '''## 1.0.4.0T2\nTest doboru przełożeń automatu zależnego od obciążenia silnika z ADS.\n\nZmiany względem 1.0.4.0T1:\n- automat przy aktywnym ADS odczytuje ten sam `spec.dynamicMotorLoad`, którego ADS używa do telemetrii i zużycia silnika,\n- przy stanie lugging zgodnym z ADS (`dynamicMotorLoad > 80%`, obroty `< 60% max RPM`, pojazd w ruchu) wymuszany jest jeden krok w dół w sekwencji L/H,\n- przy obciążeniu >80% blokowany jest upshift, jeśli silnik pracuje poniżej 75% maksymalnych obrotów; chroni to przed spadkiem obrotów po zmianie L→H do strefy lugging,\n- po ochronnym downshifcie działa krótka histereza 1,8 s, aby automat nie cofał natychmiast decyzji,\n- log zapisuje tylko faktyczne ingerencje load guarda (`DOWNSHIFT` / `BLOCK UPSHIFT`) wraz z biegiem, obciążeniem i RPM,\n- bez ADS oraz w trybie manualnym zachowanie pozostaje takie jak w T1.\n\n'''
              changelog = changelog.replace(marker, history + marker, 1)
          changelog_path.write_text(changelog, encoding='utf-8')
          PY

      - name: Validate source tree
        run: python3 tools/validate_current.py

      - name: Build test ZIP
        run: ./build.sh

      - name: Commit 1.0.4.0T2
        id: version_commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add UrsusTransmissionFix.lua modDesc.xml VERSION CHANGELOG.md
          git commit -m "Add 1.0.4.0T2 ADS load-aware shifting"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.version_commit.outputs.sha }}
        run: |
          gh release create v1.0.4.0T2 \
            dist/FS25_Ursus_1654_1954_Pack.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "1.0.4.0T2 — ADS load-aware shifting test" \
            --prerelease \
            --notes $'Test build based on 1.0.4.0T1.\n\nChanges:\n- automatic transmission now reads ADS dynamicMotorLoad,\n- one-step protective downshift when ADS lugging criteria are met (>80% load and <60% max RPM while moving),\n- blocks high-load upshifts below 75% max RPM,\n- 1.8 s anti-hunting hold after a protective downshift,\n- concise log diagnostics for actual load-guard interventions.\n\nWithout ADS and in manual shift modes, transmission behavior remains unchanged.'

      - name: Remove one-shot workflow
        run: |
          rm .github/workflows/apply-1.0.4.0T2.yml
          git add .github/workflows/apply-1.0.4.0T2.yml
          git commit -m "Remove 1.0.4.0T2 migration workflow"
          git push origin HEAD:main
