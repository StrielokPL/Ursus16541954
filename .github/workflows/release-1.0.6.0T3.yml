name: Publish 1.0.6.0T3

on:
  push:
    paths:
      - '.github/workflows/release-1.0.6.0T3.yml'

permissions:
  contents: write

jobs:
  prerelease:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Widmo RWD test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          OLD = '1.0.6.0T2'
          VERSION = '1.0.6.0T3'

          current = Path('VERSION').read_text(encoding='utf-8').strip()
          if current != OLD:
              raise SystemExit(f'Expected {OLD}, got {current}')
          Path('VERSION').write_text(VERSION + '\n', encoding='utf-8')

          p = Path('modDesc.xml')
          s = p.read_text(encoding='utf-8')
          old = f'<version>{OLD}</version>'
          new = f'<version>{VERSION}</version>'
          if old not in s:
              raise SystemExit('modDesc version anchor not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('UrsusColorFix.lua')
          s = p.read_text(encoding='utf-8')
          if OLD not in s:
              raise SystemExit('UrsusColorFix old version marker not found')
          p.write_text(s.replace(OLD, VERSION), encoding='utf-8')

          p = Path('UrsusTransmissionFix.lua')
          s = p.read_text(encoding='utf-8')
          if OLD not in s:
              raise SystemExit('UrsusTransmissionFix old version marker not found')
          s = s.replace(OLD, VERSION)

          capture_anchor = '    local originalGetUseAutomaticGroupShifting = VehicleMotor.getUseAutomaticGroupShifting\n'
          if 'local originalLoadDifferentials = Motorized.loadDifferentials' not in s:
              if capture_anchor not in s:
                  raise SystemExit('Transmission capture anchor not found')
              s = s.replace(
                  capture_anchor,
                  capture_anchor + '    local originalLoadDifferentials = Motorized.loadDifferentials\n',
                  1
              )

          helper_anchor = '    local function isUrsusMotor(motor)\n'
          helper = '''    local function isUrsusVehicle(vehicle)\n        if vehicle == nil or vehicle.configFileName == nil then\n            return false\n        end\n\n        local configFileName = vehicle.configFileName\n        if modDirectory ~= nil and string.sub(configFileName, 1, string.len(modDirectory)) ~= modDirectory then\n            return false\n        end\n\n        return string.sub(configFileName, -13) == "Ursus1934.xml"\n    end\n\n    local function getSelectedMotorConfigurationName(vehicle, xmlFile)\n        if vehicle == nil or vehicle.configurations == nil or vehicle.configurations.motor == nil then\n            return nil\n        end\n\n        xmlFile = xmlFile or vehicle.xmlFile\n        if xmlFile == nil then\n            return nil\n        end\n\n        local key = ConfigurationUtil.getXMLConfigurationKey(\n            xmlFile,\n            vehicle.configurations.motor,\n            "vehicle.motorized.motorConfigurations.motorConfiguration",\n            "vehicle.motorized",\n            "motor"\n        )\n        if key == nil then\n            return nil\n        end\n\n        return xmlFile:getValue(key .. "#name")\n    end\n\n'''
          if 'local function isUrsusVehicle(vehicle)' not in s:
              if helper_anchor not in s:
                  raise SystemExit('Transmission helper anchor not found')
              s = s.replace(helper_anchor, helper + helper_anchor, 1)

          override_anchor = '    -- In AUTOMATIC mode only, stop the base game from optimizing the two\n'
          override = '''    -- T3 diagnostic drivetrain experiment: only the Widmo motor configuration\n    -- is converted to rear-wheel drive. loadDifferentials() populates the Lua\n    -- differential table before Motorized:addToPhysics() creates the physical\n    -- drivetrain, so keeping only differential #2 leaves the rear axle driven\n    -- while the front axle remains free-rolling. Other motor variants are unchanged.\n    function Motorized:loadDifferentials(xmlFile, configDifferentialIndex)\n        originalLoadDifferentials(self, xmlFile, configDifferentialIndex)\n\n        if not isUrsusVehicle(self) then\n            return\n        end\n        if getSelectedMotorConfigurationName(self, xmlFile) ~= "1934 Widmo" then\n            return\n        end\n\n        local spec = self.spec_motorized\n        local differentials = spec ~= nil and spec.differentials or nil\n        if differentials == nil or #differentials < 2 then\n            Logging.warning("[UrsusTransmissionFix] Widmo RWD test: expected front/rear/center differential set")\n            return\n        end\n\n        local rearDifferential = differentials[2]\n        spec.differentials = {rearDifferential}\n        Logging.info("[UrsusTransmissionFix] 1.0.6.0T3 Widmo drivetrain: rear differential only (RWD test)")\n    end\n\n'''
          if 'Widmo drivetrain: rear differential only (RWD test)' not in s:
              if override_anchor not in s:
                  raise SystemExit('Transmission override anchor not found')
              s = s.replace(override_anchor, override + override_anchor, 1)

          p.write_text(s, encoding='utf-8')

          p = Path('CHANGELOG.md')
          s = p.read_text(encoding='utf-8')
          addition = '''\n## 1.0.6.0T3\nTest napędu RWD dla konfiguracji `1934 Widmo`.\n\nZmiany względem 1.0.6.0T2:\n- Widmo zachowuje silnik 1934 Chip 225 KM i środek masy `0 1.05 -1.65`,\n- tylko dla `1934 Widmo` skrypt przechwytuje `Motorized.loadDifferentials()` i przed `addToPhysics()` pozostawia wyłącznie tylny dyferencjał,\n- przednia oś Widma jest w T3 swobodnie tocząca, bez doprowadzanego momentu; pozostałe warianty silnika nadal korzystają z seryjnego 4x4,\n- celem T3 jest sprawdzenie, czy centralny rozdział 50/50 ogranicza moment dostępny na tylnej osi po odciążeniu lub uślizgu przodu,\n- nadal brak sztucznego `addTorque`/`addForce`; test pozostaje oparty na fizyce GIANTS.\n\n'''
          marker = '## 1.0.6.0T2'
          if '## 1.0.6.0T3' not in s:
              if marker not in s:
                  raise SystemExit('CHANGELOG T2 marker not found')
              s = s.replace(marker, addition + marker, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('PROJECT_STATE.md')
          s = p.read_text(encoding='utf-8')
          note = '''\n\n### Widmo drivetrain test — 1.0.6.0T3\n- Widmo nadal: 225 KM z dokładnym blokiem silnika 1934 Chip i `centerOfMassActive="0 1.05 -1.65"`.\n- T3 przełącza wyłącznie Widmo na RWD przed zbudowaniem fizycznych dyferencjałów; pozostaje tylko tylny dyferencjał.\n- Pozostałe silniki zachowują 4x4.\n- Cel: odizolować wpływ centralnego dyferencjału 50/50 na możliwość odciążenia/podniesienia przedniej osi.\n'''
          if '### Widmo drivetrain test — 1.0.6.0T3' not in s:
              s += note
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate source tree
        run: python3 tools/validate_current.py

      - name: Build test ZIP
        run: ./build.sh

      - name: Verify Widmo T3 changes in ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile
          z = zipfile.ZipFile('dist/FS25_Ursus_1654_1954_Pack.zip')
          moddesc = z.read('modDesc.xml').decode('utf-8')
          xml = z.read('Ursus1934.xml').decode('utf-8')
          lua = z.read('UrsusTransmissionFix.lua').decode('utf-8')
          assert '<version>1.0.6.0T3</version>' in moddesc
          start = xml.index('<motorConfiguration name="1934 Widmo"')
          end = xml.index('</motorConfiguration>', start)
          seg = xml[start:end]
          assert 'hp="225"' in seg
          assert 'torqueScale="0.850"' in seg
          assert 'centerOfMassActive="0 1.05 -1.65"' in seg
          assert 'function Motorized:loadDifferentials' in lua
          assert 'getSelectedMotorConfigurationName(self, xmlFile) ~= "1934 Widmo"' in lua
          assert 'local rearDifferential = differentials[2]' in lua
          assert 'spec.differentials = {rearDifferential}' in lua
          assert '1.0.6.0T3 Widmo drivetrain: rear differential only (RWD test)' in lua
          print('ZIP Widmo T3 RWD check: OK')
          PY

      - name: Commit 1.0.6.0T3
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION modDesc.xml UrsusTransmissionFix.lua UrsusColorFix.lua CHANGELOG.md PROJECT_STATE.md
          git commit -m 'Release 1.0.6.0T3 Widmo RWD drivetrain test'
          git push origin HEAD:main

      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET_SHA=$(git rev-parse HEAD)
          cat > /tmp/release-notes.md <<'EOF'
          Third Widmo wheelie-physics experiment.

          Changes:
          - Widmo keeps the exact 1934 Chip 225 hp engine block,
          - Widmo keeps center of mass 0 1.05 -1.65,
          - only Widmo is converted to rear-wheel drive before the physical drivetrain is created,
          - the front and center differentials are omitted for Widmo; the rear axle differential remains,
          - all other engine variants remain 4x4,
          - no scripted addTorque/addForce assist.

          Test goal: determine whether the original 50/50 center differential was bleeding usable rear-axle torque as the front axle unloaded or slipped.
          EOF
          gh release create v1.0.6.0T3 dist/FS25_Ursus_1654_1954_Pack.zip \
            --target "$TARGET_SHA" \
            --title '1.0.6.0T3 — Widmo RWD drivetrain test' \
            --prerelease \
            --notes-file /tmp/release-notes.md

      - name: Remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          git rm .github/workflows/release-1.0.6.0T3.yml
          git commit -m 'Remove one-shot 1.0.6.0T3 release workflow'
          git push origin HEAD:main
