name: Publish 1.0.5.0T4

on:
  push:
    paths:
      - '.github/workflows/release-1.0.5.0T4.yml'

permissions:
  contents: write

jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and build
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_current.py
          ./build.sh

      - name: Verify color bridge is in ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('dist/FS25_Ursus_1654_1954_Pack.zip') as z:
              names = set(z.namelist())
          assert 'UrsusColorFix.lua' in names
          assert 'UrsusTransmissionFix.lua' in names
          print('ZIP extraSourceFiles check: OK')
          PY

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SHA=$(git rev-parse HEAD)
          cat > /tmp/release-notes.txt <<'EOF'
          Fixes the T3 regression where UrsusColorFix.lua existed in source but was omitted from the built mod ZIP, causing GIANTS to report that the resource could not be loaded and leaving body/rim selections with no runtime color application.

          T4 keeps the T3 full GIANTS palette and custom RGB mechanism unchanged, explicitly packages UrsusColorFix.lua, and strengthens validation so every extraSourceFile must be present in the ZIP allowlist. Transmission, ADS behavior, physics and visual target whitelists are unchanged.
          EOF
          gh release create v1.0.5.0T4 dist/FS25_Ursus_1654_1954_Pack.zip \
            --target "$TARGET_SHA" \
            --title '1.0.5.0T4 — color bridge packaging hotfix' \
            --prerelease \
            --notes-file /tmp/release-notes.txt

      - name: Remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin main
          git rm .github/workflows/release-1.0.5.0T4.yml
          git commit -m 'Remove one-shot 1.0.5.0T4 release workflow'
          git push origin HEAD:main
