name: Publish 1.0.6.0T4

on:
  push:
    paths:
      - '.github/workflows/release-1.0.6.0T4.yml'

permissions:
  contents: write

jobs:
  prerelease:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Widmo T4 physics tuning
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          OLD = '1.0.6.0T3'
          VERSION = '1.0.6.0T4'

          current = Path('VERSION').read_text(encoding='utf-8').strip()
          if current != OLD:
              raise SystemExit(f'Expected {OLD}, got {current}')
          Path('VERSION').write_text(VERSION + '\n', encoding='utf-8')

          p = Path('modDesc.xml')
          s = p.read_text(encoding='utf-8')
          if f'<version>{OLD}</version>' not in s:
              raise SystemExit('modDesc version anchor not found')
          p.write_text(s.replace(f'<version>{OLD}</version>', f'<version>{VERSION}</version>', 1), encoding='utf-8')

          p = Path('UrsusColorFix.lua')
          s = p.read_text(encoding='utf-8')
          if OLD not in s:
              raise SystemExit('UrsusColorFix old version marker not found')
          p.write_text(s.replace(OLD, VERSION), encoding='utf-8')

          p = Path('Ursus1934.xml')
          s = p.read_text(encoding='utf-8')
          start = s.index('<motorConfiguration name="1934 Widmo"')
          end = s.index('</motorConfiguration>', start)
          segment = s[start:end]
          old_com = 'centerOfMassActive="0 1.05 -1.65"'
          new_com = 'centerOfMassActive="0 1.40 -1.65"'
          if old_com not in segment:
              raise SystemExit('Widmo T3 center of mass not found')
          segment = segment.replace(old_com, new_com, 1)
          s = s[:start] + segment + s[end:]
          p.write_text(s, encoding='utf-8')

          p = Path('UrsusTransmissionFix.lua')
          s = p.read_text(encoding='utf-8')
          if OLD not in s:
              raise SystemExit('Transmission old version marker not found')
          s = s.replace(OLD, VERSION)

          anchor = '    local originalLoadDifferentials = Motorized.loadDifferentials\n'
          addition = anchor + '    local originalWheelPhysicsLoadFromXML = WheelPhysics.loadFromXML\n'
          if 'local originalWheelPhysicsLoadFromXML = WheelPhysics.loadFromXML' not in s:
              if anchor not in s:
                  raise SystemExit('loadDifferentials hook anchor not found')
              s = s.replace(anchor, addition, 1)

          marker = '    -- In AUTOMATIC mode only, stop the base game from optimizing the two\n'
          block = '''    -- T4 final pure-physics experiment: raise the Widmo centre of mass and\n    -- lower the rear tire force application point. WheelPhysics stores the XML\n    -- forcePointRatio before the wheel shape is finalized, so changing it here\n    -- affects only the physical rear wheels of the selected Widmo variant.\n    function WheelPhysics:loadFromXML(xmlObject)\n        local result = originalWheelPhysicsLoadFromXML(self, xmlObject)\n        if not result then\n            return result\n        end\n\n        local wheel = self.wheel\n        local vehicle = wheel ~= nil and wheel.vehicle or nil\n        if not isUrsusVehicle(vehicle) then\n            return result\n        end\n        if getSelectedMotorConfigurationName(vehicle, vehicle.xmlFile) ~= "1934 Widmo" then\n            return result\n        end\n\n        local wheelIndex = wheel.wheelIndex or 0\n        if wheelIndex >= 3 then\n            self.forcePointRatio = 0.80\n            if not vehicle.ursusWidmoRearForcePointLogged then\n                vehicle.ursusWidmoRearForcePointLogged = true\n                Logging.info("[UrsusTransmissionFix] 1.0.6.0T4 Widmo rear forcePointRatio=0.80")\n            end\n        end\n\n        return result\n    end\n\n'''
          if 'function WheelPhysics:loadFromXML(xmlObject)' not in s:
              if marker not in s:
                  raise SystemExit('automatic shifting marker not found')
              s = s.replace(marker, block + marker, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('CHANGELOG.md')
          s = p.read_text(encoding='utf-8')
          addition = '''\n## 1.0.6.0T4\nOstatni test podnoszenia przodu oparty wyłącznie na fizyce kół i rozkładzie masy.\n\nZmiany względem 1.0.6.0T3:\n- Widmo pozostaje RWD i zachowuje silnik 1934 Chip 225 KM,\n- środek masy Widma podniesiono z `0 1.05 -1.65` do `0 1.40 -1.65`, bez dalszego cofania,\n- tylko tylne koła Widma otrzymują `forcePointRatio=0.80` zamiast 0.50,\n- przednie koła i wszystkie inne konfiguracje ciągnika zachowują bazowe parametry,\n- nadal brak `addTorque`, `addForce` i sztucznego impulsu; wynik ma pochodzić z fizyki silnika gry.\n\n'''
          marker = '## 1.0.6.0T3'
          if '## 1.0.6.0T4' not in s:
              if marker not in s:
                  raise SystemExit('CHANGELOG T3 marker not found')
              s = s.replace(marker, addition + marker, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('PROJECT_STATE.md')
          s = p.read_text(encoding='utf-8')
          note = '''\n\n### Widmo wheelie physics test — 1.0.6.0T4\n- T3 RWD był bardzo blisko uniesienia przodu, ale ciągnik tylko wolniej ruszał.\n- Widmo nadal RWD, 225 KM z 1934 Chip, COM Z pozostaje -1.65.\n- COM Y podniesiono do 1.40.\n- Tylne koła Widma: forcePointRatio 0.80; pozostałe koła/wersje bez zmian.\n- T4 jest ostatnim testem czystej fizyki przed ewentualnym lekkim warunkowym addTorque.\n'''
          if '### Widmo wheelie physics test — 1.0.6.0T4' not in s:
              s += note
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate source tree
        run: python3 tools/validate_current.py

      - name: Build test ZIP
        run: ./build.sh

      - name: Verify Widmo T4 changes in ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile
          z = zipfile.ZipFile('dist/FS25_Ursus_1654_1954_Pack.zip')
          xml = z.read('Ursus1934.xml').decode('utf-8')
          lua = z.read('UrsusTransmissionFix.lua').decode('utf-8')
          moddesc = z.read('modDesc.xml').decode('utf-8')
          assert '<version>1.0.6.0T4</version>' in moddesc
          start = xml.index('<motorConfiguration name="1934 Widmo"')
          end = xml.index('</motorConfiguration>', start)
          seg = xml[start:end]
          assert 'hp="225"' in seg
          assert 'centerOfMassActive="0 1.40 -1.65"' in seg
          assert 'centerOfMassActive="0 1.05 -1.65"' not in seg
          assert 'local originalWheelPhysicsLoadFromXML = WheelPhysics.loadFromXML' in lua
          assert 'self.forcePointRatio = 0.80' in lua
          assert 'wheelIndex >= 3' in lua
          assert 'rear differential only (RWD test)' in lua
          print('ZIP Widmo T4 pure-physics check: OK')
          PY

      - name: Commit 1.0.6.0T4
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION modDesc.xml Ursus1934.xml UrsusTransmissionFix.lua UrsusColorFix.lua CHANGELOG.md PROJECT_STATE.md
          git commit -m 'Release 1.0.6.0T4 Widmo force-point physics test'
          git push origin HEAD:main

      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET_SHA=$(git rev-parse HEAD)
          cat > /tmp/release-notes.md <<'EOF'
          Fourth Widmo wheelie-physics experiment and the final pure-physics test.

          Changes:
          - Widmo remains RWD with the exact 1934 Chip 225 hp engine block,
          - center of mass changes from 0 1.05 -1.65 to 0 1.40 -1.65,
          - only Widmo rear wheels use forcePointRatio 0.80 instead of 0.50,
          - front wheels and all other engine variants remain unchanged,
          - still no scripted addTorque/addForce assist.

          Test goal: determine whether a higher center of mass plus a lower rear tire force point is enough to naturally lift the front axle under a heavy rear load.
          EOF
          gh release create v1.0.6.0T4 dist/FS25_Ursus_1654_1954_Pack.zip \
            --target "$TARGET_SHA" \
            --title '1.0.6.0T4 — Widmo force-point physics test' \
            --prerelease \
            --notes-file /tmp/release-notes.md

      - name: Remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          git rm .github/workflows/release-1.0.6.0T4.yml
          git commit -m 'Remove one-shot 1.0.6.0T4 release workflow'
          git push origin HEAD:main
