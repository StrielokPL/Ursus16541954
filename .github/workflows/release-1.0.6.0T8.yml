name: Publish 1.0.6.0T8

on:
  push:
    paths:
      - '.github/workflows/release-1.0.6.0T8.yml'

permissions:
  contents: write

jobs:
  prerelease:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Widmo T8 manual drivetrain toggle
        run: python3 tools/apply_1_0_6_0T8.py

      - name: Validate source tree
        run: python3 tools/validate_current.py

      - name: Build test ZIP
        run: ./build.sh

      - name: Verify Widmo T8 ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile

          with zipfile.ZipFile('dist/FS25_Ursus_1654_1954_Pack.zip') as z:
              moddesc = z.read('modDesc.xml').decode('utf-8')
              xml = z.read('Ursus1934.xml').decode('utf-8')
              lua = z.read('UrsusTransmissionFix.lua').decode('utf-8')

          assert '<version>1.0.6.0T8</version>' in moddesc
          assert '<action name="URSUS_WIDMO_TOGGLE_4WD" category="VEHICLE" axisType="HALF"/>' in moddesc
          assert 'actionBinding action="URSUS_WIDMO_TOGGLE_4WD"' in moddesc
          assert 'KEY_lctrl KEY_4' in moddesc
          assert 'InitEventClass(UrsusWidmoDrivetrainEvent' in lua
          assert 'removeAllDifferentials(spec.motorizedNode)' in lua
          assert 'manual RWD/4x4 toggle enabled' in lua
          assert 'originalMotorizedOnRegisterActionEvents' in lua
          assert 'maxLongStiffness = (self.maxLongStiffness or 30.0) * 1.20' in lua

          start = xml.index('<motorConfiguration name="1934 Widmo"')
          end = xml.index('</motorConfiguration>', start)
          seg = xml[start:end]
          assert 'hp="290"' in seg
          assert 'torqueScale="1.100"' in seg
          assert 'centerOfMassActive="0 1.10 -1.80"' in seg
          assert 'name="8/4"' in seg
          assert '<groups ' not in seg
          print('ZIP Widmo T8 manual RWD/4x4 toggle check: OK')
          PY

      - name: Commit 1.0.6.0T8
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION modDesc.xml Ursus1934.xml UrsusTransmissionFix.lua UrsusColorFix.lua CHANGELOG.md PROJECT_STATE.md
          git commit -m 'Release 1.0.6.0T8 Widmo manual RWD 4x4 toggle test'
          git push origin HEAD:main

      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET_SHA=$(git rev-parse HEAD)
          cat > /tmp/release-notes.md <<'EOF'
          Manual drivetrain selection test for 1934 Widmo.

          Changes:
          - Widmo still starts in RWD,
          - new remappable Toggle RWD / 4x4 action, default Ctrl+4,
          - RWD keeps only the rear differential,
          - 4x4 restores the original front, rear and centre differential graph,
          - drivetrain state uses a network event; the server rebuilds the physical differentials,
          - T7 tuning remains unchanged: 290 hp, torqueScale 1.100, direct 8F/4R, COM 0 1.10 -1.80, rear forcePointRatio 0.80 and rear longitudinal stiffness x1.20,
          - other tractor variants remain unchanged.
          EOF
          gh release create v1.0.6.0T8 dist/FS25_Ursus_1654_1954_Pack.zip \
            --target "$TARGET_SHA" \
            --title '1.0.6.0T8 — Widmo manual RWD / 4x4 toggle test' \
            --prerelease \
            --notes-file /tmp/release-notes.md

      - name: Remove one-shot release helpers
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          git rm .github/workflows/release-1.0.6.0T8.yml tools/apply_1_0_6_0T8.py
          git commit -m 'Remove one-shot 1.0.6.0T8 release helpers'
          git push origin HEAD:main
