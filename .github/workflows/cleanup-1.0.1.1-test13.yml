name: Prepare 1.0.1.1 cleanup test 13

on:
  push:
    branches: [cleanup-1.0.1.1]
    paths: [.github/workflows/cleanup-1.0.1.1-test13.yml]

permissions:
  contents: write

jobs:
  bind-weight-frame-collision:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup-1.0.1.1
          fetch-depth: 0

      - name: Bind legacy WeightFrame collision to front configurations
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          xml_path = Path('Ursus1934.xml')
          text = xml_path.read_text(encoding='utf-8')

          container_pattern = re.compile(
              r'(<attacherJointConfigurations\b[^>]*>)(.*?)(</attacherJointConfigurations>)',
              re.S,
          )
          container_match = container_pattern.search(text)
          if container_match is None:
              raise SystemExit('Front attacherJointConfigurations block not found')

          config_pattern = re.compile(
              r'(<attacherJointConfiguration\b([^>]*)>)(.*?)(</attacherJointConfiguration>)',
              re.S,
          )
          matches = list(config_pattern.finditer(container_match.group(2)))
          expected_names = [
              '$l10n_configuration_valueNo',
              'FrameWeight',
              '1200kg',
              '2000kg',
              'FrameWeight',
              '600kg',
              '1500kg',
              'FrontHydraulic',
          ]
          if len(matches) != len(expected_names):
              raise SystemExit(f'Expected eight front configurations, found {len(matches)}')

          output = []
          cursor = 0
          for index, match in enumerate(matches):
              attrs = match.group(2)
              name_match = re.search(r'\bname="([^"]+)"', attrs)
              name = name_match.group(1) if name_match else None
              if name != expected_names[index]:
                  raise SystemExit(
                      f'Unexpected front configuration {index + 1}: {name!r}; '
                      f'expected {expected_names[index]!r}'
                  )

              body = match.group(3)
              if re.search(
                  r'<objectChange\b[^>]*node="0&gt;11\|1"[^>]*compoundChildActive=',
                  body,
              ):
                  raise SystemExit(f'WeightFrame collision is already switched in {name}')

              tuz_state = 'true' if name == 'FrontHydraulic' else 'false'
              marker = (
                  '<objectChange node="0&gt;10|7|1|16" '
                  f'compoundChildActive="{tuz_state}" />'
              )
              if body.count(marker) != 1:
                  raise SystemExit(f'Expected one TUZ collision marker in {name}')

              weight_state = (
                  'false'
                  if name in ('$l10n_configuration_valueNo', 'FrontHydraulic')
                  else 'true'
              )
              addition = (
                  marker
                  + '\n        <objectChange node="0&gt;11|1" '
                  + f'compoundChildActive="{weight_state}" />'
              )
              new_body = body.replace(marker, addition, 1)

              output.append(container_match.group(2)[cursor:match.start()])
              output.append(match.group(1) + new_body + match.group(4))
              cursor = match.end()

          output.append(container_match.group(2)[cursor:])
          new_inner = ''.join(output)
          new_text = (
              text[:container_match.start()]
              + container_match.group(1)
              + new_inner
              + container_match.group(3)
              + text[container_match.end():]
          )
          xml_path.write_text(new_text, encoding='utf-8')

          vehicle = ET.parse(xml_path).getroot()
          configs = vehicle.findall(
              'attacherJoints/attacherJointConfigurations/attacherJointConfiguration'
          )
          if len(configs) != 8:
              raise SystemExit(f'Expected eight parsed front configurations, found {len(configs)}')

          for index, config in enumerate(configs):
              expected = 'false' if index in (0, 7) else 'true'
              changes = [
                  change
                  for change in config.findall('objectChange')
                  if change.get('node') == '0>11|1'
                  and change.get('compoundChildActive') is not None
              ]
              if len(changes) != 1 or changes[0].get('compoundChildActive') != expected:
                  raise SystemExit(
                      f"Invalid WeightFrame collision state in {config.get('name')}"
                  )

          i3d = ET.parse('Ursus1934.i3d').getroot()
          colli = [
              node
              for node in i3d.iter()
              if node.get('nodeId') == '880' and node.get('name') == 'colli05'
          ]
          if len(colli) != 1 or colli[0].get('compoundChild') != 'true':
              raise SystemExit('Legacy WeightFrame collision colli05 is not a compound child')

          component = next(
              (node for node in i3d.iter() if node.get('nodeId') == '242'),
              None,
          )
          if component is None or component.get('collisionFilterGroup') != '0x40010004':
              raise SystemExit('TEST 8 FILLABLE component state was not preserved')

          print('WeightFrame collision is active only in six frame/weight configurations')
          PY

      - name: Validate and build
        run: |
          python3 tools/validate_current.py
          ./build.sh
          test -f dist/FS25_Ursus_1654_1954_Pack.zip

      - name: Commit cleanup test 13
        run: |
          rm .github/workflows/cleanup-1.0.1.1-test13.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Ursus1934.xml .github/workflows/cleanup-1.0.1.1-test13.yml
          git commit -m 'Bind legacy WeightFrame collision to front configurations test 13'
          git push origin HEAD:cleanup-1.0.1.1

      - name: Publish cleanup pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          sha256sum dist/FS25_Ursus_1654_1954_Pack.zip > dist/FS25_Ursus_1654_1954_Pack.zip.sha256
          cat > /tmp/notes.md <<'EOF'
          ## 1.0.1.1 CLEANUP TEST 13

          Przełączanie istniejącej kolizji ramy WeightFrame zgodnie z wybraną konfiguracją.

          Zmiany:
          - zidentyfikowano legacy bryłę colli05 jako fizyczną ramę WeightFrame używaną także do masy obciążników,
          - colli05 jest wyłączona dla opcji bez wyposażenia przedniego,
          - colli05 jest wyłączona dla FrontHydraulic,
          - colli05 pozostaje aktywna dla obu FrameWeight oraz wariantów 600 kg, 1200 kg, 1500 kg i 2000 kg,
          - nowe kolizje TUZ-a, tankowanie, jointy, WOM i przewody pozostają bez zmian względem TEST 12.

          Do sprawdzenia:
          - brak obrysu WeightFrame przy opcji bez przedniego wyposażenia,
          - brak obrysu WeightFrame z FrontHydraulic,
          - obecność kolizji ramy dla obu FrameWeight i wszystkich ciężarów,
          - obecność właściwej kolizji TUZ-a tylko z FrontHydraulic,
          - tankowanie oraz log.
          EOF
          gh release create v1.0.1.1-test13 --target "$SHA" --title '1.0.1.1 CLEANUP TEST 13' --prerelease --notes-file /tmp/notes.md dist/FS25_Ursus_1654_1954_Pack.zip dist/FS25_Ursus_1654_1954_Pack.zip.sha256
