name: Update 1.1.1.0 changelog

on:
  push:
    paths:
      - '.github/workflows/update-changelog-1.1.1.0.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Complete changelog
        run: python3 tools/update_changelog_1_1_1_0.py

      - name: Verify changelog
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'konfigurację silnika `1934 Robert` przemianowano na `1934 Widmo`' CHANGELOG.md
          grep -Fq 'około `6.183 t`' CHANGELOG.md
          grep -Fq 'około `39.9/60.1`' CHANGELOG.md
          grep -Fq 'około `30.1/69.9`' CHANGELOG.md
          grep -Fq 'spring ×1.15 / damping ×0.60' CHANGELOG.md
          grep -Fq 'spring ×1.10 / damping ×0.75' CHANGELOG.md
          grep -Fq 'Kompatybilność z 1.0.x:' CHANGELOG.md

      - name: Commit changelog
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          git commit -m 'Complete 1.1.1.0 changelog'
          git push origin HEAD:main

      - name: Remove one-shot helpers
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          git rm .github/workflows/update-changelog-1.1.1.0.yml tools/update_changelog_1_1_1_0.py
          git commit -m 'Remove one-shot changelog update helpers'
          git push origin HEAD:main
