name: Prepare 1.0.1.1 cleanup test 14

on:
  push:
    branches: [cleanup-1.0.1.1]
    paths: [.github/workflows/cleanup-1.0.1.1-test14.yml]

permissions:
  contents: write

jobs:
  shorten-main-front-collision:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup-1.0.1.1
          fetch-depth: 0

      - name: Shorten pCube2 along vehicle Z while preserving rear edge
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          i3d_path = Path('Ursus1934.i3d')
          text = i3d_path.read_text(encoding='utf-8')

          matches = list(re.finditer(r'<Shape\b[^>]*nodeId="879"[^>]*/>', text))
          if len(matches) != 1:
              raise SystemExit(f'Expected one pCube2 node 879, found {len(matches)}')

          old = matches[0].group(0)
          if 'name="pCube2"' not in old:
              raise SystemExit('Node 879 is not pCube2')
          if 'translation="0 1.13534 0.822"' not in old:
              raise SystemExit('Unexpected pre-TEST 14 pCube2 translation')
          if re.search(r'\bscale="', old):
              raise SystemExit('pCube2 already has a scale attribute')

          new = old.replace(
              'translation="0 1.13534 0.822"',
              'translation="0 1.13534 0.5" scale="1 1 0.86"',
              1,
          )
          text = text[:matches[0].start()] + new + text[matches[0].end():]
          i3d_path.write_text(text, encoding='utf-8')

          root = ET.parse(i3d_path).getroot()
          p_cube = [
              node
              for node in root.iter()
              if node.get('nodeId') == '879' and node.get('name') == 'pCube2'
          ]
          if len(p_cube) != 1:
              raise SystemExit('Unable to resolve modified pCube2')
          p_cube = p_cube[0]
          if p_cube.get('translation') != '0 1.13534 0.5':
              raise SystemExit('Incorrect TEST 14 pCube2 translation')
          if p_cube.get('scale') != '1 1 0.86':
              raise SystemExit('Incorrect TEST 14 pCube2 scale')
          if p_cube.get('compoundChild') != 'true':
              raise SystemExit('pCube2 compound state changed unexpectedly')
          if p_cube.get('collisionFilterGroup') != '0x10004':
              raise SystemExit('pCube2 collision group changed unexpectedly')
          if p_cube.get('collisionFilterMask') != '0xfe3ffb83':
              raise SystemExit('pCube2 collision mask changed unexpectedly')

          component = next(
              (node for node in root.iter() if node.get('nodeId') == '242'),
              None,
          )
          if component is None or component.get('collisionFilterGroup') != '0x40010004':
              raise SystemExit('TEST 8 FILLABLE component state was not preserved')

          vehicle = ET.parse('Ursus1934.xml').getroot()
          configs = vehicle.findall(
              'attacherJoints/attacherJointConfigurations/attacherJointConfiguration'
          )
          if len(configs) != 8:
              raise SystemExit(f'Expected eight front configurations, found {len(configs)}')
          for index, config in enumerate(configs):
              expected = 'false' if index in (0, 7) else 'true'
              changes = [
                  change
                  for change in config.findall('objectChange')
                  if change.get('node') == '0>11|1'
                  and change.get('compoundChildActive') is not None
              ]
              if len(changes) != 1 or changes[0].get('compoundChildActive') != expected:
                  raise SystemExit(
                      f"TEST 13 WeightFrame switching changed in {config.get('name')}"
                  )

          tuz_collisions = {
              node.get('name'): node
              for node in root.iter()
              if node.get('name') in {
                  'frontHydraulicCollision1',
                  'frontHydraulicCollision2',
              }
          }
          if set(tuz_collisions) != {
              'frontHydraulicCollision1',
              'frontHydraulicCollision2',
          }:
              raise SystemExit('TEST 12 TUZ collisions were not preserved')
          if any(node.get('compoundChild') != 'true' for node in tuz_collisions.values()):
              raise SystemExit('TEST 12 TUZ compound state changed')

          print('pCube2 shortened to 86 percent in Z with compensated rear position')
          PY

      - name: Validate and build
        run: |
          python3 tools/validate_current.py
          ./build.sh
          test -f dist/FS25_Ursus_1654_1954_Pack.zip

      - name: Commit cleanup test 14
        run: |
          rm .github/workflows/cleanup-1.0.1.1-test14.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Ursus1934.i3d .github/workflows/cleanup-1.0.1.1-test14.yml
          git commit -m 'Shorten main front collision envelope test 14'
          git push origin HEAD:cleanup-1.0.1.1

      - name: Publish cleanup pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          sha256sum dist/FS25_Ursus_1654_1954_Pack.zip > dist/FS25_Ursus_1654_1954_Pack.zip.sha256
          cat > /tmp/notes.md <<'EOF'
          ## 1.0.1.1 CLEANUP TEST 14

          Diagnostyczne skrócenie głównej bryły pCube2 wystającej przed maskę.

          Zmiany:
          - pCube2 otrzymał skalę 1 1 0.86,
          - pozycja Z została skorygowana z 0.822 do 0.50, aby zachować tylną krawędź bryły,
          - szerokość i wysokość kolizji pozostają bez zmian,
          - przełączanie WeightFrame z TEST 13 pozostaje bez zmian,
          - kolizje TUZ-a, jointy, WOM, przewody i tankowanie pozostają bez zmian.

          Do sprawdzenia:
          - podgląd F5 głównej bryły względem przedniej krawędzi maski,
          - zgodność tylnej krawędzi, góry oraz boków,
          - różnica kolizji między opcją bez wyposażenia, WeightFrame i FrontHydraulic,
          - tankowanie,
          - fizyczne kolizje całego ciągnika i log.
          EOF
          gh release create v1.0.1.1-test14 --target "$SHA" --title '1.0.1.1 CLEANUP TEST 14' --prerelease --notes-file /tmp/notes.md dist/FS25_Ursus_1654_1954_Pack.zip dist/FS25_Ursus_1654_1954_Pack.zip.sha256
