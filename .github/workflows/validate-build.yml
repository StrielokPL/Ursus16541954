name: Validate, build and publish Ursus prerelease

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.4
      - name: Check Lua and transmission contracts
        run: |
          luac -p UrsusTransmissionFix.lua
          luac -p UrsusColorFix.lua
          lua tests/transmission.lua
      - name: Validate current mod tree and build complete ZIP
        run: bash build.sh
      - name: Verify complete archive
        run: python3 tools/verify_release.py
      - name: Publish P1 test build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(cat VERSION)" = '1.1.1.1'
          if gh release view 1.1.1.1P1 >/dev/null 2>&1; then
            echo 'Existing P1 release is immutable; bump version and tag for the next test.'
            exit 0
          fi
          gh release create 1.1.1.1P1 dist/FS25_Ursus_1654_1954_Pack.zip dist/SHA256SUMS.txt --target "$GITHUB_SHA" --title 'Ursus 1654/1954 1.1.1.1 P1 — automat pod obciążenie' --notes-file docs/releases/1.1.1.1P1.md --prerelease --latest=false
