name: Publish 1.0.6.0T7

on:
  push:
    paths:
      - '.github/workflows/release-1.0.6.0T7.yml'

permissions:
  contents: write

jobs:
  prerelease:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Widmo T7 tuning
        run: python3 tools/release_t7.py

      - name: Validate source tree
        run: python3 tools/validate_current.py

      - name: Build test ZIP
        run: ./build.sh

      - name: Verify Widmo T7 ZIP
        shell: bash
        run: |
          set -euo pipefail
          unzip -p dist/FS25_Ursus_1654_1954_Pack.zip modDesc.xml | grep -q '<version>1.0.6.0T7</version>'
          unzip -p dist/FS25_Ursus_1654_1954_Pack.zip Ursus1934.xml | grep -q 'motorConfiguration name="1934 Widmo" hp="290"'
          unzip -p dist/FS25_Ursus_1654_1954_Pack.zip Ursus1934.xml | grep -q 'torqueScale="1.100"'
          unzip -p dist/FS25_Ursus_1654_1954_Pack.zip UrsusTransmissionFix.lua | grep -q 'maxLongStiffness x1.20'
          echo 'ZIP Widmo T7 check: OK'

      - name: Commit 1.0.6.0T7
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm tools/release_t7.py
          git add VERSION modDesc.xml Ursus1934.xml UrsusTransmissionFix.lua UrsusColorFix.lua CHANGELOG.md PROJECT_STATE.md
          git commit -m 'Release 1.0.6.0T7 Widmo torque and rear traction test'
          git push origin HEAD:main

      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET_SHA=$(git rev-parse HEAD)
          gh release create v1.0.6.0T7 dist/FS25_Ursus_1654_1954_Pack.zip --target "$TARGET_SHA" --title '1.0.6.0T7 — Widmo torque and rear traction test' --prerelease --notes 'Widmo: 290 hp, torqueScale 1.100 and 20% more rear longitudinal stiffness. RWD, direct 8F/4R, COM and lateral tire grip remain unchanged.'

      - name: Remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          git rm .github/workflows/release-1.0.6.0T7.yml
          git commit -m 'Remove one-shot 1.0.6.0T7 release workflow'
          git push origin HEAD:main
