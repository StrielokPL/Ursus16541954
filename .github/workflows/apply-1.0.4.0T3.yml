name: Apply and publish 1.0.4.0T3

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-1.0.4.0T3.yml

permissions:
  contents: write

jobs:
  apply-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix ADS load-guard logging
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('UrsusTransmissionFix.lua')
          s = p.read_text(encoding='utf-8')
          s = s.replace('1.0.4.0T2', '1.0.4.0T3')
          old = '''        Logging.info(string.format(\n            "[UrsusTransmissionFix] ADS load guard: %s %d%s -> %d%s | load=%d%% rpm=%d",\n            action,\n            fromGear or 0,\n            splitterGroupLabel(fromGroup),\n            toGear or 0,\n            splitterGroupLabel(toGroup),\n            math.floor((load or 0) * 100 + 0.5),\n            math.floor((rpm or 0) + 0.5)\n        ))'''
          new = '''        Logging.info("%s", string.format(\n            "[UrsusTransmissionFix] ADS load guard: %s %d%s -> %d%s | load=%d%% rpm=%d",\n            action,\n            fromGear or 0,\n            splitterGroupLabel(fromGroup),\n            toGear or 0,\n            splitterGroupLabel(toGroup),\n            math.floor((load or 0) * 100 + 0.5),\n            math.floor((rpm or 0) + 0.5)\n        ))'''
          if old not in s:
              raise SystemExit('Expected T2 logging block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('modDesc.xml')
          s = p.read_text(encoding='utf-8').replace('<version>1.0.4.0T2</version>', '<version>1.0.4.0T3</version>')
          p.write_text(s, encoding='utf-8')

          Path('VERSION').write_text('1.0.4.0T3\n', encoding='utf-8')

          p = Path('CHANGELOG.md')
          s = p.read_text(encoding='utf-8')
          entry = '''\n## 1.0.4.0T3\nHotfix testowy mechanizmu ADS load guard.\n\nZmiany względem 1.0.4.0T2:\n- naprawiono błąd diagnostyki `Logging.info`, który pojawiał się dokładnie przy pierwszej ingerencji load guarda (`missing argument #2`),\n- przyczyną był znak `%` w już sformatowanym komunikacie przekazywanym ponownie do formattera GIANTS Logging,\n- błąd przerywał metodę `update` przed zakończeniem decyzji skrzyni, przez co ochronna redukcja lub blokada upshiftu nie mogła działać prawidłowo,\n- progi ADS, sekwencja biegów i czasy histerezy pozostają bez zmian względem T2, aby T3 izolował wyłącznie ten błąd.\n\n'''
          marker = '## Dalszy rozwój'
          if marker not in s:
              raise SystemExit('Changelog marker not found')
          s = s.replace(marker, entry + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate source tree
        run: python3 tools/validate_current.py

      - name: Build test ZIP
        run: ./build.sh

      - name: Commit 1.0.4.0T3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add UrsusTransmissionFix.lua modDesc.xml VERSION CHANGELOG.md
          git commit -m "Fix ADS load guard logging in 1.0.4.0T3"
          git push origin HEAD:main
          echo "TARGET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.4.0T3 \
            dist/FS25_Ursus_1654_1954_Pack.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "1.0.4.0T3 — ADS load-guard logging hotfix" \
            --prerelease \
            --notes $'Test hotfix based on 1.0.4.0T2.\n\nFix:\n- fixes GIANTS Logging error `missing argument #2` triggered by ADS load-guard diagnostics,\n- the logging exception interrupted the transmission update exactly when the guard attempted to intervene,\n- ADS load/RPM thresholds and shifting logic are intentionally unchanged from T2.\n\nExpected result: load-guard messages can now be logged safely and protective downshift/upshift blocking can complete.'

      - name: Remove one-shot workflow
        run: |
          git pull --rebase origin main
          rm .github/workflows/apply-1.0.4.0T3.yml
          git add .github/workflows/apply-1.0.4.0T3.yml
          git commit -m "Remove 1.0.4.0T3 migration workflow"
          git push origin HEAD:main
