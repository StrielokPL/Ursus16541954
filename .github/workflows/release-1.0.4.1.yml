name: Finalize and publish 1.0.4.1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-1.0.4.1.yml

permissions:
  contents: write

jobs:
  stable-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Finalize stable 1.0.4.1
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Version identity
          Path('VERSION').write_text('1.0.4.1\n', encoding='utf-8')

          p = Path('modDesc.xml')
          s = p.read_text(encoding='utf-8')
          old = '<version>1.0.4.0T4</version>'
          new = '<version>1.0.4.1</version>'
          if old not in s:
              raise SystemExit('Expected T4 modDesc version not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('UrsusTransmissionFix.lua')
          s = p.read_text(encoding='utf-8')
          if '1.0.4.0T4' not in s:
              raise SystemExit('Expected T4 transmission marker not found')
          p.write_text(s.replace('1.0.4.0T4', '1.0.4.1'), encoding='utf-8')

          # Stable changelog entry summarizing T1-T4.
          p = Path('CHANGELOG.md')
          s = p.read_text(encoding='utf-8')
          marker = '## Dalszy rozwój'
          if marker not in s:
              raise SystemExit('Changelog marker not found')
          entry = '''## 1.0.4.1\nStabilne wydanie zmian testowanych w serii 1.0.4.0T1–T4, ukierunkowanych na zgodność z modami realizmu i zachowanie automatycznej skrzyni pod dużym obciążeniem.\n\nZmiany względem 1.0.3.0:\n- dodano rok produkcji `2009` do danych sklepowych dla zgodności z Vehicle Years i systemami korzystającymi z `storeData.year`,\n- pojemność zbiornika oleju napędowego zwiększono z `300 l` do `355 l`, zgodnie z danymi ciężkiej serii Ursusa,\n- dodano opcjonalny bridge do Advanced Damage System dla automatycznego splittera L/H; zmiany splittera respektują awarie zmiany biegu ADS oraz opóźnienie/uszkodzenie powershiftu,\n- automat z aktywnym ADS korzysta z `spec.dynamicMotorLoad`, czyli tego samego sygnału obciążenia, którego ADS używa do telemetrii i zużycia silnika,\n- przy obciążeniu >80% ochronna redukcja uruchamia się poniżej 65% maksymalnych obrotów (~1430 rpm przy 2200 rpm),\n- przy obciążeniu >80% blokowany jest upshift poniżej 83% maksymalnych obrotów (~1825 rpm), aby po przejściu L→H zachować zapas ponad strefą luggingu,\n- ochronna redukcja pozostaje ograniczona do jednego wirtualnego stopnia naraz, z cooldownem oraz histerezą 1,8 s zapobiegającą polowaniu między przełożeniami,\n- naprawiono diagnostykę load guarda, tak aby wpisy `DOWNSHIFT` / `BLOCK UPSHIFT` nie powodowały błędu formattera GIANTS Logging,\n- bez ADS oraz w trybie manualnym zachowanie skrzyni pozostaje zgodne ze stabilnym mechanizmem 8F/4R × L/H.\n\nTesty runtime:\n- seria T4 przeszła test normalnej pracy oraz test graniczny z pługiem wymagającym 210 KM, w deszczu i przy 100% wilgotności gleby,\n- load guard poprawnie blokował zbyt wczesne upshifty i wykonywał ochronne redukcje bez błędów Lua,\n- brak nowych błędów związanych z Ursusem.\n\n### Znane problemy\n- pozostaje zaakceptowany warning `Ursus1934.i3d contains non-binary indexed triangle sets` związany z tekstową geometrią `FS25MirrorExact`; nie ma zaobserwowanego wpływu na działanie ani wygląd.\n\n'''
          if '## 1.0.4.1\n' in s:
              raise SystemExit('Stable 1.0.4.1 changelog already exists')
          p.write_text(s.replace(marker, entry + marker, 1), encoding='utf-8')

          # Project state: promote the tested T4 behavior to stable baseline.
          p = Path('PROJECT_STATE.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('# Project state — 1.0.3.0', '# Project state — 1.0.4.1', 1)
          s = s.replace('Current stable baseline is **1.0.3.0**.', 'Current stable baseline is **1.0.4.1**.', 1)
          s = s.replace('Current version: **1.0.3.0**.', 'Current version: **1.0.4.1**.', 1)
          runtime_old = 'Version 1.0.3.0 was verified in Farming Simulator 25. Refuelling works, the 2500 kg weight provides a valid AI attachment outline, and lights plus dashboards remain visually and functionally unchanged. The final runtime log contains no Ursus-related errors.'
          runtime_new = 'Version 1.0.4.1 was verified in Farming Simulator 25. Refuelling, the 2500 kg weight AI outline, lights and dashboards retain their approved behavior. The optional Advanced Damage System bridge and load-aware automatic transmission were runtime-tested through T1–T4, including an extreme high-load plowing test in rain at 100% soil wetness. The final test log contains no Ursus-related Lua errors.'
          if runtime_old not in s:
              raise SystemExit('Expected project-state runtime paragraph not found')
          s = s.replace(runtime_old, runtime_new, 1)
          insert_marker = '## Package identity\n'
          ads_section = '''## Realism / ADS compatibility\n\nStable 1.0.4.1 adds optional integration without making Advanced Damage System a hard dependency:\n- Vehicle Years receives store year `2009`,\n- diesel capacity is `355 l`,\n- automatic L/H changes respect ADS gear-shift failure and powershift lag effects,\n- while ADS is active the automatic load guard reads `spec.dynamicMotorLoad`,\n- at >80% load it downshifts below 65% max RPM and blocks upshifts below 83% max RPM,\n- protective downshifts are one virtual step at a time with a 1.8 s post-downshift upshift hold,\n- without ADS and in manual mode the approved transmission behavior is unchanged.\n\n'''
          if insert_marker not in s:
              raise SystemExit('Package identity marker not found')
          if '## Realism / ADS compatibility\n' not in s:
              s = s.replace(insert_marker, ads_section + insert_marker, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate source tree
        run: python3 tools/validate_current.py

      - name: Build stable ZIP
        run: ./build.sh

      - name: Commit stable 1.0.4.1
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION modDesc.xml UrsusTransmissionFix.lua CHANGELOG.md PROJECT_STATE.md
          git commit -m "Release 1.0.4.1"
          git push origin HEAD:main
          echo "TARGET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create v1.0.4.1 \
            dist/FS25_Ursus_1654_1954_Pack.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "1.0.4.1 — Realism and ADS compatibility" \
            --notes $'Stable release promoted from the tested 1.0.4.0T1–T4 series.\n\nHighlights:\n- production year 2009 for Vehicle Years compatibility,\n- diesel capacity 355 L,\n- optional Advanced Damage System bridge for gear-shift failures and powershift lag,\n- ADS load-aware automatic shifting using dynamic motor load,\n- protective downshift below 65% max RPM at >80% load,\n- upshift guard below 83% max RPM at >80% load,\n- one-step protective reductions with 1.8 s anti-hunt hold,\n- no behavior change without ADS or in manual mode.\n\nRuntime validation included an extreme 210 hp plow test in rain at 100% soil wetness. No new Ursus-related Lua errors were observed.\n\nKnown accepted issue: Ursus1934.i3d may report a non-binary indexed triangle sets warning from FS25MirrorExact geometry; no gameplay or visual regression is known.'

      - name: Remove one-shot workflow
        shell: bash
        run: |
          git pull --rebase origin main
          git rm .github/workflows/release-1.0.4.1.yml
          git commit -m "Remove one-shot 1.0.4.1 release workflow"
          git push origin HEAD:main
