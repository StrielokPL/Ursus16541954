name: Prepare 1.0.1.1 cleanup test 5

on:
  push:
    branches: [cleanup-1.0.1.1]
    paths: [.github/workflows/cleanup-1.0.1.1-test5.yml]

permissions:
  contents: write

jobs:
  patch-build-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup-1.0.1.1
          fetch-depth: 0

      - name: Apply physical exact fill root test
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          i3d_path = Path('Ursus1934.i3d')
          tree = ET.parse(i3d_path)
          root = tree.getroot()
          scene = root.find('./Scene')
          scene_nodes = list(scene)
          if not scene_nodes:
              raise SystemExit('Scene has no root nodes')
          component = scene_nodes[0]
          if component.get('name') != 'Ursus1934M8e' or component.get('nodeId') != '242':
              raise SystemExit(f'Unexpected component root: {component.get("name")} nodeId={component.get("nodeId")}')
          if component.get('collisionFilterGroup') != '0x10004':
              raise SystemExit(f'Unexpected original component collision group: {component.get("collisionFilterGroup")}')
          if component.get('collisionFilterMask') != '0xfe3ffb83':
              raise SystemExit(f'Unexpected component collision mask: {component.get("collisionFilterMask")}')
          component.set('collisionFilterGroup', '0x40010004')

          fuel_nodes = [n for n in root.iter() if n.get('name') == 'Fuel']
          if len(fuel_nodes) != 1 or fuel_nodes[0].get('nodeId') != '449':
              raise SystemExit('Unique dashboard Fuel nodeId=449 not found')
          fuel_nodes[0].attrib.pop('collisionFilterGroup', None)

          ET.indent(tree, space='  ')
          tree.write(i3d_path, encoding='utf-8', xml_declaration=True)

          xml_path = Path('Ursus1934.xml')
          vehicle = ET.parse(xml_path)
          exact_nodes = vehicle.findall('./fillUnit/fillUnitConfigurations/fillUnitConfiguration/fillUnits/fillUnit/exactFillRootNode')
          if len(exact_nodes) != 1:
              raise SystemExit(f'Expected one exactFillRootNode, found {len(exact_nodes)}')
          if exact_nodes[0].get('node') != '0>10|2|0|0|3|2|1':
              raise SystemExit(f'Unexpected old exact fill path: {exact_nodes[0].get("node")}')
          exact_nodes[0].set('node', '0>')
          ET.indent(vehicle, space='  ')
          vehicle.write(xml_path, encoding='utf-8', xml_declaration=True)

          check_i3d = i3d_path.read_text(encoding='utf-8')
          check_xml = xml_path.read_text(encoding='utf-8')
          if 'collisionFilterGroup="0x40010004"' not in check_i3d:
              raise SystemExit('Physical component FILLABLE group missing')
          if '<exactFillRootNode node="0&gt;"' not in check_xml and '<exactFillRootNode node="0>"' not in check_xml:
              raise SystemExit('Physical exactFillRootNode path missing')
          print('Physical exact fill root test applied')
          PY

      - name: Validate and build
        run: |
          python3 tools/validate_current.py
          ./build.sh
          test -f dist/FS25_Ursus_1654_1954_Pack.zip

      - name: Commit cleanup test 5
        run: |
          rm .github/workflows/cleanup-1.0.1.1-test5.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Ursus1934.i3d Ursus1934.xml .github/workflows/cleanup-1.0.1.1-test5.yml
          git commit -m 'Use physical component as exact fuel fill root test 5'
          git push origin HEAD:cleanup-1.0.1.1

      - name: Publish cleanup pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          sha256sum dist/FS25_Ursus_1654_1954_Pack.zip > dist/FS25_Ursus_1654_1954_Pack.zip.sha256
          cat > /tmp/notes.md <<'EOF'
          ## 1.0.1.1 CLEANUP TEST 5

          Test prawidłowego fizycznego exactFillRootNode dla zbiornika paliwa.

          Zmiany względem TEST 4:
          - exactFillRootNode przeniesiono ze wskaźnika deski Fuel na główny fizyczny component ciągnika 0>,
          - grupa kolizji głównego componentu rozszerzona o wymagany bit 30 FILLABLE: 0x10004 -> 0x40010004,
          - maska kolizji 0xfe3ffb83 i geometria pozostają bez zmian,
          - nieskuteczny atrybut collisionFilterGroup usunięto ze wskaźnika Fuel.

          Do sprawdzenia:
          - brak warningu Missing collision group bit 30 (FILLABLE),
          - tankowanie,
          - kolizje ze sprzętem i ruchem drogowym.
          EOF
          gh release create v1.0.1.1-test5 --target "$SHA" --title '1.0.1.1 CLEANUP TEST 5' --prerelease --notes-file /tmp/notes.md dist/FS25_Ursus_1654_1954_Pack.zip dist/FS25_Ursus_1654_1954_Pack.zip.sha256
