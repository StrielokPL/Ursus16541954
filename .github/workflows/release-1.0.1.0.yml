name: Prepare 1.0.1.0 release

on:
  push:
    branches:
      - driver-position-test1
    paths:
      - '.github/workflows/release-1.0.1.0.yml'

permissions:
  contents: write

jobs:
  finalize-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v4
        with:
          ref: driver-position-test1
          fetch-depth: 0

      - name: Finalize 1.0.1.0 source tree
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          # Driver: accepted direction, another 2 cm lower => total -6 cm from V25.
          i3d = Path('Ursus1934.i3d')
          text = i3d.read_text(encoding='utf-8')
          old = 'name="playerRoot" translation="-1.0516e-14 -0.04 0"'
          new = 'name="playerRoot" translation="-1.0516e-14 -0.06 0"'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one driver anchor at -0.04, found {text.count(old)}')
          i3d.write_text(text.replace(old, new, 1), encoding='utf-8')

          # New semantic version baseline.
          mod = Path('modDesc.xml')
          text = mod.read_text(encoding='utf-8')
          old_version = '<version>1.0.0.25</version>'
          if text.count(old_version) != 1:
              raise SystemExit('Expected legacy modDesc version 1.0.0.25 exactly once')
          mod.write_text(text.replace(old_version, '<version>1.0.1.0</version>', 1), encoding='utf-8')
          Path('VERSION').write_text('1.0.1.0\n', encoding='utf-8')

          # Stable ZIP package name from this release onward.
          builder = Path('tools/build_mod.py')
          text = builder.read_text(encoding='utf-8')
          old_block = '''    version = (ROOT / "VERSION").read_text(encoding="utf-8").strip()\n    safe_version = "".join(c if c.isalnum() or c in "._-" else "_" for c in version)\n    output = Path(sys.argv[1]).expanduser() if len(sys.argv) > 1 else DIST / f"FS25_Ursus_1654_1954_Pack_{safe_version}.zip"'''
          new_block = '''    output = Path(sys.argv[1]).expanduser() if len(sys.argv) > 1 else DIST / "FS25_Ursus_1654_1954_Pack.zip"'''
          if text.count(old_block) != 1:
              raise SystemExit('Builder legacy output-name block not found exactly once')
          builder.write_text(text.replace(old_block, new_block, 1), encoding='utf-8')

          # XML sanity after edits.
          ET.parse(i3d)
          ET.parse(mod)
          print('Final source edits applied: driver -0.06 m, version 1.0.1.0, stable ZIP name.')
          PY

          rm -f .github/workflows/release-v25.yml .github/release-v25-trigger.txt

      - name: Validate current mod tree
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import io
          import xml.etree.ElementTree as ET
          import zipfile

          root = Path('.')
          files = [line.strip() for line in Path('reference/v25/files.txt').read_text(encoding='utf-8').splitlines() if line.strip() and not line.lstrip().startswith('#')]
          assert len(files) == 67, f'Expected 67 game files, got {len(files)}'
          missing = [p for p in files if not Path(p).is_file()]
          assert not missing, f'Missing game files: {missing}'

          # Parse every XML-like game asset that is plain XML.
          parsed = 0
          for rel in files:
              if rel.endswith(('.xml', '.i3d')):
                  ET.parse(rel)
                  parsed += 1
          assert parsed > 0

          md = ET.parse('modDesc.xml').getroot()
          assert md.findtext('version') == '1.0.1.0'
          store = [n.get('xmlFilename') for n in md.findall('./storeItems/storeItem')]
          assert store == ['Ursus1934.xml', 'Weight2500kg.xml'], store
          sources = [n.get('filename') for n in md.findall('./extraSourceFiles/sourceFile')]
          assert 'UrsusTransmissionFix.lua' in sources
          assert Path('UrsusTransmissionFix.lua').is_file()

          vehicle = ET.parse('Ursus1934.xml').getroot()
          assert vehicle.find('./base/filename').text == 'Ursus1934.i3d'

          i3d_text = Path('Ursus1934.i3d').read_text(encoding='utf-8')
          assert 'name="playerRoot" translation="-1.0516e-14 -0.06 0"' in i3d_text

          shader = Path('shaders/vehicleShader.xml').read_text(encoding='utf-8')
          assert 'mEmitColor *= 0.40;' in shader
          assert 'mEmitColor *= float3(1.0, 0.88, 0.72);' in shader

          assert Path('VERSION').read_text(encoding='utf-8').strip() == '1.0.1.0'
          assert not any(p.endswith('.bak') for p in files)
          print(f'Validation OK: {len(files)} game files, {parsed} XML/I3D files parsed.')
          PY

      - name: Remove one-shot workflow and commit 1.0.1.0
        shell: bash
        run: |
          rm .github/workflows/release-1.0.1.0.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize 1.0.1.0 baseline'
          git push origin HEAD:driver-position-test1

      - name: Build stable package
        shell: bash
        run: |
          ./build.sh
          test -f dist/FS25_Ursus_1654_1954_Pack.zip
          sha256sum dist/FS25_Ursus_1654_1954_Pack.zip > dist/FS25_Ursus_1654_1954_Pack.zip.sha256

          python3 - <<'PY'
          from pathlib import Path
          import io
          import xml.etree.ElementTree as ET
          import zipfile

          expected = [line.strip() for line in Path('reference/v25/files.txt').read_text(encoding='utf-8').splitlines() if line.strip() and not line.lstrip().startswith('#')]
          with zipfile.ZipFile('dist/FS25_Ursus_1654_1954_Pack.zip') as zf:
              names = zf.namelist()
              assert names == expected, 'ZIP file list/order differs from allowlist'
              assert len(names) == 67
              assert all('/.git/' not in n and not n.startswith('.git') for n in names)
              assert 'README.md' not in names
              assert 'VERSION' not in names
              assert zf.read('modDesc.xml').find(b'<version>1.0.1.0</version>') >= 0
              for name in names:
                  if name.endswith(('.xml', '.i3d')):
                      ET.fromstring(zf.read(name))
          print('Built ZIP validation OK: exactly 67 game files, semantic version present, XML/I3D parse OK.')
          PY

      - name: Publish stable 1.0.1.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          if gh release view v1.0.1.0 >/dev/null 2>&1; then
            echo 'Release v1.0.1.0 already exists; aborting to avoid accidental replacement.'
            exit 1
          fi
          cat > /tmp/release-notes.md <<'EOF'
          ## Ursus 1654–1954 — 1.0.1.0

          Pierwsze kompletne wydanie w nowej, czteroczłonowej semantyce wersji.

          ### Najważniejsze zmiany względem V25 COLLISION SAFE
          - poprawiony wygląd emissive włączonych lamp: niższa jasność powierzchni i lekko cieplejszy halogenowy odcień,
          - model kierowcy obniżony łącznie o 6 cm, aby prawidłowo siedział na fotelu i nie wchodził głową w dach,
          - zachowane poprawne kolizje FS25, skrzynia 8F/4R × Low/High, silniki, lusterka, koła i konfiguracje V25,
          - wykonany cleanup repo/builda i walidacja wszystkich XML/I3D w paczce,
          - od tej wersji ZIP moda ma stałą nazwę `FS25_Ursus_1654_1954_Pack.zip`.

          ### Zgodność savegame
          Nazwy `Ursus1934.xml`, `Weight2500kg.xml`, store itemów i tożsamość paczki pozostają bez zmian. Kolejne aktualizacje będą publikowane pod tą samą nazwą ZIP-a.

          ### Walidacja wydania
          Paczka zawiera dokładnie 67 plików gry z kontrolowanej allowlisty. Przed publikacją parser sprawdza wszystkie XML/I3D, wersję `1.0.1.0`, ścieżki store itemów, skrypt skrzyni, poprawkę emissive i finalną pozycję `playerRoot`.
          EOF
          gh release create v1.0.1.0 \
            --target "$SHA" \
            --title '1.0.1.0' \
            --notes-file /tmp/release-notes.md \
            dist/FS25_Ursus_1654_1954_Pack.zip \
            dist/FS25_Ursus_1654_1954_Pack.zip.sha256
