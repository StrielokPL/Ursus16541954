name: Prepare 1.0.1.1 cleanup test 6

on:
  push:
    branches: [cleanup-1.0.1.1]
    paths: [.github/workflows/cleanup-1.0.1.1-test6.yml]

permissions:
  contents: write

jobs:
  patch-build-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup-1.0.1.1
          fetch-depth: 0

      - name: Apply dedicated exact fill collision node
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          i3d_path=Path('Ursus1934.i3d')
          tree=ET.parse(i3d_path)
          root=tree.getroot()
          scene=root.find('./Scene')
          valid={'TransformGroup','Shape','Camera','Light'}
          roots=[c for c in scene if c.tag in valid]
          if not roots or roots[0].get('nodeId')!='242':
              raise SystemExit('Main component nodeId=242 not found')
          component=roots[0]
          if component.get('collisionFilterGroup')!='0x40010004':
              raise SystemExit(f'Unexpected TEST 5 component group: {component.get("collisionFilterGroup")}')
          component.set('collisionFilterGroup','0x10004')

          matches=[]
          def walk(parent,path):
              children=[c for c in parent if c.tag in valid]
              for idx,node in enumerate(children):
                  node_path=path+[idx]
                  if node.get('nodeId')=='879':
                      matches.append((node,node_path))
                  walk(node,node_path)
          walk(scene,[])
          if len(matches)!=1:
              raise SystemExit(f'Expected one nodeId=879, found {len(matches)}')
          fill_node,indices=matches[0]
          if fill_node.get('name')!='pCube2' or fill_node.get('compoundChild')!='true':
              raise SystemExit(f'Unexpected fill node: {fill_node.get("name")}')
          if fill_node.get('collisionFilterGroup')!='0x10004':
              raise SystemExit(f'Unexpected pCube2 group: {fill_node.get("collisionFilterGroup")}')
          fill_node.set('collisionFilterGroup','0x40010004')
          if indices[0]!=0:
              raise SystemExit(f'Unexpected root index: {indices}')
          fill_path='0>'+'|'.join(map(str,indices[1:]))
          print('Dedicated exact fill path:',fill_path)

          ET.indent(tree,space='  ')
          tree.write(i3d_path,encoding='utf-8',xml_declaration=True)

          xml_path=Path('Ursus1934.xml')
          vehicle=ET.parse(xml_path)
          exact=vehicle.findall('./fillUnit/fillUnitConfigurations/fillUnitConfiguration/fillUnits/fillUnit/exactFillRootNode')
          if len(exact)!=1 or exact[0].get('node')!='0>':
              raise SystemExit(f'Unexpected TEST 5 exactFillRootNode: {[x.get("node") for x in exact]}')
          exact[0].set('node',fill_path)
          ET.indent(vehicle,space='  ')
          vehicle.write(xml_path,encoding='utf-8',xml_declaration=True)
          print('Dedicated exact fill collision node applied')
          PY

      - name: Validate and build
        run: |
          python3 tools/validate_current.py
          ./build.sh
          test -f dist/FS25_Ursus_1654_1954_Pack.zip

      - name: Commit cleanup test 6
        run: |
          rm .github/workflows/cleanup-1.0.1.1-test6.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Ursus1934.i3d Ursus1934.xml .github/workflows/cleanup-1.0.1.1-test6.yml
          git commit -m 'Use dedicated collision child as exact fuel fill root test 6'
          git push origin HEAD:cleanup-1.0.1.1

      - name: Publish cleanup pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          sha256sum dist/FS25_Ursus_1654_1954_Pack.zip > dist/FS25_Ursus_1654_1954_Pack.zip.sha256
          cat > /tmp/notes.md <<'EOF'
          ## 1.0.1.1 CLEANUP TEST 6

          Naprawa regresji node-object mapping z TEST 5.

          Zmiany:
          - główny component Ursus1934M8e przywrócony do zatwierdzonej grupy 0x10004,
          - exactFillRootNode przeniesiony na osobny fizyczny compound child pCube2 (nodeId 879),
          - tylko ten child otrzymał grupę 0x40010004 z bitem FILLABLE,
          - maski kolizji i geometria pozostały bez zmian.

          Do sprawdzenia:
          - brak błędu Node Ursus1934M8e already has a node-object mapping,
          - brak warningu Missing collision group bit 30 FILLABLE,
          - tankowanie i kolizje.
          EOF
          gh release create v1.0.1.1-test6 --target "$SHA" --title '1.0.1.1 CLEANUP TEST 6' --prerelease --notes-file /tmp/notes.md dist/FS25_Ursus_1654_1954_Pack.zip dist/FS25_Ursus_1654_1954_Pack.zip.sha256
