name: Prepare V25 driver position test 1

on:
  push:
    branches:
      - driver-position-test1
    paths:
      - '.github/workflows/driver-position-test1.yml'

permissions:
  contents: write

jobs:
  patch-build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: driver-position-test1
          fetch-depth: 0

      - name: Lower driver character node by 4 cm
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          path = Path('Ursus1934.i3d')
          tree = ET.parse(path)
          root = tree.getroot()
          scene = root.find('Scene')
          if scene is None:
              raise SystemExit('Scene node not found')

          def graph_children(node):
              return [child for child in list(node) if child.get('nodeId') is not None]

          indices = [0, 10, 2, 0, 0, 5, 7]
          node = scene
          walked = []
          for index in indices:
              children = graph_children(node)
              if index >= len(children):
                  raise SystemExit(f'Path failed at {walked}: child {index}, only {len(children)} graph children')
              node = children[index]
              walked.append(index)

          node_id = node.get('nodeId')
          name = node.get('name', '<unnamed>')
          old_translation = node.get('translation')
          if old_translation is None:
              raise SystemExit(f'Target node {node_id} ({name}) has no translation attribute')

          values = old_translation.split()
          if len(values) != 3:
              raise SystemExit(f'Unexpected translation format: {old_translation}')
          x, y, z = map(float, values)
          new_y = y - 0.04
          new_translation = f'{values[0]} {new_y:.9g} {values[2]}'

          text = path.read_text(encoding='utf-8')
          lines = text.splitlines(keepends=True)
          matches = [i for i, line in enumerate(lines) if f'nodeId="{node_id}"' in line]
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one text line for nodeId {node_id}, found {len(matches)}')
          i = matches[0]
          needle = f'translation="{old_translation}"'
          if needle not in lines[i]:
              raise SystemExit(f'Could not find exact translation on node line: {lines[i]}')
          lines[i] = lines[i].replace(needle, f'translation="{new_translation}"', 1)
          path.write_text(''.join(lines), encoding='utf-8')

          # Validate after minimal textual edit and verify the same node now has the expected translation.
          tree2 = ET.parse(path)
          scene2 = tree2.getroot().find('Scene')
          node2 = scene2
          for index in indices:
              node2 = graph_children(node2)[index]
          if node2.get('translation') != new_translation:
              raise SystemExit('Post-patch verification failed')

          print(f'Target character node: nodeId={node_id}, name={name}')
          print(f'Old translation: {old_translation}')
          print(f'New translation: {new_translation}')
          print('Driver character anchor lowered by exactly 0.04 m on local Y.')
          PY

      - name: Remove one-shot workflow and commit test
        shell: bash
        run: |
          rm .github/workflows/driver-position-test1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Ursus1934.i3d .github/workflows/driver-position-test1.yml
          git commit -m 'Test driver character position 4 cm lower'
          git push origin HEAD:driver-position-test1

      - name: Build test ZIP
        shell: bash
        run: |
          ./build.sh dist/FS25_Ursus_1654_1954_Pack_V25_COLLISION_SAFE.zip
          sha256sum dist/FS25_Ursus_1654_1954_Pack_V25_COLLISION_SAFE.zip > dist/FS25_Ursus_1654_1954_Pack_V25_COLLISION_SAFE.zip.sha256

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          if gh release view v25-driver-test1 >/dev/null 2>&1; then
            gh release delete v25-driver-test1 --yes --cleanup-tag
          fi
          cat > /tmp/notes.md <<'EOF'
          ## V25 DRIVER POSITION TEST 1

          Test pozycji modelu kierowcy w widoku zewnętrznym.

          Zmiany względem zaakceptowanego stanu V25 + poprawka świateł:
          - node postaci wskazany przez `characterNode` przesunięty dokładnie o 0,04 m w dół,
          - bez zmian kamery wewnętrznej i zewnętrznej,
          - bez zmian fotela,
          - bez zmian targetów IK rąk i nóg,
          - zaakceptowana poprawka emissive świateł pozostaje w buildzie.

          Do sprawdzenia: czy pośladki postaci opierają się na siedzisku, czy głowa nie wchodzi już w dach oraz czy ręce i nogi nadal układają się naturalnie.
          EOF
          gh release create v25-driver-test1 \
            --target "$SHA" \
            --title 'V25 DRIVER POSITION TEST 1' \
            --prerelease \
            --notes-file /tmp/notes.md \
            dist/FS25_Ursus_1654_1954_Pack_V25_COLLISION_SAFE.zip \
            dist/FS25_Ursus_1654_1954_Pack_V25_COLLISION_SAFE.zip.sha256
