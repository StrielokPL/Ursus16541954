name: Prepare 1.0.1.1 cleanup test 24

on:
  push:
    branches: [cleanup-1.0.1.1]
    paths: [.github/workflows/cleanup-1.0.1.1-test24.yml]

permissions:
  contents: write

jobs:
  lower-and-widen-weight-collision-boxes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup-1.0.1.1
          fetch-depth: 0

      - name: Apply weight-box position tweaks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "f1522bbbf113d598a15a316f1699587752613852"
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          i3d_path = Path('Ursus1934.i3d')
          text = i3d_path.read_text(encoding='utf-8')

          replacements = {
              'name="colli05" translation="0 0.933008 1.78072"':
                  'name="colli05" translation="0 0.883008 1.78072"',
              'name="frontWeightHeavyCollisionBox" translation="0 0.933008 2.03072"':
                  'name="frontWeightHeavyCollisionBox" translation="0 0.883008 2.03072"',
              'name="frontWeight2000CollisionBoxLeft" translation="-0.1 0.933008 2.03072"':
                  'name="frontWeight2000CollisionBoxLeft" translation="-0.2 0.883008 2.03072"',
              'name="frontWeight2000CollisionBoxRight" translation="0.1 0.933008 2.03072"':
                  'name="frontWeight2000CollisionBoxRight" translation="0.2 0.883008 2.03072"',
              'name="frontWeightWideShortCollisionBoxLeft" translation="-0.1 0.933008 1.78072"':
                  'name="frontWeightWideShortCollisionBoxLeft" translation="-0.2 0.883008 1.78072"',
              'name="frontWeightWideShortCollisionBoxRight" translation="0.1 0.933008 1.78072"':
                  'name="frontWeightWideShortCollisionBoxRight" translation="0.2 0.883008 1.78072"',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one TEST 23 value: {old}')
              text = text.replace(old, new, 1)

          i3d_path.write_text(text, encoding='utf-8')
          root = ET.parse(i3d_path).getroot()
          nodes = {
              node.get('nodeId'): node
              for node in root.iter()
              if node.get('nodeId') is not None
          }

          expected_boxes = {
              '880': ('colli05', '0 0.883008 1.78072'),
              '7003': (
                  'frontWeightHeavyCollisionBox',
                  '0 0.883008 2.03072',
              ),
              '7004': (
                  'frontWeight2000CollisionBoxLeft',
                  '-0.2 0.883008 2.03072',
              ),
              '7005': (
                  'frontWeight2000CollisionBoxRight',
                  '0.2 0.883008 2.03072',
              ),
              '7007': (
                  'frontWeightWideShortCollisionBoxLeft',
                  '-0.2 0.883008 1.78072',
              ),
              '7008': (
                  'frontWeightWideShortCollisionBoxRight',
                  '0.2 0.883008 1.78072',
              ),
          }
          for node_id, (name, translation) in expected_boxes.items():
              node = nodes.get(node_id)
              if (
                  node is None
                  or node.get('name') != name
                  or node.get('shapeId') != '170'
                  or node.get('translation') != translation
                  or node.get('compoundChild') != 'true'
                  or node.get('nonRenderable') != 'true'
                  or node.get('collisionFilterGroup') != '0x10004'
                  or node.get('collisionFilterMask') != '0xfe3ffb83'
              ):
                  raise SystemExit(f'Invalid TEST 24 weight box node {node_id}')

          expected_tuz = {
              '7002': (
                  'frontHydraulicCollisionBoxLeft',
                  '-0.1 0.8 2.13872',
              ),
              '7006': (
                  'frontHydraulicCollisionBoxRight',
                  '0.1 0.8 2.13872',
              ),
          }
          for node_id, (name, translation) in expected_tuz.items():
              node = nodes.get(node_id)
              if (
                  node is None
                  or node.get('name') != name
                  or node.get('translation') != translation
              ):
                  raise SystemExit(f'TUZ node {node_id} changed unexpectedly')

          p_cube = nodes.get('879')
          if (
              p_cube is None
              or p_cube.get('translation') != '0 1.13534 0.661'
              or p_cube.get('scale') != '1 1 0.93'
          ):
              raise SystemExit('Approved TEST 15 pCube2 state was not preserved')

          root_component = nodes.get('242')
          if (
              root_component is None
              or root_component.get('collisionFilterGroup') != '0x40010004'
          ):
              raise SystemExit('Approved TEST 8 FILLABLE root state was not preserved')

          xml_root = ET.parse('Ursus1934.xml').getroot()
          configs = xml_root.findall(
              'attacherJoints/attacherJointConfigurations/attacherJointConfiguration'
          )
          expected_names = [
              '$l10n_configuration_valueNo',
              'FrameWeight',
              '1200kg',
              '2000kg',
              'FrameWeight',
              '600kg',
              '1500kg',
              'FrontHydraulic',
          ]
          expected_states = {
              '0>11|1': [False, False, False, False, True, True, False, False],
              '0>11|2': [False, False, False, False, False, False, True, False],
              '0>11|3': [False, False, False, True, False, False, False, False],
              '0>11|4': [False, False, False, True, False, False, False, False],
              '0>11|5': [False, True, True, False, False, False, False, False],
              '0>11|6': [False, True, True, False, False, False, False, False],
              '0>10|7|1|15': [False, False, False, False, False, False, False, True],
              '0>10|7|1|16': [False, False, False, False, False, False, False, True],
          }
          if len(configs) != 8:
              raise SystemExit(f'Expected eight front configurations, found {len(configs)}')
          for index, config in enumerate(configs):
              if config.get('name') != expected_names[index]:
                  raise SystemExit(f'Unexpected configuration at index {index + 1}')
              changes = config.findall('objectChange')
              for path, states in expected_states.items():
                  matching = [
                      change for change in changes
                      if change.get('node') == path
                      and change.get('compoundChildActive') is not None
                  ]
                  expected = 'true' if states[index] else 'false'
                  if len(matching) != 1 or matching[0].get('compoundChildActive') != expected:
                      raise SystemExit(f'Wrong unchanged state for {path} in config {index + 1}')

          print('All weight boxes lowered 5 cm; wide family spread to +/-20 cm')
          PY
          git diff --quiet -- Ursus1934.xml

      - name: Validate and build
        run: |
          python3 tools/validate_current.py
          ./build.sh
          test -f dist/FS25_Ursus_1654_1954_Pack.zip

      - name: Commit cleanup test 24
        run: |
          rm .github/workflows/cleanup-1.0.1.1-test24.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Ursus1934.i3d .github/workflows/cleanup-1.0.1.1-test24.yml
          git commit -m 'Tune front weight collision positions test 24'
          git push origin HEAD:cleanup-1.0.1.1

      - name: Publish cleanup pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          sha256sum dist/FS25_Ursus_1654_1954_Pack.zip > dist/FS25_Ursus_1654_1954_Pack.zip.sha256
          cat > /tmp/notes.md <<'EOF'
          ## 1.0.1.1 CLEANUP TEST 24

          Drobne korekty pozycji boxów obu rodzin FrameWeight na bazie TEST 23.

          Zmiany:
          - wszystkie boxy obu rodzin FrameWeight oraz 600/1200/1500/2000 kg opuszczono o 0,05 m,
          - szeroki FrameWeight, 1200 kg i 2000 kg rozsunięto do X = -0,20 m / +0,20 m,
          - wąski FrameWeight, 600 kg i 1500 kg zachowują dotychczasową szerokość,
          - pozycje wzdłuż ciągnika pozostają bez zmian,
          - FrontHydraulic pozostaje całkowicie bez zmian,
          - macierz konfiguracji, pCube2 i tankowanie pozostają bez zmian.

          Do sprawdzenia:
          - wysokość boxów wszystkich sześciu wariantów obciążników,
          - szerokość pierwszego FrameWeight, 1200 i 2000 kg,
          - niezmieniony TUZ,
          - brak boxa w wersji podstawowej,
          - tankowanie oraz log.
          EOF
          gh release create v1.0.1.1-test24 --target "$SHA" --title '1.0.1.1 CLEANUP TEST 24' --prerelease --notes-file /tmp/notes.md dist/FS25_Ursus_1654_1954_Pack.zip dist/FS25_Ursus_1654_1954_Pack.zip.sha256
