name: Publish 1.0.6.0T6

on:
  push:
    paths:
      - '.github/workflows/release-1.0.6.0T6.yml'

permissions:
  contents: write

jobs:
  prerelease:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Widmo direct 8x4 gearbox
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          OLD = '1.0.6.0T5'
          VERSION = '1.0.6.0T6'

          current = Path('VERSION').read_text(encoding='utf-8').strip()
          if current != OLD:
              raise SystemExit(f'Expected {OLD}, got {current}')
          Path('VERSION').write_text(VERSION + '\n', encoding='utf-8')

          p = Path('modDesc.xml')
          s = p.read_text(encoding='utf-8')
          if f'<version>{OLD}</version>' not in s:
              raise SystemExit('modDesc version anchor not found')
          p.write_text(s.replace(f'<version>{OLD}</version>', f'<version>{VERSION}</version>', 1), encoding='utf-8')

          for filename in ('UrsusTransmissionFix.lua', 'UrsusColorFix.lua'):
              p = Path(filename)
              s = p.read_text(encoding='utf-8')
              if OLD not in s:
                  raise SystemExit(f'{filename}: old version marker not found')
              p.write_text(s.replace(OLD, VERSION), encoding='utf-8')

          p = Path('Ursus1934.xml')
          s = p.read_text(encoding='utf-8')

          base_motor_start = s.index('<motorConfiguration name="1674M"')
          base_trans_start = s.index('<transmission', base_motor_start)
          base_trans_end = s.index('</transmission>', base_trans_start) + len('</transmission>')
          transmission = s[base_trans_start:base_trans_end]
          transmission = re.sub(r'\n\s*<groups\b.*?</groups>', '', transmission, flags=re.S)
          transmission = transmission.replace('name="$l10n_info_transmission_manualWithPowerShiftGroups"', 'name="8/4"', 1)
          if '<groups ' in transmission:
              raise SystemExit('Failed to remove L/H groups from Widmo transmission copy')

          start = s.index('<motorConfiguration name="1934 Widmo"')
          end = s.index('</motorConfiguration>', start)
          segment = s[start:end]
          if '<transmission' in segment:
              raise SystemExit('Widmo unexpectedly already has a transmission block')
          motor_end = segment.index('</motor>') + len('</motor>')
          indent = '        '
          transmission_indented = transmission
          segment = segment[:motor_end] + '\n' + indent + transmission_indented + segment[motor_end:]
          s = s[:start] + segment + s[end:]
          p.write_text(s, encoding='utf-8')

          p = Path('CHANGELOG.md')
          s = p.read_text(encoding='utf-8')
          addition = '''\n## 1.0.6.0T6\nTest uproszczonej skrzyni wyłącznie dla `1934 Widmo`.\n\nZmiany względem 1.0.6.0T5:\n- Widmo przechodzi z 8F/4R × L/H na bezpośrednią skrzynię 8F/4R,\n- osiem biegów do przodu i cztery wsteczne pozostają; grupy L/H nie są używane przez Widmo,\n- Widmo zachowuje 265 KM, torqueScale 1.000, RWD, COM `0 1.10 -1.80` i tylne forcePointRatio 0.80,\n- pozostałe warianty zachowują 8F/4R × L/H i dotychczasową logikę powershift/ADS.\n\n'''
          marker = '## 1.0.6.0T5'
          if '## 1.0.6.0T6' not in s:
              if marker not in s:
                  raise SystemExit('CHANGELOG T5 marker not found')
              s = s.replace(marker, addition + marker, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('PROJECT_STATE.md')
          s = p.read_text(encoding='utf-8')
          note = '''\n\n### Widmo direct 8/4 gearbox test — 1.0.6.0T6\n- Wyłącznie `1934 Widmo`: własna bezpośrednia skrzynia 8F/4R bez grup L/H.\n- Parametry T5 pozostają: 265 KM, torqueScale 1.000, RWD, COM `0 1.10 -1.80`, rear forcePointRatio 0.80.\n- Pozostałe warianty nadal używają 8F/4R × L/H oraz istniejącego bridge ADS.\n'''
          if '### Widmo direct 8/4 gearbox test — 1.0.6.0T6' not in s:
              s += note
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate source tree
        run: python3 tools/validate_current.py

      - name: Build test ZIP
        run: ./build.sh

      - name: Verify Widmo T6 ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile
          z = zipfile.ZipFile('dist/FS25_Ursus_1654_1954_Pack.zip')
          xml = z.read('Ursus1934.xml').decode('utf-8')
          moddesc = z.read('modDesc.xml').decode('utf-8')
          assert '<version>1.0.6.0T6</version>' in moddesc
          start = xml.index('<motorConfiguration name="1934 Widmo"')
          end = xml.index('</motorConfiguration>', start)
          seg = xml[start:end]
          assert '<transmission ' in seg
          assert 'name="8/4"' in seg
          assert '<groups ' not in seg
          assert seg.count('<forwardGear ') == 8
          assert seg.count('<backwardGear ') == 4
          assert 'hp="265"' in seg
          assert 'torqueScale="1.000"' in seg
          assert 'centerOfMassActive="0 1.10 -1.80"' in seg
          base_start = xml.index('<motorConfiguration name="1674M"')
          base_end = xml.index('</motorConfiguration>', base_start)
          assert '<groups type="POWERSHIFT"' in xml[base_start:base_end]
          print('ZIP Widmo T6 direct 8x4 check: OK')
          PY

      - name: Commit 1.0.6.0T6
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION modDesc.xml Ursus1934.xml UrsusTransmissionFix.lua UrsusColorFix.lua CHANGELOG.md PROJECT_STATE.md
          git commit -m 'Release 1.0.6.0T6 Widmo direct 8x4 gearbox test'
          git push origin HEAD:main

      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET_SHA=$(git rev-parse HEAD)
          cat > /tmp/release-notes.md <<'EOF'
          Widmo direct gearbox experiment following T5.

          - only 1934 Widmo gets its own direct 8F/4R transmission without L/H groups,
          - Widmo keeps 265 hp, torqueScale 1.000, RWD, COM 0 1.10 -1.80 and rear forcePointRatio 0.80,
          - all normal variants retain the existing 8F/4R x L/H powershift transmission and ADS bridge.
          EOF
          gh release create v1.0.6.0T6 dist/FS25_Ursus_1654_1954_Pack.zip \
            --target "$TARGET_SHA" \
            --title '1.0.6.0T6 — Widmo direct 8x4 gearbox test' \
            --prerelease \
            --notes-file /tmp/release-notes.md

      - name: Remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          git rm .github/workflows/release-1.0.6.0T6.yml
          git commit -m 'Remove one-shot 1.0.6.0T6 release workflow'
          git push origin HEAD:main
