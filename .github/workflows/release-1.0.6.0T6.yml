name: Publish 1.0.6.0T6

on:
  push:
    paths:
      - '.github/workflows/release-1.0.6.0T6.yml'

permissions:
  contents: write

jobs:
  prerelease:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Widmo 8x4 gearbox
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          OLD = '1.0.6.0T5'
          VERSION = '1.0.6.0T6'

          current = Path('VERSION').read_text(encoding='utf-8').strip()
          if current != OLD:
              raise SystemExit(f'Expected {OLD}, got {current}')
          Path('VERSION').write_text(VERSION + '\n', encoding='utf-8')

          p = Path('modDesc.xml')
          s = p.read_text(encoding='utf-8')
          old = f'<version>{OLD}</version>'
          new = f'<version>{VERSION}</version>'
          if old not in s:
              raise SystemExit('modDesc version anchor not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          for filename in ('UrsusTransmissionFix.lua', 'UrsusColorFix.lua'):
              p = Path(filename)
              s = p.read_text(encoding='utf-8')
              if OLD not in s:
                  raise SystemExit(f'{filename}: old version marker not found')
              p.write_text(s.replace(OLD, VERSION), encoding='utf-8')

          p = Path('Ursus1934.xml')
          s = p.read_text(encoding='utf-8')
          start = s.index('<motorConfiguration name="1934 Widmo"')
          end = s.index('</motorConfiguration>', start)
          segment = s[start:end]

          transmission_match = re.search(r'<transmission\b.*?</transmission>', segment, flags=re.S)
          if transmission_match is None:
              raise SystemExit('Widmo transmission block not found')
          transmission = transmission_match.group(0)
          groups_match = re.search(r'\n\s*<groups\b.*?</groups>', transmission, flags=re.S)
          if groups_match is None:
              raise SystemExit('Widmo L/H groups block not found')
          transmission = transmission[:groups_match.start()] + transmission[groups_match.end():]
          transmission = re.sub(
              r'name="\$l10n_info_transmission_manualWithPowerShiftGroups"',
              'name="8/4"',
              transmission,
              count=1,
          )
          segment = segment[:transmission_match.start()] + transmission + segment[transmission_match.end():]
          s = s[:start] + segment + s[end:]
          p.write_text(s, encoding='utf-8')

          p = Path('CHANGELOG.md')
          s = p.read_text(encoding='utf-8')
          addition = '''\n## 1.0.6.0T6\nTest uproszczonej skrzyni wyłącznie dla `1934 Widmo`.\n\nZmiany względem 1.0.6.0T5:\n- Widmo przechodzi z 8F/4R × L/H na bezpośrednią skrzynię 8F/4R,\n- usunięto wyłącznie grupy L/H z konfiguracji Widma; osiem biegów do przodu i cztery wsteczne pozostają,\n- Widmo zachowuje 265 KM, torqueScale 1.000, RWD, COM `0 1.10 -1.80` i tylne forcePointRatio 0.80,\n- pozostałe warianty zachowują dotychczasowe 8F/4R × L/H oraz pełną logikę powershift/ADS.\n\n'''
          marker = '## 1.0.6.0T5'
          if '## 1.0.6.0T6' not in s:
              if marker not in s:
                  raise SystemExit('CHANGELOG T5 marker not found')
              s = s.replace(marker, addition + marker, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('PROJECT_STATE.md')
          s = p.read_text(encoding='utf-8')
          note = '''\n\n### Widmo direct 8/4 gearbox test — 1.0.6.0T6\n- T5 poprawił stabilność w zakrętach przy zachowaniu skłonności do wheelie.\n- Wyłącznie `1934 Widmo`: skrzynia bez grup L/H, bezpośrednie 8F/4R.\n- Parametry Widma z T5 pozostają: 265 KM, torqueScale 1.000, RWD, COM `0 1.10 -1.80`, rear forcePointRatio 0.80.\n- Pozostałe silniki nadal używają 8F/4R × L/H i istniejącego bridge ADS.\n'''
          if '### Widmo direct 8/4 gearbox test — 1.0.6.0T6' not in s:
              s += note
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate source tree
        run: python3 tools/validate_current.py

      - name: Build test ZIP
        run: ./build.sh

      - name: Verify Widmo T6 changes in ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile
          z = zipfile.ZipFile('dist/FS25_Ursus_1654_1954_Pack.zip')
          xml = z.read('Ursus1934.xml').decode('utf-8')
          moddesc = z.read('modDesc.xml').decode('utf-8')
          assert '<version>1.0.6.0T6</version>' in moddesc
          start = xml.index('<motorConfiguration name="1934 Widmo"')
          end = xml.index('</motorConfiguration>', start)
          seg = xml[start:end]
          assert 'name="8/4"' in seg
          assert '<groups ' not in seg
          assert seg.count('<forwardGear ') == 8
          assert seg.count('<backwardGear ') == 4
          assert 'hp="265"' in seg
          assert 'torqueScale="1.000"' in seg
          assert 'centerOfMassActive="0 1.10 -1.80"' in seg
          chip_start = xml.index('<motorConfiguration name="1934 Chip"')
          chip_end = xml.index('</motorConfiguration>', chip_start)
          chip_seg = xml[chip_start:chip_end]
          assert '<groups type="POWERSHIFT"' in chip_seg
          print('ZIP Widmo T6 direct 8x4 check: OK')
          PY

      - name: Commit 1.0.6.0T6
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION modDesc.xml Ursus1934.xml UrsusTransmissionFix.lua UrsusColorFix.lua CHANGELOG.md PROJECT_STATE.md
          git commit -m 'Release 1.0.6.0T6 Widmo direct 8x4 gearbox test'
          git push origin HEAD:main

      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET_SHA=$(git rev-parse HEAD)
          cat > /tmp/release-notes.md <<'EOF'
          Widmo direct gearbox experiment following T5.

          Changes:
          - only 1934 Widmo changes from 8F/4R x L/H to direct 8F/4R,
          - eight forward and four reverse gears remain; the L/H powershift groups are removed only from Widmo,
          - Widmo keeps 265 hp, torqueScale 1.000, RWD, COM 0 1.10 -1.80 and rear forcePointRatio 0.80,
          - all other engine variants retain the existing 8F/4R x L/H transmission and ADS bridge.

          Test goal: check whether the more direct 8/4 drivetrain gives Widmo the intended character and torque delivery without disturbing the established gearbox behavior of the normal tractor variants.
          EOF
          gh release create v1.0.6.0T6 dist/FS25_Ursus_1654_1954_Pack.zip \
            --target "$TARGET_SHA" \
            --title '1.0.6.0T6 — Widmo direct 8x4 gearbox test' \
            --prerelease \
            --notes-file /tmp/release-notes.md

      - name: Remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          git rm .github/workflows/release-1.0.6.0T6.yml
          git commit -m 'Remove one-shot 1.0.6.0T6 release workflow'
          git push origin HEAD:main
